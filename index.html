<!DOCTYPE html>
<html lang="ro" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>BeeManager Pro</title>
<meta name="description" content="Gestionarea stupinei: stupi, inspecții, recolte, tratamente, varroa, financiar.">
<meta name="theme-color" content="#0f0e0e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BeeManager">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Libraries (local, work offline) -->
<script src="lib/chart.umd.min.js"></script>
<link rel="stylesheet" href="lib/fontawesome/css/all.min.css">

<!-- App styles -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offlineBar" class="offline-bar">
  <span>📴 Offline — datele se salvează local pe telefon</span>
  <button onclick="openManualWeather()" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:3px 10px;border-radius:20px;font-size:.72rem;cursor:pointer;">🌡️ Vreme manuală</button>
</div>
<!-- Mobile bottom navigation -->
<nav class="mob-nav" id="mobNav"></nav>
<!-- More drawer overlay + drawer -->
<div class="more-ov" id="moreOv" onclick="closeMoreDrw()"></div>
<div class="more-drw" id="moreDrw">
  <div class="more-drw-handle"></div>
  <div class="more-drw-grid" id="moreDrwGrid"></div>
</div>
<div class="ov" id="ov"></div>
<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-logo"><span style="font-size:1.6rem">🐝</span><span class="nm">BeeManager Pro</span><button class="sb-tog" id="sbTogBtn" onclick="toggleSB()" title="Toggle meniu"><i class="fas fa-chevron-left" id="sbTogIco"></i></button></div>
    <nav id="nav" style="padding:5px 0;flex:1;"></nav>
  </aside>
  <main class="main">
    <div class="tb" id="tb">
      <button class="bgr" id="bgr"><i class="fas fa-bars"></i></button>
      <span class="tb-t" id="tbt">Dashboard</span>
      <button onclick="openManualWeather()" style="background:none;border:none;color:var(--mut);font-size:.75rem;cursor:pointer;padding:6px 8px;border-radius:var(--rs);display:flex;align-items:center;gap:4px;" title="Vreme" id="tbWeather">
        <span id="tbWIcon">🌡️</span>
        <span id="tbWTemp" style="font-size:.72rem;font-weight:700;color:var(--gold);"></span>
      </button>
    </div>
    <div id="pg"></div>
  </main>
</div>
<nav class="tnav" id="tnav"><div class="tnav-logo"><span>🐝</span></div></nav>

<!-- App code, one file per module. Order matters:
     i18n → core → config → weather → nav → modules → export → app (startup) -->
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/plants.js"></script>
<script src="js/config.js"></script>
<script src="js/weather.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/hives.js"></script>
<script src="js/inspections.js"></script>
<script src="js/frames.js"></script>
<script src="js/queens.js"></script>
<script src="js/honey.js"></script>
<script src="js/treatments.js"></script>
<script src="js/inventory.js"></script>
<script src="js/pastorage.js"></script>
<script src="js/calendar.js"></script>
<script src="js/analytics.js"></script>
<script src="js/settings.js"></script>
<script src="js/calculator.js"></script>
<script src="js/devcalc.js"></script>
<script src="js/nucs.js"></script>
<script src="js/feeding.js"></script>
<script src="js/tasks.js"></script>
<script src="js/varroa.js"></script>
<script src="js/treatvarroa.js"></script>
<script src="js/finance.js"></script>
<script src="js/export.js"></script>
<script src="js/fisa.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
