<!DOCTYPE html>
<html lang="ro" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>BeeManager Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
// FIX: CDN fallback for Chart.js
window.addEventListener('error', function(e) {
  if(e.target && e.target.src && e.target.src.includes('chart')) {
    console.warn('Chart.js failed to load from CDN');
    window._chartFailed = true;
  }
}, true);
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f0e0e;--sur:#1a1919;--card:#222121;--bdr:#2c2b2b;--txt:#f5f3ef;--mut:#b9b5ae;--gold:#e6b422;--gold2:#f5c542;--danger:#e07c4c;--ok:#6fbf4c;--info:#4a9eff;--sh:0 8px 24px rgba(0,0,0,.45);--rl:20px;--rm:14px;--rs:10px;--sw:256px;}
body{background:var(--bg);color:var(--txt);overflow-x:hidden;}
body.light{--bg:#fefaf0;--sur:#fff7e8;--card:#ffffff;--bdr:#f0e3c9;--txt:#1f1b13;--mut:#5c564b;}
.app{display:flex;min-height:100vh;}
.sb{width:var(--sw);background:var(--sur);border-right:1px solid var(--bdr);position:fixed;height:100vh;z-index:200;overflow-y:auto;overflow-x:hidden;transition:width .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.sb.coll{width:58px;}
.sb.coll .nm{display:none;}
.sb.coll .ni span{display:none;}
.sb.coll .ni{justify-content:center;padding:11px 0;margin:2px 4px;}
.sb.coll .ni.on{border-left:none;border-radius:var(--rs);padding-left:0;}
.sb.coll .sb-logo{justify-content:center;padding:12px 0;gap:0;}
.sb.coll .sb-tog-lbl{display:none;}
.sb-tog{background:none;border:none;color:var(--mut);cursor:pointer;padding:7px;min-height:auto;box-shadow:none;font-size:.85rem;border-radius:var(--rs);transition:color .15s,background .15s;line-height:1;margin-left:auto;flex-shrink:0;}
.sb-tog:hover{color:var(--gold);background:rgba(230,180,34,.1);filter:none;transform:none;}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;}
.sb-logo .nm{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--gold),#ffcf4a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ni{display:flex;align-items:center;gap:11px;padding:11px 16px;margin:2px 7px;border-radius:var(--rs);color:var(--mut);cursor:pointer;transition:all .18s;font-size:.88rem;min-height:44px;}
.ni i{width:17px;text-align:center;font-size:.95rem;}
.ni.on{background:rgba(230,180,34,.15);color:var(--gold);border-left:3px solid var(--gold);padding-left:13px;}
.ni:hover:not(.on){background:rgba(230,180,34,.07);color:var(--txt);}
.main{flex:1;margin-left:var(--sw);padding:20px 24px;transition:margin .3s;}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;}
.ov.show{display:block;}
.tb{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:var(--sur);border-bottom:1px solid var(--bdr);z-index:150;align-items:center;padding:0 12px;gap:10px;}
.tb-t{font-weight:700;font-size:.95rem;color:var(--gold);flex:1;}
.bgr{background:none;border:none;color:var(--gold);font-size:1.25rem;cursor:pointer;padding:8px;box-shadow:none;min-height:auto;}
.bgr:hover{transform:none;filter:none;}
.g{display:grid;gap:14px;margin-bottom:18px;}
.gs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.gc{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
.c{background:var(--card);border-radius:var(--rm);padding:15px;box-shadow:var(--sh);border:1px solid rgba(230,180,34,.18);transition:transform .2s,box-shadow .2s;}
.c:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.55);}
.cl{font-size:.73rem;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);margin-bottom:3px;}
.cv{font-size:1.9rem;font-weight:800;margin:5px 0;}
.cs{font-size:.75rem;color:var(--mut);}
.ct{font-size:.92rem;font-weight:700;margin-bottom:9px;color:var(--gold2);}
.btn{background:linear-gradient(145deg,var(--gold),#c8911a);border:none;padding:10px 18px;border-radius:40px;font-weight:700;color:#121212;cursor:pointer;transition:all .18s;font-size:.86rem;min-height:40px;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{filter:brightness(1.08);}
.sm{padding:7px 12px;font-size:.76rem;min-height:32px;}
.gh{background:rgba(255,255,255,.09);color:var(--txt);}
.bd{background:linear-gradient(145deg,#e07c4c,#c05a30);color:#fff;}
.be{background:rgba(74,158,255,.14);color:var(--info);border:1px solid rgba(74,158,255,.28);}
.be:hover{background:rgba(74,158,255,.24);}
.br{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.bg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap;}
.gg{background:rgba(111,191,76,.2);color:#6fbf4c;}
.gy{background:rgba(230,180,34,.2);color:#e6b422;}
.gr{background:rgba(224,124,76,.2);color:#e07c4c;}
.gb{background:rgba(74,158,255,.2);color:#4a9eff;}
.al{padding:9px 13px;border-radius:var(--rs);margin:7px 0;font-size:.83rem;}
.alw{background:rgba(230,180,34,.12);border-left:4px solid var(--gold);}
.ald{background:rgba(224,124,76,.12);border-left:4px solid var(--danger);}
.alo{background:rgba(111,191,76,.12);border-left:4px solid var(--ok);}
.ali{background:rgba(74,158,255,.12);border-left:4px solid var(--info);}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;}
.mb-b{background:var(--card);border-radius:var(--rl);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:20px;border-top:3px solid var(--gold);}
.mt{font-size:1.1rem;font-weight:800;color:var(--gold);margin-bottom:13px;}
label.L{font-size:.78rem;font-weight:700;color:var(--gold);display:block;margin-top:9px;margin-bottom:3px;}
input,select,textarea{background:var(--sur);border:1px solid var(--bdr);padding:9px 12px;border-radius:var(--rs);color:var(--txt);width:100%;font-size:.88rem;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
input[type=checkbox],input[type=radio]{width:auto;margin-right:5px;}
.hint{font-size:.66rem;color:var(--mut);margin-top:2px;display:block;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.dv{border-top:1px solid var(--bdr);margin:12px 0;padding-top:11px;}
.stt{font-size:.88rem;font-weight:700;color:var(--gold2);margin-bottom:7px;}
.ck{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:.85rem;}
.ck label{color:var(--txt);margin:0;}
.wp{display:flex;align-items:center;gap:11px;padding:12px;background:rgba(255,255,255,.04);border-radius:var(--rm);margin-top:9px;}
.wi{font-size:2rem;}
.gauge{background:rgba(0,0,0,.25);border-radius:20px;height:6px;margin:8px 0;overflow:hidden;}
.gf{height:100%;background:linear-gradient(90deg,var(--gold),#ffcf4a);border-radius:20px;}
.gl{display:flex;justify-content:space-between;font-size:.63rem;color:var(--mut);}
.bb{display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--rs);margin-top:8px;}
.sb2{display:flex;gap:9px;align-items:center;margin:10px 0;}
.sb2 input{margin:0;flex:1;}
.est{background:rgba(230,180,34,.06);border:1px solid rgba(230,180,34,.15);border-radius:var(--rm);padding:12px;margin:7px 0;}
.er{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.er input[type=number]{width:70px;flex-shrink:0;margin:0;}
.er select{flex:1;margin:0;}
.esb{font-size:.76rem;color:var(--mut);min-width:52px;}
.etot{font-size:1.05rem;font-weight:800;color:var(--gold);margin-top:6px;}
.rt{width:100%;border-collapse:collapse;margin-top:7px;font-size:.8rem;}
.rt th{padding:6px 9px;text-align:left;color:var(--gold);background:rgba(230,180,34,.1);}
.rt td{padding:6px 9px;border-bottom:1px solid var(--bdr);}
.sa{background:rgba(224,124,76,.12);border:1px solid var(--danger);border-radius:var(--rm);padding:12px;margin-bottom:13px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border-left:5px solid var(--gold);padding:10px 18px;border-radius:40px;z-index:2000;box-shadow:var(--sh);font-size:.86rem;animation:ti .3s;}
@keyframes ti{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:900px){:root{--sw:215px;}.main{padding:14px;}.gs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}}
/* TOP NAV (mobile) — dezactivat */
.tnav{display:none!important;}

/* ═══════════════════════════════════════════════
   MOBILE: bottom tab navigation
   ═══════════════════════════════════════════════ */
.mob-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  height:60px;
  background:var(--sur);   /* --sur este definit, nu --sb */
  border-top:2px solid var(--bdr);
  z-index:1100;
  padding:0 2px;
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 24px rgba(0,0,0,.45);
}
.more-ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);z-index:1080;
  backdrop-filter:blur(3px);
}
.more-ov.show{display:block;}
.more-drw{
  position:fixed;left:0;right:0;bottom:60px;
  background:var(--sur);   /* fix transparent */
  border-top:1px solid var(--bdr);
  border-radius:22px 22px 0 0;
  z-index:1090;
  padding:12px 14px 20px;
  transform:translateY(110%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow:0 -16px 48px rgba(0,0,0,.55);
}
.more-drw.open{transform:translateY(0);}
.more-drw-handle{
  width:40px;height:4px;border-radius:2px;
  background:var(--bdr);margin:0 auto 14px;
}
.more-drw-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:9px;
}
.mob-ni{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;padding:6px 2px 4px;
  background:none;border:none;
  color:var(--mut);
  cursor:pointer;font-family:inherit;
  transition:color .14s;
  position:relative;
  -webkit-tap-highlight-color:transparent;
}
.mob-ni.active{color:var(--gold);}
.mob-ni i{font-size:1.2rem;line-height:1;}
.mob-ni span{font-size:.52rem;white-space:nowrap;font-weight:600;letter-spacing:.2px;}
.mob-ni.active::after{
  content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:28px;height:3px;border-radius:0 0 3px 3px;
  background:var(--gold);
}
.drw-ni{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;padding:14px 4px;
  background:var(--card);border:1px solid var(--bdr);
  border-radius:14px;cursor:pointer;color:var(--txt);
  text-align:center;
  transition:background .14s,color .14s,border-color .14s;
  -webkit-tap-highlight-color:transparent;
}
.drw-ni.active{
  background:rgba(230,180,34,.14);color:var(--gold);
  border-color:rgba(230,180,34,.4);
}
.drw-ni i{font-size:1.15rem;}
.drw-ni span{font-size:.6rem;white-space:nowrap;font-weight:600;}

/* ── Mobile layout ─────────────────────────── */
@media(max-width:650px){
  :root{--sw:0px;}

  /* Sidebar: ascuns complet pe mobil */
  .sb{display:none!important;}

  /* Topbar: fix deasupra, inalt 52px */
  .tb{
    display:flex;
    position:fixed;top:0;left:0;right:0;
    height:52px;z-index:500;
    background:var(--sur);
    border-bottom:1px solid var(--bdr);
    box-shadow:0 2px 12px rgba(0,0,0,.3);
    padding:0 14px;
    align-items:center;gap:10px;
  }
  .tb-t{font-weight:800;font-size:1rem;color:var(--gold);flex:1;}

  /* Main: lasa spatiu pentru topbar(52px) sus + bottom nav(60px) jos */
  .main{
    margin-left:0!important;
    padding:66px 12px 80px !important;
    scroll-padding-bottom:80px; /* input-urile focusate nu se ascund sub bara */
  }

  /* Bottom nav: arata pe mobil */
  .mob-nav{display:flex;}

  /* Grile responsive */
  .gs{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .gc{grid-template-columns:1fr;}
  .r2{grid-template-columns:1fr 1fr;}
  .r3{grid-template-columns:1fr;}
  .g{gap:10px;margin-bottom:14px;}

  /* Carduri: padding mai mic */
  .c{padding:13px;}

  /* Modal bottom sheet — acoperă tot ecranul disponibil */
  .mb{
    padding:0;
    padding-bottom:60px; /* spatiu bottom nav */
    align-items:flex-end;
    background:rgba(0,0,0,.72);
  }
  .mb-b{
    max-height:calc(100vh - 60px);
    max-width:100%;width:100%;
    border-radius:22px 22px 0 0;
    border-top:3px solid var(--gold);
    padding:16px 14px 32px;
    overflow-y:scroll !important;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  /* Titlu modal — scrollează cu pagina, nu sticky */
  .mt{
    font-size:1.05rem;
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--bdr);
    position:static !important;
  }
  /* Save/Anulează — la finalul formularului, nu sticky */
  .mb-b .br{
    position:static !important;
    padding:20px 0 12px;
    margin-top:16px;
    border-top:1px solid var(--bdr);
  }

  /* Offline bar */
  body.is-offline .main{padding-top:86px !important;}
  body.is-offline .tb{top:32px;}

  /* Tabele: scroll orizontal */
  .rt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--rs);}

  /* Fonts mai mari pt. lizibilitate */
  .cl{font-size:.7rem;}
  .cv{font-size:1.6rem;}
  .ct{font-size:.88rem;}

  /* Butoane: mai mari pe mobil */
  .btn{min-height:46px;padding:11px 18px;font-size:.88rem;}
  .btn.sm{min-height:40px;padding:9px 13px;font-size:.78rem;}
}

@media(max-width:380px){
  .gs{grid-template-columns:1fr 1fr;}
  .r2{grid-template-columns:1fr;}
  .main{padding:64px 9px 80px !important;}
  .cv{font-size:1.35rem !important;}
  .c{padding:11px;}
}

@media(min-width:1350px){
  .main{padding:24px 36px;}
  .gs{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));}
  .gc{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
}/* ── Touch targets & mobile inputs ──────────────────────────── */
/* font-size:16px pe inputs DOAR pe mobil — previne zoom iOS */
@media(max-width:650px){
  input,select,textarea{font-size:16px !important;-webkit-appearance:none;}
  /* Ascunde hamburger pe mobil — nu avem sidebar */
  .bgr{display:none !important;}
  /* Logo mic in topbar */
  .tb::before{content:"🐝";font-size:1.3rem;margin-right:4px;}
}
input[type=checkbox],input[type=radio]{
  min-height:auto !important;min-width:auto !important;
  width:20px;height:20px;cursor:pointer;
  -webkit-appearance:auto;appearance:auto;
  accent-color:var(--gold);
}
/* Touch target minim 44px pe butoane */
.btn{min-height:44px;}
.btn.sm{min-height:40px;}
/* Pressed state */
.btn:active{transform:scale(0.97);transition:transform .05s;}
.mob-ni:active,.drw-ni:active{opacity:.65;}
/* Tabel scroll orizontal */
.rt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rt{display:table;white-space:nowrap;min-width:100%;}
.br .btn.sm{flex-shrink:0;}
/* FIX: confirmModal styling */
.confirm-msg{font-size:.95rem;line-height:1.5;margin:10px 0 16px 0;color:var(--txt);}
/* FIX: Required field indicator */
.L.required::after{content:" *";color:var(--danger);font-size:.7rem;}
/* FIX: Error state for inputs */
input.err,select.err{border-color:var(--danger);background:rgba(224,124,76,.07);}
.field-err{font-size:.72rem;color:var(--danger);margin-top:3px;display:block;}
/* ── Dashboard KPI cards mobile ─────────────────────────────── */
@media(max-width:650px){
  .cv{font-size:1.55rem !important;}
  /* Dezactiveaza hover pe touch — evita "stuck hover" pe iOS */
  @media(hover:none){
    .c:hover{transform:none;box-shadow:var(--sh);}
    .btn:hover{filter:none;}
    .ni:hover{background:none;color:var(--mut);}
  }
  /* Hive cards */
  .bb{padding:8px;}
  /* Reduce margin pe mobile */
  .dv{margin:8px 0;padding-top:8px;}
  /* Mai mic titlu sectiuni */
  h2{font-size:1.05rem !important;}
  /* Alerte vizibile */
  .sa{padding:10px;}
  /* Weather widget in dashboard */
  .wp{padding:10px;gap:8px;}
  .wi{font-size:1.6rem;}
}
.offline-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:4000;background:rgba(180,80,40,.96);color:#fff;font-size:.75rem;font-weight:700;padding:5px 14px;gap:10px;align-items:center;justify-content:center;backdrop-filter:blur(4px);flex-wrap:wrap;}
.offline-bar.show{display:flex;}
body.is-offline .sb{top:32px;}
body.is-offline .main{padding-top:52px;}
/* ── Drive status badges ── */
.drv-ok{background:rgba(111,191,76,.1);border:1px solid var(--ok);border-radius:var(--rs);padding:9px 12px;font-size:.8rem;display:flex;align-items:center;gap:8px;}
.drv-no{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:var(--rs);padding:9px 12px;font-size:.8rem;}
.drv-pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
/* ── Per-hive save indicator ── */
.hive-save-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-left:4px;opacity:0;transition:opacity .4s;}
.hive-save-dot.show{opacity:1;}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="offlineBar" class="offline-bar">
  <span>📴 Offline — datele se salvează local pe telefon</span>
  <button onclick="openManualWeather()" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:3px 10px;border-radius:20px;font-size:.72rem;cursor:pointer;">🌡️ Vreme manuală</button>
</div>
<!-- Mobile bottom navigation -->
<nav class="mob-nav" id="mobNav"></nav>
<!-- More drawer overlay + drawer -->
<div class="more-ov" id="moreOv" onclick="closeMoreDrw()"></div>
<div class="more-drw" id="moreDrw">
  <div class="more-drw-handle"></div>
  <div class="more-drw-grid" id="moreDrwGrid"></div>
</div>
<div class="ov" id="ov"></div>
<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-logo"><span style="font-size:1.6rem">🐝</span><span class="nm">BeeManager Pro</span><button class="sb-tog" id="sbTogBtn" onclick="toggleSB()" title="Toggle meniu"><i class="fas fa-chevron-left" id="sbTogIco"></i></button></div>
    <nav id="nav" style="padding:5px 0;flex:1;"></nav>
  </aside>
  <main class="main">
    <div class="tb" id="tb">
      <button class="bgr" id="bgr"><i class="fas fa-bars"></i></button>
      <span class="tb-t" id="tbt">Dashboard</span>
      <button onclick="openManualWeather()" style="background:none;border:none;color:var(--mut);font-size:.75rem;cursor:pointer;padding:6px 8px;border-radius:var(--rs);display:flex;align-items:center;gap:4px;" title="Vreme" id="tbWeather">
        <span id="tbWIcon">🌡️</span>
        <span id="tbWTemp" style="font-size:.72rem;font-weight:700;color:var(--gold);"></span>
      </button>
    </div>
    <div id="pg"></div>
  </main>
</div>
<nav class="tnav" id="tnav"><div class="tnav-logo"><span>🐝</span></div></nav>
<script>
// ═══════════════════════════════════════════
// TRANSLATIONS
// ═══════════════════════════════════════════
const TR={
ro:{
  nav_dashboard:"Dashboard",nav_hives:"Stupi",nav_queens:"Regine",nav_inspections:"Inspecții",

function initLoc(){
  if(!navigator.onLine){if(!D.weather)toast("📴 Offline — introduceți vreme manual","🌡️");return;}
  if(D.userLoc){var age=D.weather?(Date.now()-(D.weather.ts||0)):Infinity;if(age>15*60*1000)fetchW(D.userLoc.lat,D.userLoc.lon);}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){D.userLoc={lat:p.coords.latitude,lon:p.coords.longitude};save(false);fetchW(p.coords.latitude,p.coords.longitude);},
      function(){if(!D.weather)toast("📍 "+(D.settings.lang==="en"?"Enable location for real weather":"Activați locația pentru vreme reală"));},
      {timeout:8000}
    );
  }
}

async function fetchW(lat,lon){
  if(!navigator.onLine){toast("📴 Offline — vreme din cache sau manuală","🌡️");return;}
  try{
    var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,precipitation,weathercode,windspeed_10m,relativehumidity_2m&timezone=auto&forecast_days=1");
    if(!r.ok)throw 0;
    var d=await r.json(),c=d.current,wi=wmoI(c.weathercode);
    D.weather={temp:Math.round(c.temperature_2m*10)/10,prec:c.precipitation,wc:c.weathercode,wind:Math.round(c.windspeed_10m),hum:c.relativehumidity_2m,ic:wi.i,rain:wi.r||c.precipitation>0,ts:Date.now(),manual:false};
    save(false);
    if(curP==="dashboard")renderDashboard();
  }catch(e){console.warn("Weather failed",e);if(!D.weather)toast("⚠️ Vreme indisponibilă — introduceți manual","🌡️");}
}

function beeAct(w){
  if(!w)return{ic:"❓",ttl:t("bee_unknown_t"),det:t("bee_unknown_d"),bg:"rgba(255,255,255,.04)"};
  var temp=w.temp,rain=w.rain||(w.prec>0),wind=w.wind;
  if(rain)return{ic:"🌧️",ttl:t("bee_rain_t"),det:t("bee_rain_d"),bg:"rgba(74,158,255,.12)"};
  if(temp<=8)return{ic:"❄️",ttl:t("bee_freeze_t"),det:t("bee_freeze_d"),bg:"rgba(74,158,255,.1)"};
  if(temp<=12)return{ic:"🥶",ttl:t("bee_cold_t"),det:t("bee_cold_d"),bg:"rgba(74,158,255,.08)"};
  if(temp<=15)return{ic:"🐝",ttl:t("bee_clean_t"),det:t("bee_clean_d"),bg:"rgba(230,180,34,.08)"};
  if(wind>30)return{ic:"💨",ttl:t("bee_wind_t"),det:t("bee_wind_d"),bg:"rgba(224,124,76,.1)"};
  if(temp>38)return{ic:"🌡️",ttl:t("bee_heat_ext_t"),det:t("bee_heat_ext_d"),bg:"rgba(224,124,76,.2)"};
  if(temp>33)return{ic:"🌡️",ttl:t("bee_heat_t"),det:t("bee_heat_d"),bg:"rgba(224,124,76,.1)"};
  if(temp>=20)return{ic:"🐝🐝🐝",ttl:t("bee_active_t"),det:t("bee_active_d"),bg:"rgba(111,191,76,.1)"};
  return{ic:"🐝🐝",ttl:t("bee_good_t"),det:t("bee_good_d"),bg:"rgba(230,180,34,.06)"};
}

function doy(y,m,d){return Math.floor((new Date(y,m-1,d)-new Date(y,0,0))/86400000);}
function cdoy(){var n=new Date();return doy(n.getFullYear(),n.getMonth()+1,n.getDate());}
function getLatOffset(){
  // Adjust bloom dates by latitude vs 45.5°N (Central Romania/Europe reference)
  // ~4 days later per degree north, ~4 days earlier per degree south
  if(!D.userLoc)return 0;
  return Math.round((D.userLoc.lat-45.5)*4);
}
function getFlow(){
  var cd=cdoy(),yr=new Date().getFullYear(),off=getLatOffset();
  return PLANTS.find(function(p){return cd>=doy(yr,p.sm,p.sd)+off&&cd<=doy(yr,p.em,p.ed)+off;})||null;
}

function mapWeatherLabel(){

  var low=D.inventory.filter(function(i){return isLowStock(i);});
  var totH=D.honeyHarvests.reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);
  var pend=D.treatments.filter(function(t2){return new Date(t2.date)>new Date();}).length;
  var lastArr=[].concat(D.inspections).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var last=lastArr[0];
  var tmpPct=w?Math.min(100,Math.max(0,(w.temp/40)*100)):0;
  var ago=w?Math.round((Date.now()-w.ts)/60000):null;
  var agoL=ago!==null?(ago<2?"acum/now":"acum "+ago+" min"):"";
  var strong=D.hives.filter(function(h){return h.str==="puternic";}).length;
  var med=D.hives.filter(function(h){return h.str==="mediu";}).length;
  var slb=D.hives.filter(function(h){return h.str==="slab";}).length;

  } else if(fl){
    var tmpOk=w&&w.temp>=fl.nt[0]&&w.temp<=fl.nt[1];

    culesH='<div class="bb" style="background:rgba(224,124,76,.12)"><span style="font-size:1.6rem">⏸️</span><div><strong>'+t("fl_between")+'</strong><br><small style="color:var(--mut)">'+t("fl_between_d")+'</small></div></div>';
  }

  // Weather card
  var wCard="";
  if(w){
    var wLbl=w.wc!==undefined?wmoLabel(w.wc):(w.lbl||"");
    wCard='<div class="c"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;"><div class="cl">🌦️ '+(agoL?'— '+agoL:'')+'</div><button class="btn sm gh" onclick="if(D.userLoc)fetchW(D.userLoc.lat,D.userLoc.lon)">'+t("w_refresh")+'</button></div>'
      +'<div class="wp" style="background:'+act.bg+'"><span class="wi">'+w.ic+'</span><div>'
      +'<div style="font-size:1.4rem;font-weight:800">'+showTemp(w.temp)+' <small style="font-size:.9rem;font-weight:400">'+wLbl+'</small></div>'
      +'<div style="font-size:.76rem;color:var(--mut)">💨 '+w.wind+' km/h · 💧 '+w.hum+'% · 🌧️ '+w.prec+' mm</div>'
      +'<div style="color:var(--gold);font-weight:700;margin-top:3px;">'+act.ic+' '+act.ttl+'</div>'
      +'<div style="font-size:.74rem;color:var(--mut)">'+act.det+'</div>'
      +'</div></div>'
      +'<div class="gauge"><div class="gf" style="width:'+tmpPct+'%"></div></div>'
      +(function(){var gl=tempGaugeLabels();return'<div class="gl">'+gl.map(function(l){return'<span>'+l+'</span>';}).join('')+'</div>';})()
      +culesH+'</div>';
  } else {
    wCard='<div class="c"><div class="cl">🌦️</div><div class="al alw" style="margin-top:7px;">'+t("w_no_loc")+'</div>'+culesH+'</div>';

  var stockA=low.length?'<div class="sa"><strong>'+t("dash_low_stock_alert")+' — '+low.length+'</strong>'+low.map(function(i){return'<div style="margin-top:3px;font-size:.8rem;">📦 <strong>'+i.name+'</strong>: '+i.qty+' '+t("inv_units")+' ('+t("inv_min_d")+' '+i.min+')</div>';}).join("")+'<button class="btn sm" style="margin-top:8px" onclick="go(\'inventory\')">'+t("dash_manage_inv")+'</button></div>':"";

  // Pastorare active widget
  var pastActive=D.pastorage.filter(function(p){return !p.endDate||new Date(p.endDate)>=new Date();});

  if(pastActive.length){
    pastHTML='<div class="c" style="margin-top:14px;"><div class="ct">'+t("dash_past_label")+'</div>'
      +pastActive.map(function(p){
        var hv=D.hives.find(function(h){return h.id===p.hiveId;});

  // Only show if the test is recent (≤30 days)

  // ── Stoc miere rămas ──────────────────────────────────────────

  },0);
  var honeyStock=Math.max(0,totH-totHoneySold);
  var isEN=D.settings.lang==="en";
  var honeyStockColor=honeyStock<=0?"var(--mut)":honeyStock<10?"var(--gold)":"var(--ok)";

    +'<div class="cs">'+(isEN?"harvested":"recoltat")+' '+totH.toFixed(1)+' · '+(isEN?"sold":"vândut")+' '+totHoneySold.toFixed(1)+' kg</div>'
    +'</div>';

  var finCardH='<div class="c" style="cursor:pointer;" onclick="go(\'financiar\')"><div class="cl">'+t("fin_dash_profit")+' <span style="font-size:.6rem;font-weight:400;color:var(--mut);">'+t("fin_dash_this_year")+'</span></div><div class="cv" style="color:'+(finNet>=0?"var(--ok)":"var(--danger)")+';">'+(finNet>=0?"+":"")+finNet.toFixed(0)+' RON</div><div class="cs">'+(finInc>0||finExp>0?'↑ '+finInc.toFixed(0)+' · ↓ '+finExp.toFixed(0):(D.settings.lang==="en"?"No data yet":"Fără date"))+'</div></div>';

  // ── Tasks: build alerts + urgent panel + KPI ──────────────────
  var todayStr=new Date().toISOString().slice(0,10);
  var tmrStr=new Date(Date.now()+86400000).toISOString().slice(0,10);
  var pendingTasks=(D.tasks||[]).filter(function(tk){return !tk.done;});
  var overdueTasks=pendingTasks.filter(function(tk){return tk.dueDate&&tk.dueDate<todayStr;}).sort(function(a,b){return a.dueDate>b.dueDate?1:-1;});
  var todayTasks=pendingTasks.filter(function(tk){return tk.dueDate===todayStr;});
  var tmrTasks=pendingTasks.filter(function(tk){return tk.dueDate===tmrStr;});
  var urgentTasks=overdueTasks.concat(todayTasks).concat(tmrTasks).slice(0,5);

  // Task alert banner for overdue
  var tkAlertA=overdueTasks.length
    ?'<div class="sa" style="background:rgba(200,100,20,.12);border-color:rgba(200,100,20,.5);margin-bottom:10px;">'
      +'<strong>⏰ '+(D.settings.lang==="en"?"You have "+overdueTasks.length+" overdue task(s)!":"Ai "+overdueTasks.length+" sarcin"+(overdueTasks.length===1?"ă":"i")+" depășit"+(overdueTasks.length===1?"ă":"e")+"!")+'</strong>'
      +'<div style="margin-top:3px;font-size:.76rem;color:var(--mut);">'+overdueTasks.slice(0,3).map(function(tk){return'📋 '+tk.title+(tk.dueDate?' ('+tk.dueDate+')':'');}).join(' &nbsp;·&nbsp; ')+'</div>'
      +'<button class="btn sm" style="margin-top:8px;" onclick="go(\'sarcini\')">'+t("nav_sarcini")+' →</button>'
      +'</div>'
    :"";

  // KPI card for tasks
  var tkKpiH='<div class="c" style="cursor:pointer;" onclick="go(\'sarcini\')">'
    +'<div class="cl">'+t("tk_kpi_pending")+'</div>'
    +'<div class="cv" style="color:'+(overdueTasks.length?"var(--danger)":pendingTasks.length?"var(--gold)":"var(--ok)")+';">'+pendingTasks.length+'</div>'
    +'<div class="cs">'+(overdueTasks.length?overdueTasks.length+(D.settings.lang==="en"?" overdue":" depășite"):(D.settings.lang==="en"?"all on time":"la timp"))+'</div>'
    +'</div>';

  // Urgent tasks panel
  var prioCols={high:"var(--danger)",medium:"var(--gold)",low:"var(--ok)"};
  var tkPanelH='<div class="c" style="margin-top:14px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    +'<div class="ct" style="margin:0;">'+t("tk_dash_title")+'</div>'
    +'<button class="btn sm gh" onclick="go(\'sarcini\')" style="font-size:.72rem;padding:4px 10px;">'+t("tk_dash_see_all")+'</button>'
    +'</div>';
  if(!urgentTasks.length){
    tkPanelH+='<div style="font-size:.8rem;color:var(--mut);padding:6px 0;">'+t("tk_dash_none")+'</div>';
  }else{
    tkPanelH+=urgentTasks.map(function(tk){
      var hv=D.hives.find(function(h){return h.id===tk.hiveId;});
      var isOvd=tk.dueDate&&tk.dueDate<todayStr;
      var isTdy=tk.dueDate===todayStr;
      var dueLbl=isOvd?('<span style="color:var(--danger);font-weight:700;">⏰ '+t("tk_overdue")+'</span>')
        :isTdy?('<span style="color:var(--gold);font-weight:700;">📅 '+t("tk_today")+'</span>')
        :('<span style="color:var(--mut);">🌅 '+t("tk_tomorrow")+'</span>');
      var col=prioCols[tk.priority]||"var(--mut)";
      return'<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--bdr);">'
        +'<div style="width:3px;height:32px;border-radius:3px;background:'+col+';flex-shrink:0;"></div>'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:.82rem;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+tk.title+'</div>'
        +'<div style="font-size:.7rem;color:var(--mut);">'+dueLbl+(hv?' &nbsp;🏠 '+hv.name:"")+(tk.category?' &nbsp;'+tk.category.split(' ')[0]:"")+'</div>'
        +'</div>'
        +'<button class="btn sm" style="padding:4px 9px;font-size:.72rem;background:var(--ok);border-color:var(--ok);flex-shrink:0;" onclick="tkQuickDone(\''+tk.id+'\')">✓</button>'
        +'</div>';
    }).join("");
  }
  tkPanelH+='</div>';

  // ── Feeding: KPI card + recent 3 entries panel ────────────────
  var curYrStr=String(new Date().getFullYear());
  var yrFeeds=(D.feedings||[]).filter(function(f){return(f.date||"").startsWith(curYrStr);});
  var totFeedQty=yrFeeds.reduce(function(s,f){return s+(f.qty||0);},0);
  var hrKpiH='<div class="c" style="cursor:pointer;" onclick="go(\'hranire\')">'
    +'<div class="cl">🍬 '+t("hr_kpi_label")+'</div>'
    +'<div class="cv" style="font-size:1.1rem;">'+totFeedQty.toFixed(1)+'</div>'
    +'<div class="cs">'+t("hr_kpi_unit")+' · '+yrFeeds.length+' '+t("hr_total_entries")+'</div>'
    +'</div>';

  var recentFeeds=(D.feedings||[]).slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);}).slice(0,4);
  var hrPanelH='<div class="c" style="margin-top:14px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    +'<div class="ct" style="margin:0;">'+t("hr_dash_title")+'</div>'
    +'<button class="btn sm gh" onclick="go(\'hranire\')" style="font-size:.72rem;padding:4px 10px;">'+t("tk_dash_see_all")+'</button>'
    +'</div>';
  if(!recentFeeds.length){
    hrPanelH+='<div style="font-size:.8rem;color:var(--mut);padding:6px 0;">'+t("hr_dash_none")+'</div>';
  }else{
    hrPanelH+=recentFeeds.map(function(f){
      var hv=f.allHives?{name:t("hr_all_hives")}:D.hives.find(function(h){return h.id===f.hiveId;})||{name:"—"};
      var tp=(t("hr_types")||[]).find(function(x){return x.v===f.feedType;})||{l:f.feedType||"?"};
      return'<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--bdr);">'
        +'<div style="font-size:1.3rem;">🍬</div>'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:.82rem;font-weight:600;color:var(--txt);">'+tp.l.replace(/^[^ ]+ /,"")+'</div>'
        +'<div style="font-size:.7rem;color:var(--mut);">📅 '+f.date+' · 🏠 '+hv.name+' · <strong>'+f.qty+' '+(f.unit||"kg")+'</strong></div>'
        +'</div></div>';
    }).join("");
  }
  hrPanelH+='</div>';

  setP('<h1 style="margin-bottom:16px;font-size:1.35rem;"><i class="fas fa-tachometer-alt" style="color:var(--gold)"></i> '+t("dash_title")+'</h1>'
    +stockA+vrAlertA+tkAlertA
    +'<div class="g gs">'
    +'<div class="c"><div class="cl">'+t("dash_colonies")+'</div><div class="cv">'+D.hives.length+'</div><div class="cs">'+strong+' '+t("dash_s")+' · '+med+' '+t("dash_m")+' · '+slb+' '+t("dash_w")+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_queens_active")+'</div><div class="cv">'+D.queens.filter(function(q){return q.status==="activă";}).length+'</div><div class="cs">'+D.queens.filter(function(q){return q.status==="în imperechere";}).length+' '+t("dash_mating")+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_honey_kg")+'</div><div class="cv">'+totH.toFixed(1)+'</div><div class="cs">'+D.honeyHarvests.length+' '+t("dash_sessions")+'</div></div>'
    +honeyCardH
    +'<div class="c"><div class="cl">'+t("dash_treatments")+'</div><div class="cv">'+pend+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_last_insp")+'</div><div class="cv" style="font-size:1rem">'+(last?last.date:"—")+'</div><div class="cs">'+lastHiveName+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_low_stock")+'</div><div class="cv" style="color:'+(low.length?"var(--danger)":"var(--ok)")+'">'+low.length+'</div></div>'
    +finCardH+(vrCardH||'')+tkKpiH+hrKpiH
    +'</div>'+tkPanelH+hrPanelH+wCard+pastHTML);
}

window.tkQuickDone=function(id){
  var tk=(D.tasks||[]).find(function(x){return x.id===id;});
  if(!tk)return;
  tk.done=true;tk.doneDate=new Date().toISOString().slice(0,10);
  if(tk.recurring&&tk.recurDays){
    var nxt=new Date(tk.dueDate||Date.now());
    nxt.setDate(nxt.getDate()+parseInt(tk.recurDays));
    D.tasks.push({id:uid(),title:tk.title,hiveId:tk.hiveId,dueDate:nxt.toISOString().slice(0,10),priority:tk.priority,category:tk.category,recurring:true,recurDays:tk.recurDays,done:false,doneDate:null,notes:tk.notes,autoGenerated:true});
  }
  save(false);renderDashboard();
  toast(t("tk_completed")+(tk.recurring&&tk.recurDays?" "+t("tk_next_created"):""),"✅");
};

function renderHives(q){
  q=q||"";
  var list=q?D.hives.filter(function(h){return(h.name+h.loc+String(h.num||"")).toLowerCase().includes(q.toLowerCase());}):D.hives;
  var cards=list.map(function(h){
    var qn=D.queens.find(function(queen){return queen.hive===h.id;});
    var li=[].concat(D.inspections).filter(function(i){return i.hiveId===h.id;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
    var dot=h.sc==="green"?"🟢":h.sc==="yellow"?"🟡":"🔴";
    var qStatCls=qn?(t("qs_cls")||{})[qn.status]||"gy":"gr";
    var qStatLbl=qn?(t("q_statuses")||[]).find(function(s){return s[0]===qn.status;})?.[1]||qn.status:"";
    var qBadge=qn?qn.race+' — <span class="bg '+qStatCls+'">'+qStatLbl+'</span>':'<span style="color:var(--danger)">'+t("h_no_q")+'</span>';
    return'<div class="c">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:7px;"><h3 style="font-size:.92rem;">'+dot+' '+h.name+'</h3>'+sBadge(h.str)+'</div>'
      +'<div style="font-size:.76rem;color:var(--mut);margin-bottom:9px;">'+matIc(h.mat)+' '+(h.mat||"Lemn")+' · '+(h.mod||"Dadant")+' · 📍 '+h.loc+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:9px;">'
      +'<div style="text-align:center;background:rgba(255,255,255,.04);border-radius:8px;padding:6px;"><div style="font-size:1.15rem;font-weight:800">'+h.fT+'</div><div style="font-size:.62rem;color:var(--mut)">'+t("h_tot2")+'</div></div>'
      +'<div style="text-align:center;background:rgba(230,180,34,.1);border-radius:8px;padding:6px;"><div style="font-size:1.15rem;font-weight:800;color:var(--gold)">'+h.fB+'</div><div style="font-size:.62rem;color:var(--mut)">'+t("h_br2")+'</div></div>'
      +'<div style="text-align:center;background:rgba(111,191,76,.1);border-radius:8px;padding:6px;"><div style="font-size:1.15rem;font-weight:800;color:var(--ok)">'+h.fH+'</div><div style="font-size:.62rem;color:var(--mut)">'+t("h_hn2")+'</div></div>'
      +'</div>'
      +(h.hasMag?'<div style="font-size:.78rem;margin-bottom:4px;">📦 '+t("h_mag_l")+' '+h.magF+' '+t("inv_units")+'</div>':"")
      +'<div style="font-size:.78rem;margin-bottom:4px;">👑 '+qBadge+'</div>'
      +'<div style="font-size:.73rem;color:var(--mut)">📅 '+t("h_last_i")+' '+(li?li.date:"—")+'</div>'
      +(h.notes?'<div style="font-size:.7rem;color:var(--mut);margin-top:3px;font-style:italic">'+h.notes+'</div>':"")
      +'<div class="br"><button class="btn sm" onclick="hiveM(\''+h.id+'\')">✏️</button><button class="btn sm be" onclick="inspM(\''+h.id+'\')">'+t("insp_by_h")+'</button><button class="btn sm bd" onclick="delH(\''+h.id+'\')">🗑️</button></div>'

function renderInspections(){
  var now=new Date();
  var curMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  var threshold=parseInt(D.settings.inspAlertThreshold)||2;

  // Sort all inspections descending
  var allSorted=[].concat(D.inspections).sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  // Current month inspections
  var curInsp=allSorted.filter(function(i){return i.date&&i.date.startsWith(curMonth);});

  // Alert: hives not inspected in the last 7 days
  var today7=new Date();today7.setHours(0,0,0,0);
  var warnHives=D.hives.filter(function(h){
    var lastI=D.inspections.filter(function(i){return i.hiveId===h.id&&i.date;})
      .sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
    if(!lastI)return true;
    var lastD=new Date(lastI.date);lastD.setHours(0,0,0,0);
    return (today7-lastD)/86400000>=7;
  });

  // Last inspection per hive in current month (already sorted desc so first = last)
  var seenHive={};var curCards=[];var shownIds={};
  curInsp.forEach(function(i){
    if(!seenHive[i.hiveId]){seenHive[i.hiveId]=true;shownIds[i.id]=true;curCards.push(inspCardHTML(i,true));}
  });

  // Archive = ALL inspections except the ones shown as current-month cards
  // (includes older inspections from current month + all past months)
  var archiveInsp=allSorted.filter(function(i){return i.date&&!shownIds[i.id];});
  var byMonth={};
  archiveInsp.forEach(function(i){
    var m=i.date.slice(0,7);
    if(!byMonth[m])byMonth[m]={};
    if(!byMonth[m][i.hiveId])byMonth[m][i.hiveId]=[];
    byMonth[m][i.hiveId].push(i);
  });
  var monthKeys=Object.keys(byMonth).sort().reverse();

  var alertHTML=warnHives.length?
    '<div class="sa" style="margin-bottom:16px;">'
    +'<strong>⚠️ '+t("insp_alert_title")+'</strong><br>'
    +'<span style="font-size:.82rem;color:var(--mut);">'+(D.settings.lang==="en"?"Not inspected in the last 7 days:":"Nu au fost verificați în ultimele 7 zile:")+'</span><br style="margin-bottom:5px;">'
    +warnHives.map(function(h){
      var lastI=D.inspections.filter(function(i){return i.hiveId===h.id&&i.date;})
        .sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
      var daysAgo=lastI?Math.floor((today7-new Date(lastI.date))/86400000):null;
      return'<span class="bg gr" style="margin:4px 3px 0 0;display:inline-block;">🏠 '+h.name+(daysAgo!==null?" ("+daysAgo+"d)":"")+'</span>';
    }).join("")
    +'</div>':"";

  // Build current month HTML
  var curHTML='<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">'
    +'<span style="font-size:.82rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;">'+t("insp_cur_month")+'</span>'
    +(curCards.length?'<span class="bg gy" style="font-size:.68rem;">'+curCards.length+' '+t("insp_stupi")+'</span>':"")
    +'</div>'
    +(curCards.length?'<div class="g gc">'+curCards.join("")+'</div>':'<div class="al ali">'+t("insp_no_cur")+'</div>');

  // Build archive HTML
  var arcHTML='<div style="margin-top:22px;margin-bottom:10px;"><span style="font-size:.82rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;">'+t("insp_archive")+'</span></div>';
  if(monthKeys.length===0){
    arcHTML+='<div class="al ali">'+t("insp_no_arc")+'</div>';
  } else {
    arcHTML+=monthKeys.map(function(ym,mi){
      var arcId="arc_m"+mi;
      var hivesInMonth=byMonth[ym];
      var hiveKeys=Object.keys(hivesInMonth);
      var totalInMonth=0;
      hiveKeys.forEach(function(hid){totalInMonth+=hivesInMonth[hid].length;});
      var hivesHTML=hiveKeys.map(function(hid,hi){
        var hv=D.hives.find(function(h){return h.id===hid;});
        var hivArcId=arcId+"_h"+hi;
        // Sort ascending (chronological)
        var insps=hivesInMonth[hid].slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
        var rowsHTML=insps.map(function(insp){
          return'<div style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;">'
            +'<span style="font-size:.82rem;font-weight:700;min-width:95px;">📅 '+insp.date+'</span>'
            +'<span class="bg '+(insp.qSeen?"gg":"gy")+'" style="font-size:.63rem;">'+(insp.qSeen?"👑✅":"👑❓")+'</span>'
            +'<span class="bg gb" style="font-size:.63rem;">🥚 '+(insp.fB||0)+'</span>'
            +'<span class="bg gg" style="font-size:.63rem;">🍯 '+(insp.fH||0)+'</span>'
            +(insp.botci?'<span class="bg gr" style="font-size:.63rem;">🐛</span>':"")
            +'<div style="margin-left:auto;display:flex;gap:4px;">'
            +'<button class="btn sm be" onclick="inspM(\''+insp.hiveId+'\',\''+insp.id+'\')">✏️</button>'
            +'<button class="btn sm gh" onclick="exportInspPDF(\''+insp.id+'\')">📄</button>'
            +'<button class="btn sm gh" onclick="exportInspXLS(\''+insp.id+'\')">📊</button>'
            +'<button class="btn sm bd" onclick="delInsp(\''+insp.id+'\')">🗑️</button>'
            +'</div></div>';

// ── Magazie: build radio group ───────────────────────────────
function buildMagRadios(mag, ex, hive){
  var isEN=D.settings.lang==="en";
  // Determine initial selection:
  // If editing an existing inspection with hasMag=true → "present"
  // If new inspection and hive has mag → "present"
  // Default → "none"
  var sel="none";
  if(ex){
    sel=ex.hasMag?"present":"none";
  } else if(mag){
    sel="present";
  }
  var lNone=isEN?"No super":"Fără magazie";
  var lPres=isEN?"Super present":"Magazie prezentă";
  var lAdd=isEN?"Adding super now":"Adaug magazie acum";
  return '<div style="background:rgba(230,180,34,.06);border:1px solid rgba(230,180,34,.18);border-radius:var(--rs);padding:10px 12px;margin-bottom:4px;">'
    +'<div style="font-size:.78rem;font-weight:700;color:var(--gold);margin-bottom:8px;">📦 '+(isEN?"Honey Super":"Magazie")+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px;">'
    +'<label style="display:flex;align-items:center;gap:8px;font-size:.84rem;cursor:pointer;">'
    +'<input type="radio" name="magRadio" id="iMagNone" value="none"'+(sel==="none"?" checked":"")
    +' onchange="onMagRadio(\'none\')" style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;"> '+lNone+'</label>'
    +'<label style="display:flex;align-items:center;gap:8px;font-size:.84rem;cursor:pointer;">'
    +'<input type="radio" name="magRadio" id="iMagPres" value="present"'+(sel==="present"?" checked":"")
    +' onchange="onMagRadio(\'present\')" style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;"> '+lPres+'</label>'
    +'<label style="display:flex;align-items:center;gap:8px;font-size:.84rem;cursor:pointer;">'
    +'<input type="radio" name="magRadio" id="iMagAdd" value="add"'+(sel==="add"?" checked":"")
    +' onchange="onMagRadio(\'add\')" style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;"> '+lAdd+'</label>'
    +'</div></div>';
}

window.updMag=function(hid){
  var hive=D.hives.find(function(h){return h.id===hid;});
  var hasMag=!!(hive&&hive.hasMag);
  if(!hasMag){
    var lastI=D.inspections.filter(function(i){return i.hiveId===hid&&i.date;})
      .sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
    hasMag=!!(lastI&&lastI.hasMag);
  }
  // Rebuild radio group when hive changes
  var ms=document.getElementById("magSec");if(!ms)return;
  var container=ms.parentNode;
  // Remove old radio block (everything between iSp select's container and magSec)
  var radBlock=document.getElementById("magRadioBlock");
  if(radBlock)radBlock.remove();
  // Insert new radio block before magSec
  var tmp=document.createElement("div");
  tmp.id="magRadioBlock";
  tmp.innerHTML=buildMagRadios(hasMag,null,hive);
  container.insertBefore(tmp,ms);
  // Update magSec content
  ms.innerHTML=hasMag?('<div class="dv"><div class="stt">'+t("insp_mag_t")+'</div></div>'
    +'<div class="r3"><div>'+L(t("insp_mag_tot"))+'<input type="number" inputmode="numeric" id="iMgT" value="'+(hive&&hive.magF?hive.magF:10)+'"></div>'
    +'<div>'+L(t("insp_mag_fl"))+'<input type="number" inputmode="numeric" id="iMgFl" value="0"></div>'
    +'<div>'+L(t("insp_mag_cp"))+'<input type="number" inputmode="numeric" id="iMgCp" value="0"></div></div>'
    +'<div class="r2"><div>'+L(t("insp_mag_nw"))+'<input type="number" inputmode="numeric" id="iMgNw" value="0"></div>'
    +'<div>'+L(t("insp_mag_nb"))+'<input type="number" inputmode="numeric" id="iMgNwB" value="0"></div></div>'):"";
};

window.saveInsp=function(editId,hiveId){

  var dis=[];var disArr=t("dis")||[];

  var dn=($q("iDN")||{}).value;if(dn)dis.push(dn);
  var brood=parseInt(($q("iFB")||{}).value)||0;
  var o={
    id:editId||uid(),hiveId:hid,
    date:($q("iDt")||{}).value||"",weather:($q("iWt")||{}).value||"",
    temp:parseTempInput(($q("iTemp")||{}).value),smoke:($q("iSmk")||{}).value||"",
    structC:($q("iStC")||{}).value||"ok",structN:($q("iStN")||{}).value||"",
    behav:parseInt(($q("iBhv")||{}).value)||3,
    qSeen:($q("iQS")||{}).checked||false,eggs:($q("iEg")||{}).checked||false,larvae:($q("iLv")||{}).checked||false,
    qQual:($q("iQQ")||{}).value||"buna",
    botci:($q("iBtc")||{}).checked||false,botciN:parseInt(($q("iBtcN")||{}).value)||0,
    botciS:($q("iBtcS")||{}).value||"",botciF:($q("iBtcF")||{}).value||"",
    fB:brood,fH:parseInt(($q("iFH")||{}).value)||0,fP:parseInt(($q("iFP")||{}).value)||0,
    popPct:parseInt(($q("iPop")||{}).value)||90,bp:($q("iBP")||{}).value||"compact",
    nFrames:parseInt(($q("iNF")||{}).value)||0,nFramesB:parseInt(($q("iNFB")||{}).value)||0,
    space:($q("iSp")||{}).value||"suficient",
    hasMag:!!document.getElementById("iMgT"),
    magT:parseInt(($q("iMgT")||{}).value)||0,magFull:parseInt(($q("iMgFl")||{}).value)||0,
    magCap:parseInt(($q("iMgCp")||{}).value)||0,magNew:parseInt(($q("iMgNw")||{}).value)||0,magNewB:parseInt(($q("iMgNwB")||{}).value)||0,
    diseases:dis,diseaseN:($q("iDN")||{}).value||"",notes:($q("iNt")||{}).value||"",
    postTr:!!($q("iPostTr")||{}).checked,
    postTrId:($q("iPostTrProd")||{}).value||null,
    postTrEff:($q("iPostTrEff")||{}).value||"",
    postTrVarroa:($q("iPostTrVarroa")||{}).value?parseInt(($q("iPostTrVarroa")||{}).value):null,
    postTrNotes:($q("iPostTrNotes")||{}).value||""
  };
  if(editId){var ei=D.inspections.find(function(i){return i.id===editId;});if(ei)Object.assign(ei,o);}
  else{D.inspections.push(o);}

  if(hive){
    hive.fB=brood;hive.str=strCalc(brood);if(o.space==="urgent")hive.sc="red";
    // Update hasMag based on radio selection
    var magNoneEl=document.querySelector('input[name="magRadio"][value="none"]');
    var magPresEl=document.querySelector('input[name="magRadio"][value="present"]');
    var magAddEl=document.querySelector('input[name="magRadio"][value="add"]');

    if(magPresEl&&magPresEl.checked) hive.hasMag=true;
    if(magAddEl&&magAddEl.checked) hive.hasMag=true;
  }
  save();closeM();
  // Per-hive auto-snapshot (saved to separate localStorage key)
  saveHiveSnapshot(hid);
  if(curP==="inspections")renderInspections();else renderHives();
  toast(editId?t("insp_upd"):t("insp_saved"),"🐝");

    setTimeout(function(){exportInspPDF(o.id);},400);
    setTimeout(function(){exportInspXLS(o.id);},1800);
  }
};

  "Hive Tool","Bee Brush"];
function isLowStock(i){
  // Pentru echipamente individuale: warning doar daca qty < min (nu la egal)
  if(EQUIP_SINGLE.some(function(n){return i.name&&i.name.toLowerCase()===n.toLowerCase();})){
    return i.qty<i.min;
  }
  return i.qty<=i.min;
}

// INVENTORY
// ═══════════════════════════════════════════
function renderInventory(){
  var low=D.inventory.filter(function(i){return isLowStock(i);});
  var byCat={};D.inventory.forEach(function(i){if(!byCat[i.cat])byCat[i.cat]=[];byCat[i.cat].push(i);});
  var catHTML=Object.keys(byCat).map(function(cat){
    var items=byCat[cat].map(function(i){var lw=isLowStock(i);
      return'<div class="c" style="'+(lw?"border-color:var(--danger)":"")+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:5px;margin-bottom:5px;"><h3 style="font-size:.85rem;">'+i.name+'</h3>'+(lw?'<span class="bg gr">⚠️</span>':"")+'</div>'
        +'<div style="font-size:1.8rem;font-weight:800;color:'+(lw?"var(--danger)":"var(--gold)")+'">'+i.qty+'</div>'
        +'<div style="font-size:.73rem;color:var(--mut)">'+t("inv_units")+' · '+t("inv_min_d")+' '+i.min+'</div>'
        +'<div class="br"><button class="btn sm bd" onclick="chI(\''+i.id+'\',-1)">−1</button><button class="btn sm" onclick="chI(\''+i.id+'\',1)">+1</button><button class="btn sm be" onclick="invM(\''+i.id+'\')">✏️</button><button class="btn sm bd" onclick="delI(\''+i.id+'\')">🗑️</button></div>'
        +'</div>';
    }).join("");
    return'<div style="margin-bottom:18px;"><h3 style="color:var(--gold);font-size:.82rem;margin-bottom:9px;text-transform:uppercase;letter-spacing:.5px;">📂 '+cat+'</h3><div class="g gc">'+items+'</div></div>';
  }).join("");
  setP('<h2 style="margin-bottom:12px;font-size:1.2rem;"><i class="fas fa-boxes-stacked" style="color:var(--gold)"></i> '+t("inv_title")+'</h2>'
    +'<button class="btn" style="margin-bottom:12px;" onclick="invM()">'+t("inv_new")+'</button>'
    +(low.length?'<div class="sa"><strong>'+t("inv_low")+' — '+low.length+'</strong>'+low.map(function(i){return'<div style="margin-top:2px;font-size:.8rem;">📦 <strong>'+i.name+'</strong>: '+i.qty+' '+t("inv_units")+' ('+t("inv_min_d")+' '+i.min+')</div>';}).join("")+'</div>':"")
    +(Object.keys(byCat).length===0?'<div class="al ali">'+t("inv_no")+'</div>':catHTML));
}
window.chI=function(id,d){var i=D.inventory.find(function(x){return x.id===id;});if(!i)return;i.qty=Math.max(0,i.qty+d);save(false);renderInventory();};
window.delI=function(id){showConfirm(t("inv_del_c"),function(){D.inventory=D.inventory.filter(function(i){return i.id!==id;});save();renderInventory();});};
function invM(id){
  var ex=id?D.inventory.find(function(i){return i.id===id;}):null;
  var ic=t("icat")||{};var allIt=Object.values(ic).reduce(function(a,b){return a.concat(b);},[]);

  openM('<div class="mt">'+(ex?t("inv_edit_t"):t("inv_new_t"))+'</div>'
    +L(t("inv_sel"))+'<select id="iSN" onchange="'+selectOnChange+'"><option value="">'+t("inv_sel_ph")+'</option>'+allIt.map(function(n){return'<option value="'+n+'"'+(xv(ex,"name","")=== n?" selected":"")+'>'+n+'</option>';}).join("")+'</select>'
    +L(t("inv_man"))+'<input id="iMN" value="'+(xv(ex,"name",""))+'" placeholder="'+t("inv_man_ph")+'">'
    +L(t("inv_cat"))+'<select id="iCt" onchange="'+catOnChange+'">'+Object.keys(ic).map(function(c){return'<option'+(xv(ex,"cat","")=== c?" selected":"")+'>'+c+'</option>';}).join("")+'</select>'
    +'<div class="r2"><div>'+L(t("inv_qty"))+'<input id="iQt" type="number" inputmode="numeric" value="'+(xv(ex,"qty",0))+'"></div>'
    +'<div>'+L(t("inv_min"))+'<input id="iMn" type="number" inputmode="numeric" value="'+(xv(ex,"min",5))+'"></div></div>'
    +'<div id="invPkgBox" style="'+(isPkg?"":"display:none;")+'">'
    +L(t("inv_pkg_honey_kg"))+'<input id="iHkg" type="number" inputmode="decimal" step="0.001" value="'+(xv(ex,"honeyKg",""))+'" placeholder="ex: 0.950">'
    +'<div style="font-size:.73rem;color:var(--mut);margin-top:-4px;margin-bottom:6px;">'+t("inv_pkg_hint")+'</div>'
    +'</div>'
    +'<div class="br" style="margin-top:14px;"><button class="btn" onclick="saveI(\''+(id||'')+'\')">'+btnS()+'</button><button class="btn gh" onclick="closeM()">'+btnC()+'</button></div>');
}
window.invCatChanged=function(cat){
  var box=document.getElementById("invPkgBox");
  if(box)box.style.display=(cat==="Ambalaje"||cat==="Packaging")?"":"none";
};
window.getCt=function(n){var ic=t("icat")||{};var cats=Object.keys(ic);for(var i=0;i<cats.length;i++){if(ic[cats[i]].indexOf(n)>=0)return cats[i];}return null;};
window.saveI=function(id){
  var nm=(($q("iMN")||{}).value||($q("iSN")||{}).value||"").trim();
  if(!nm){toast("⚠️ "+t("inv_name_r"));return;}
  var cat=($q("iCt")||{}).value;
  var hkgVal=parseFloat(($q("iHkg")||{}).value)||null;
  var o={id:id||uid(),name:nm,cat:cat,qty:parseInt(($q("iQt")||{}).value)||0,min:parseInt(($q("iMn")||{}).value)||5};
  if(cat==="Ambalaje"||cat==="Packaging")o.honeyKg=hkgVal;
  if(id){var ex=D.inventory.find(function(i){return i.id===id;});if(ex)Object.assign(ex,o);}else{D.inventory.push(o);}
  save();closeM();renderInventory();
};

// ═══════════════════════════════════════════
// PASTORARE
// ═══════════════════════════════════════════
function renderPastorage(){
  var active=D.pastorage.filter(function(p){return !p.endDate||new Date(p.endDate)>=new Date();});
  var done=D.pastorage.filter(function(p){return p.endDate&&new Date(p.endDate)<new Date();});
  function card(p){
    var hv=D.hives.find(function(h){return h.id===p.hiveId;});
    var isActive=!p.endDate||new Date(p.endDate)>=new Date();
    var days=Math.round((Date.now()-new Date(p.startDate))/86400000);
    return'<div class="c">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:7px;"><h3 style="font-size:.92rem;">🚚 '+(hv?hv.name:"—")+'</h3><span class="bg '+(isActive?"gg":"gy")+'">'+(isActive?t("past_active_b"):t("past_done_b"))+'</span></div>'
      +'<div style="font-size:.82rem;font-weight:700;margin-bottom:3px;">📍 '+p.location+'</div>'
      +'<div style="font-size:.78rem;color:var(--mut);">'+t("past_target_d")+' <strong>'+p.target+'</strong></div>'
      +'<div style="font-size:.76rem;color:var(--mut);margin-top:5px;">'+t("past_from")+' '+p.startDate+(p.endDate?' · '+t("past_to")+' '+p.endDate:' · <em>'+t("past_ongoing")+'</em>')+'</div>'
      +(isActive?'<div style="font-size:.78rem;color:var(--gold);margin-top:3px;font-weight:700;">📅 '+days+' '+t("past_days")+'</div>':"")
      +(p.notes?'<div style="font-size:.72rem;color:var(--mut);margin-top:3px;font-style:italic">'+p.notes+'</div>':"")
      +'<div class="br"><button class="btn sm be" onclick="pastorM(\''+p.id+'\')">✏️</button><button class="btn sm bd" onclick="delPast(\''+p.id+'\')">🗑️</button></div>'
      +'</div>';
  }
  var activeHTML=active.map(card).join("");
  var doneHTML=done.map(card).join("");
  setP('<h2 style="margin-bottom:12px;font-size:1.2rem;"><i class="fas fa-truck" style="color:var(--gold)"></i> '+t("past_title")+'</h2>'
    +'<button class="btn" style="margin-bottom:14px;" onclick="pastorM()">'+t("past_new")+'</button>'
    +(D.pastorage.length===0?'<div class="al ali">'+t("past_no")+'</div>':'')
    +(active.length?'<div style="margin-bottom:6px;"><span style="font-size:.78rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">🚚 '+t("past_active_b")+'</span></div><div class="g gc">'+activeHTML+'</div>':"")
    +(done.length?'<div style="margin-top:10px;margin-bottom:6px;"><span style="font-size:.78rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">✅ '+t("past_done_b")+'</span></div><div class="g gc">'+doneHTML+'</div>':""));
}
window.delPast=function(id){showConfirm(t("past_del_c"),function(){D.pastorage=D.pastorage.filter(function(p){return p.id!==id;});save();renderPastorage();});};

function pastorM(id){
  var ex=id?D.pastorage.find(function(p){return p.id===id;}):null;
  var targets=t("past_targets");
  openM('<div class="mt">'+(ex?t("past_edit_t"):t("past_new_t"))+'</div>'

    +L(t("past_loc"))+'<input id="pLc" value="'+(xv(ex,"location",""))+'" placeholder="'+t("past_loc_ph")+'">'
    +L(t("past_target"))+'<select id="pTg">'+targets.map(function(tp){return'<option'+(xv(ex,"target","")=== tp?" selected":"")+'>'+tp+'</option>';}).join("")+'</select>'
    +'<div class="r2"><div>'+L(t("past_start"))+'<input type="date" id="pSt" value="'+(xv(ex,"startDate",new Date().toISOString().slice(0,10)))+'"></div>'
    +'<div>'+L(t("past_end"))+'<input type="date" id="pEd" value="'+(xv(ex,"endDate",""))+'" placeholder="'+t("past_end_ph")+'"><span class="hint">'+t("past_end_ph")+'</span></div></div>'
    +L(t("past_notes"))+'<textarea id="pNt" rows="2">'+(xv(ex,"notes",""))+'</textarea>'
