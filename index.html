window.savePast=function(id){
  var hid=($q("pHv")||{}).value;if(!hid){toast("⚠️ "+t("past_hive"));return;}
  var loc=($q("pLc")||{}).value||"";if(!loc){toast("⚠️ "+t("past_loc"));return;}
  var ed=($q("pEd")||{}).value||"";
  var o={id:id||uid(),hiveId:hid,location:loc,target:($q("pTg")||{}).value||"",startDate:($q("pSt")||{}).value||new Date().toISOString().slice(0,10),endDate:ed||null,notes:($q("pNt")||{}).value||""};
  if(id){var ex=D.pastorage.find(function(p){return p.id===id;});if(ex)Object.assign(ex,o);}else{D.pastorage.push(o);}
  save();closeM();renderPastorage();toast(id?t("past_upd"):t("past_saved"),"🚚");
};

// ═══════════════════════════════════════════
// CALENDAR — weather & location aware
// ═══════════════════════════════════════════
function renderCalendar(){
  var isEN=D.settings.lang==="en";
  var yr=new Date().getFullYear(),cd=cdoy(),fl=getFlow(),w=D.weather,off=getLatOffset();

  function foragQuality(plant,wx){
    if(!wx||wx.temp===null||wx.temp===undefined)return{cls:"gy",ic:"❓",lbl:isEN?"No weather data":"Fără date meteo",score:0,pct:0}; // FIX: null safety
    var rain=wx.rain||wx.prec>0,temp=wx.temp,wind=wx.wind||0;
    if(rain)return{cls:"gb",ic:"🌧️",lbl:t("fl_rain"),score:0,pct:0};
    if(temp<plant.nt[0]-4)return{cls:"gr",ic:"❄️",lbl:isEN?"Too cold — no foraging":"Prea rece — fără cules",score:0,pct:5};
    if(temp<plant.nt[0])return{cls:"gy",ic:"🥶",lbl:t("fl_sub_t"),score:1,pct:30};
    if(wind>35)return{cls:"gy",ic:"💨",lbl:t("bee_wind_t"),score:1,pct:25};
    if(temp>plant.nt[1]+4)return{cls:"gy",ic:"🌡️",lbl:isEN?"Too hot — reduced secretion":"Prea cald — secreție redusă",score:1,pct:35};
    if(temp>plant.nt[1])return{cls:"gy",ic:"🌡️",lbl:t("bee_heat_t"),score:2,pct:60};
    if(wind>20)return{cls:"gy",ic:"💨",lbl:isEN?"Windy — moderate foraging":"Vântos — cules moderat",score:2,pct:60};
    var center=(plant.nt[0]+plant.nt[1])/2;
    var dist=Math.abs(temp-center)/((plant.nt[1]-plant.nt[0])/2);
    var pct=Math.min(100,Math.round((1-dist*0.3)*100));
    return{cls:"gg",ic:"🐝🐝🐝",lbl:t("bee_active_t"),score:3,pct:pct};
  }

  function daysLeft(plant){return Math.max(0,doy(yr,plant.em,plant.ed)+off-cd);}
  function doyToStr(dn){var d=new Date(yr,0,dn);return d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0");}

  var next=PLANTS.filter(function(p){return doy(yr,p.sm,p.sd)+off>cd;})
    .sort(function(a,b){return(doy(yr,a.sm,a.sd)+off)-(doy(yr,b.sm,b.sd)+off);}).slice(0,3);

  // Between-flow tips
  var bet="";
  if(!fl&&next.length>0){
    var dlB=(doy(yr,next[0].sm,next[0].sd)+off)-cd;
    bet='<div class="c" style="margin-top:13px;"><div class="ct">'+t("cal_between")+' — '+dlB+' '+t("cal_days_until")+' '+plantIC(next[0])+' '+plantN(next[0])+'</div>'
      +'<ul style="margin-left:16px;line-height:1.85;font-size:.84rem;">'
      +(t("cal_tasks")||[]).map(function(tk){return'<li>'+tk+'</li>';}).join("")+'</ul></div>';
  }

  // Active flow card
  var flCard;
  if(fl){
    var q=foragQuality(fl,w);
    var dl2=daysLeft(fl);
    // Temperature position gauge
    var tempGauge="";
    if(w){
      var rangeW=fl.nt[1]-fl.nt[0];
      var tempPos=Math.min(98,Math.max(2,((w.temp-fl.nt[0]+rangeW*0.15)/(rangeW*1.3))*100));
      var barCol=q.score===3?"#6fbf4c":q.score===2?"#e6b422":"#4a9eff";
      tempGauge='<div style="margin-top:10px;">'
        +'<div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--mut);margin-bottom:4px;">'
        +'<span>❄️ '+showTemp(fl.nt[0])+'</span><span style="font-weight:700;color:var(--txt)">🌡️ '+showTemp(w.temp)+'</span><span>🔥 '+showTemp(fl.nt[1])+'</span></div>'
        +'<div style="position:relative;background:rgba(0,0,0,.3);border-radius:20px;height:10px;">'
        +'<div style="position:absolute;left:12%;right:12%;top:0;bottom:0;background:rgba(111,191,76,.2);border-radius:20px;"></div>'
        +'<div style="position:absolute;top:1px;bottom:1px;left:'+Math.max(1,tempPos-1.5)+'%;width:8px;background:'+barCol+';border-radius:20px;box-shadow:0 0 6px '+barCol+'88;"></div>'
        +'</div>'
        +'<div style="text-align:center;font-size:.64rem;color:var(--ok);margin-top:2px;">✅ '+(isEN?"optimal zone":"zonă optimă")+'</div></div>';
    }
    // Foraging quality bar
    var actBar='<div style="margin-top:8px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:3px;">'
      +'<span style="color:var(--mut);">'+(isEN?"Foraging activity:":"Activitate cules:")+'</span>'
      +'<span class="bg '+q.cls+'">'+q.ic+' '+q.lbl+'</span></div>'
      +'<div style="background:rgba(0,0,0,.25);border-radius:20px;height:7px;overflow:hidden;">'
      +'<div style="width:'+q.pct+'%;height:100%;background:'+(q.score===3?"linear-gradient(90deg,var(--ok),#8de860)":q.score===2?"linear-gradient(90deg,var(--gold),#ffcf4a)":"linear-gradient(90deg,var(--info),#74b3ff)")+';border-radius:20px;transition:width .5s;"></div>'
      +'</div>'
      +'<div style="text-align:right;font-size:.65rem;color:var(--mut);margin-top:1px;">'+q.pct+'%</div></div>';
    // Location offset note
    var latNote=(off!==0&&D.userLoc)?
      '<div style="font-size:.68rem;color:var(--info);margin-top:6px;">📍 '
      +(isEN?"Bloom adjusted ":"Cules ajustat ")+(off>0?"+":"")+off
      +(isEN?" days for ":"  zile pentru ")+D.userLoc.lat.toFixed(1)+'°N</div>':"";
    // Weather strip
    var wxStrip=w?'<div style="display:flex;gap:10px;font-size:.74rem;color:var(--mut);margin-top:6px;flex-wrap:wrap;">'
      +'<span>🌡️ '+showTemp(w.temp)+'</span><span>💨 '+w.wind+'km/h</span><span>💧 '+w.hum+'%</span>'
      +(w.prec>0?'<span>🌧️ '+w.prec+'mm</span>':'')+'<span>'+wmoLabel(w.wc)+'</span></div>':"";

    flCard='<div class="c"><div class="ct">'+t("cal_active")+'</div>'
      +'<div style="background:rgba(111,191,76,.07);border:1px solid rgba(111,191,76,.2);border-radius:var(--rm);padding:14px;margin-top:9px;">'
      +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:7px;">'
      +'<span style="font-size:2.2rem;line-height:1;">'+plantIC(fl)+'</span>'
      +'<div><div style="font-size:1.05rem;font-weight:800;">'+t("fl_active")+' '+plantN(fl)+'</div>'
      +'<div style="font-size:.74rem;color:var(--mut);">'+plantDC(fl)+'</div></div></div>'
      +wxStrip+tempGauge+actBar
      +'<div style="display:flex;justify-content:space-between;font-size:.74rem;margin-top:9px;">'
      +'<span style="color:var(--mut);">⏳ ~'+dl2+' '+(isEN?"days left":"zile rămase")+'</span>'
      +'<span style="color:var(--mut);">'+t("fl_opt_range")+' '+showTempRange(fl.nt[0],fl.nt[1])+'</span></div>'
      +latNote+'</div></div>';
  } else {
    var noNext=next.length?'<br><small style="color:var(--mut);">⏭️ '+(isEN?"Next: ":"Următor: ")+plantIC(next[0])+' '+plantN(next[0])+' — '+(isEN?"in ~":"în ~")+((doy(yr,next[0].sm,next[0].sd)+off)-cd)+(isEN?" days":" zile")+'</small>':"";
    flCard='<div class="c"><div class="ct">'+t("cal_active")+'</div>'
      +'<div class="bb" style="background:rgba(224,124,76,.07);border:1px solid rgba(224,124,76,.2);border-radius:var(--rm);padding:12px;margin-top:9px;">'
      +'<span style="font-size:1.8rem;">⏸️</span>'
      +'<div><div style="font-weight:700;">'+t("cal_no_active")+'</div>'+noNext+'</div></div>'
      +(w?'<div style="font-size:.75rem;color:var(--mut);margin-top:8px;padding:8px;background:rgba(255,255,255,.04);border-radius:var(--rs);">'
        +(isEN?"Current: ":"Acum: ")+'🌡️ '+showTemp(w.temp)+' · 💨 '+w.wind+'km/h · '+wmoLabel(w.wc)+'</div>':"")
      +'</div>';
  }

  // Upcoming flows
  var nextHTML=next.map(function(p){
    var sd=doy(yr,p.sm,p.sd)+off,ed=doy(yr,p.em,p.ed)+off,dl3=sd-cd;
    return'<div class="bb" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:var(--rs);padding:10px;margin-top:7px;">'
      +'<span style="font-size:1.3rem;flex-shrink:0;">'+plantIC(p)+'</span>'
      +'<div style="flex:1;"><div style="font-weight:700;font-size:.9rem;">'+plantN(p)+'</div>'
      +'<div style="font-size:.75rem;color:var(--mut);">~'+doyToStr(sd)+' → '+doyToStr(ed)
      +(off!==0?' <span style="color:var(--info);">('+(off>0?"+":"")+off+'d)</span>':'')+'</div>'
      +'<div style="font-size:.73rem;color:var(--mut);">'+plantDC(p)+'</div>'
      +'<div style="font-size:.73rem;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;">'
      +'<span class="bg '+(dl3<14?"gy":dl3<30?"gb":"")+'">⏳ '+(isEN?"in ~":"în ~")+dl3+(isEN?" days":" zile")+'</span>'
      +'<span class="bg" style="background:rgba(255,255,255,.07);">'+t("fl_opt_range")+' '+showTempRange(p.nt[0],p.nt[1])+'</span>'
      +'</div></div></div>';
  }).join("");

  // Treatments
  var treatHTML=D.treatments.filter(function(tr){return new Date(tr.date)>new Date();})
    .map(function(tr){
      var hv=D.hives.find(function(h){return h.id===tr.hiveId;});
      var du=Math.ceil((new Date(tr.date)-new Date())/86400000);
      return'<div class="bb" style="background:rgba(255,255,255,.04);margin-top:7px;"><span>💊</span>'
        +'<div><strong>'+tr.product+'</strong><br>'
        +'<small style="color:var(--mut);">📅 '+tr.date+' · '+(hv?hv.name:t("tr_all_d"))
        +' · <span class="bg '+(du<=3?"gr":du<=7?"gy":"gb")+'">'+du+(isEN?" days":" zile")+'</span></small></div>'
        +'<button class="btn sm be" onclick="treatM(\''+tr.id+'\')">✏️</button></div>';
    }).join("");

  setP('<h2 style="margin-bottom:12px;font-size:1.2rem;"><i class="fas fa-calendar-days" style="color:var(--gold)"></i> '+t("cal_title")+'</h2>'
    +flCard
    +'<div class="c" style="margin-top:13px;"><div class="ct">'+t("cal_upcoming")+'</div>'
    +(nextHTML||'<p style="color:var(--mut);margin-top:7px;">'+t("cal_no_up")+'</p>')+'</div>'
    +bet
    +'<div class="c" style="margin-top:13px;"><div class="ct">'+t("cal_planned")+'</div>'
    +(treatHTML||'<p style="color:var(--mut);margin-top:7px;">'+t("cal_no_tr")+'</p>')+'</div>');
}
// ═══════════════════════════════════════════
// ANALYTICS
// ═══════════════════════════════════════════
function renderAnalytics(){
  var isEN=D.settings.lang==="en";
  var curYear=new Date().getFullYear();
  var prevYear=curYear-1;

  // ── Totale globale ────────────────────────────────────────────
  var tR=D.honeyHarvests.reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);
  var tE=D.honeyHarvests.reduce(function(s,h){return s+(h.estQty||0);},0);
  var eff=tE>0?((tR/tE)*100).toFixed(0):"—";
  var avgB=D.inspections.length?(D.inspections.reduce(function(s,i){return s+(i.fB||0);},0)/D.inspections.length).toFixed(1):"—";
  var sc={p:D.hives.filter(function(h){return h.str==="puternic";}).length,m:D.hives.filter(function(h){return h.str==="mediu";}).length,s:D.hives.filter(function(h){return h.str==="slab";}).length};

  // ── Helper: productie stup pe an ─────────────────────────────
  function hiveYearProd(hid,year){
    return D.honeyHarvests.filter(function(h){var d=h.extractionDate||h.date||"";return h.hiveId===hid&&d.startsWith(String(year));})
      .reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);
  }
  function hiveYearEst(hid,year){
    return D.honeyHarvests.filter(function(h){var d=h.extractionDate||h.date||"";return h.hiveId===hid&&d.startsWith(String(year));})
      .reduce(function(s,h){return s+(h.estQty||0);},0);
  }

  // ── Productie per stup ────────────────────────────────────────
  var hiveProd=D.hives.map(function(h){
    var real=hiveYearProd(h.id,curYear);
    var realAll=D.honeyHarvests.filter(function(hr){return hr.hiveId===h.id;}).reduce(function(s,hr){return s+(hr.actualQty||hr.qty||0);},0);
    var est=hiveYearEst(h.id,curYear);
    var estAll=D.honeyHarvests.filter(function(hr){return hr.hiveId===h.id;}).reduce(function(s,hr){return s+(hr.estQty||0);},0);
    var effH=estAll>0?((realAll/estAll)*100).toFixed(0):null;
    var prevR=hiveYearProd(h.id,prevYear);
    return{h:h,real:realAll,realCur:real,est:estAll,estCur:est,eff:effH,prevR:prevR};
  }).sort(function(a,b){return b.real-a.real;});

  var maxReal=hiveProd.length?Math.max.apply(null,hiveProd.map(function(x){return Math.max(x.real,0.01);})):1;
  var hasPrevData=hiveProd.some(function(x){return x.prevR>0;});

  var prodRows=hiveProd.map(function(x){
    var barW=Math.round((x.real/maxReal)*100);
    var trend=hasPrevData?(x.real>x.prevR?"↑":x.real<x.prevR?"↓":"—"):"";
    var trendCls=x.real>x.prevR?"color:var(--ok)":x.real<x.prevR?"color:var(--danger)":"color:var(--mut)";
    var badge=x.h.str==="puternic"?'<span class="bg gg" style="font-size:.58rem;">💪</span>':x.h.str==="slab"?'<span class="bg gr" style="font-size:.58rem;">⚠️</span>':"";
    return'<tr>'
      +'<td style="font-weight:700;font-size:.8rem;">'+x.h.name+' '+badge+'</td>'
      +'<td style="text-align:right;font-weight:800;color:var(--gold);">'+x.real.toFixed(1)+'</td>'
      +'<td style="text-align:right;font-size:.76rem;color:var(--mut);">'+x.est.toFixed(1)+'</td>'
      +'<td style="text-align:right;font-size:.76rem;">'+(x.eff!==null?x.eff+'%':'—')+'</td>'
      +(hasPrevData?'<td style="text-align:right;font-size:.78rem;font-weight:700;'+trendCls+';">'+trend+' '+(x.prevR>0?x.prevR.toFixed(1):'—')+'</td>':'')
      +'<td style="min-width:60px;"><div style="background:rgba(255,255,255,.07);border-radius:20px;height:5px;overflow:hidden;">'
      +'<div style="width:'+barW+'%;height:100%;background:linear-gradient(90deg,var(--gold),#ffcf4a);border-radius:20px;"></div></div></td>'
      +'</tr>';
  }).join("");

  var prodHTML='<div class="c" style="margin-bottom:14px;">'
    +'<div class="ct">🍯 '+(isEN?"Production per hive (all time)":"Producție per stup (total)")+'</div>'
    +'<div class="rt-wrap"><table class="rt" style="white-space:normal;min-width:unset;">'
    +'<thead><tr><th>'+(isEN?"Hive":"Stup")+'</th><th style="text-align:right;">Real(kg)</th><th style="text-align:right;">Est.(kg)</th><th style="text-align:right;">Ef.%</th>'
    +(hasPrevData?'<th style="text-align:right;">vs '+prevYear+'</th>':'')+'<th></th></tr></thead>'
    +'<tbody>'+prodRows+'</tbody></table></div>'
    +(hiveProd.every(function(x){return x.real===0;})?'<div class="al ali" style="margin-top:8px;font-size:.78rem;">'+(isEN?"No harvest data yet.":"Nicio recoltă înregistrată.")+'</div>':"")
    +'</div>';

  // ── Eficienta sezon: kg/stup pe an ───────────────────────────
  var nHives=D.hives.length||1;
  var curYearTotal=D.honeyHarvests.filter(function(h){var d=h.extractionDate||h.date||"";return d.startsWith(String(curYear));}).reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);
  var prevYearTotal=D.honeyHarvests.filter(function(h){var d=h.extractionDate||h.date||"";return d.startsWith(String(prevYear));}).reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);
  var curEff=(curYearTotal/nHives).toFixed(2);
  var prevEff=prevYearTotal>0?(prevYearTotal/nHives).toFixed(2):null;
  var delta=prevYearTotal>0?(((curYearTotal-prevYearTotal)/prevYearTotal)*100).toFixed(0):null;
  var deltaStr=delta!==null?((parseFloat(delta)>0?"+":"")+delta+"%"):"—";
  var deltaPos=delta!==null?parseFloat(delta)>=0:null;

  // Productie per sezon (tip miere)
  var byFlowCur={},byFlowPrev={};
  D.honeyHarvests.forEach(function(h){
    var d=h.extractionDate||h.date||"",tp=h.honeyType||h.type||"?",qty=h.actualQty||h.qty||0;
    if(d.startsWith(String(curYear)))byFlowCur[tp]=(byFlowCur[tp]||0)+qty;
    if(d.startsWith(String(prevYear)))byFlowPrev[tp]=(byFlowPrev[tp]||0)+qty;
  });
  var allSeasonKeys=[].concat(Object.keys(byFlowCur),Object.keys(byFlowPrev)).filter(function(v,i,a){return a.indexOf(v)===i;});

  var seasonRows=allSeasonKeys.map(function(tp){
    var cur=byFlowCur[tp]||0,prev=byFlowPrev[tp]||0;
    var curKH=(cur/nHives).toFixed(2),prevKH=prev>0?(prev/nHives).toFixed(2):"—";
    var d=prev>0?((((cur-prev)/prev)*100).toFixed(0)):null;
    var dStr=d!==null?((parseFloat(d)>0?"+":"")+d+"%"):"—";
    var dCls=d===null?"color:var(--mut)":parseFloat(d)>=0?"color:var(--ok)":"color:var(--danger)";
    return'<tr>'
      +'<td style="font-size:.78rem;">'+tp+'</td>'
      +'<td style="text-align:right;font-weight:700;color:var(--gold);">'+cur.toFixed(1)+'<br><span style="font-size:.65rem;color:var(--mut);font-weight:400;">'+curKH+' kg/'+( isEN?"hive":"stup")+'</span></td>'
      +'<td style="text-align:right;font-size:.76rem;color:var(--mut);">'+(prev>0?prev.toFixed(1)+'<br><span style="font-size:.65rem;">'+prevKH+' kg</span>':'—')+'</td>'
      +'<td style="text-align:right;font-weight:700;'+dCls+';">'+dStr+'</td>'
      +'</tr>';
  }).join("");

  var seasonHTML=(curYearTotal>0||prevYearTotal>0)?
    '<div class="c" style="margin-bottom:14px;">'
    +'<div class="ct">📊 '+(isEN?"Season efficiency — kg/hive":"Eficiență sezon — kg/stup")+'</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 8px;">'
    +'<div style="flex:1;min-width:110px;background:rgba(230,180,34,.08);border-radius:var(--rs);padding:10px;text-align:center;">'
    +'<div style="font-size:.68rem;color:var(--mut);">'+curYear+'</div>'
    +'<div style="font-size:1.4rem;font-weight:800;color:var(--gold);">'+curYearTotal.toFixed(1)+' kg</div>'
    +'<div style="font-size:.72rem;color:var(--mut);">÷ '+nHives+' = <strong>'+curEff+'</strong> kg/'+(isEN?"hive":"stup")+'</div>'
    +'</div>'
    +(prevYearTotal>0?
      '<div style="flex:1;min-width:110px;background:rgba(255,255,255,.04);border-radius:var(--rs);padding:10px;text-align:center;">'
      +'<div style="font-size:.68rem;color:var(--mut);">'+prevYear+'</div>'
      +'<div style="font-size:1.4rem;font-weight:800;color:var(--mut);">'+prevYearTotal.toFixed(1)+' kg</div>'
      +'<div style="font-size:.72rem;color:var(--mut);">÷ '+nHives+' = <strong>'+prevEff+'</strong> kg/'+(isEN?"hive":"stup")+'</div>'
      +'</div>'
      +'<div style="flex:1;min-width:90px;background:rgba('+(deltaPos?"111,191,76":"224,124,76")+',.1);border-radius:var(--rs);padding:10px;text-align:center;">'
      +'<div style="font-size:.68rem;color:var(--mut);">'+(isEN?"vs last year":"față de "+prevYear)+'</div>'
      +'<div style="font-size:1.4rem;font-weight:800;color:'+(deltaPos?"var(--ok)":"var(--danger)")+';">'+deltaStr+'</div>'
      +'</div>'
      :"")
    +'</div>'
    +(allSeasonKeys.length?
      '<div class="rt-wrap"><table class="rt" style="white-space:normal;min-width:unset;">'
      +'<thead><tr><th>'+(isEN?"Season":"Sezon")+'</th><th style="text-align:right;">'+curYear+'</th><th style="text-align:right;">'+prevYear+'</th><th style="text-align:right;">'+(isEN?"Change":"Variație")+'</th></tr></thead>'
      +'<tbody>'+seasonRows+'</tbody></table></div>':'')
    +'</div>':"";

  // ── Inspectii per stup (an curent) ───────────────────────────
  var inspYr=D.inspections.filter(function(i){return i.date&&i.date.startsWith(String(curYear));});
  var hiveInspC=D.hives.map(function(h){
    var cnt=inspYr.filter(function(i){return i.hiveId===h.id;}).length;
    return{h:h,cnt:cnt};
  }).sort(function(a,b){return b.cnt-a.cnt;});
  var maxInsp=hiveInspC.length?Math.max.apply(null,hiveInspC.map(function(x){return Math.max(x.cnt,1);})):1;

  var inspRows=hiveInspC.map(function(x){
    var barW=Math.round((x.cnt/maxInsp)*100);
    var cls=x.cnt===0?"gr":x.cnt<3?"gy":"gg";
    return'<tr>'
      +'<td style="font-weight:700;font-size:.8rem;">'+x.h.name+'</td>'
      +'<td style="text-align:center;"><span class="bg '+cls+'" style="font-size:.7rem;">'+x.cnt+'</span></td>'
      +'<td style="min-width:60px;"><div style="background:rgba(255,255,255,.07);border-radius:20px;height:5px;overflow:hidden;">'
      +'<div style="width:'+barW+'%;height:100%;background:linear-gradient(90deg,var(--info),#74b3ff);border-radius:20px;"></div></div></td>'
      +'</tr>';
  }).join("");

  var inspHiveHTML='<div class="c" style="margin-bottom:14px;">'
    +'<div class="ct">🔍 '+(isEN?"Inspections per hive — "+curYear:"Inspecții per stup — "+curYear)+'</div>'
    +'<div class="rt-wrap"><table class="rt" style="white-space:normal;min-width:unset;">'
    +'<thead><tr><th>'+(isEN?"Hive":"Stup")+'</th><th style="text-align:center;">'+(isEN?"Nr.":"Nr.")+'</th><th></th></tr></thead>'
    +'<tbody>'+inspRows+'</tbody></table></div>'
    +'</div>';

  // ── Botci trend per stup ──────────────────────────────────────
  var hiveBotci=D.hives.map(function(h){
    var insps=D.inspections.filter(function(i){return i.hiveId===h.id&&i.date;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    var last4=insps.slice(-4);
    var hasBotci=last4.some(function(i){return i.botci;});
    if(!hasBotci)return null;
    var vals=last4.map(function(i){return i.botciN||0;});
    var trend="stable";
    if(vals.length>=2){var first=vals[0],last=vals[vals.length-1];if(last>first)trend="up";else if(last<first)trend="down";}
    return{h:h,insps:last4,trend:trend};
  }).filter(Boolean);

  var botciHTML="";
  if(hiveBotci.length){
    var botciCards=hiveBotci.map(function(x){
      var ic=x.trend==="up"?"📈":x.trend==="down"?"📉":"➡️";
      var lbl=x.trend==="up"?(isEN?"Increasing":"Creștere"):x.trend==="down"?(isEN?"Decreasing":"Scădere"):(isEN?"Stable":"Stabil");
      var tcls=x.trend==="up"?"gy":x.trend==="down"?"gg":"gb";
      var dots=x.insps.map(function(i){
        return'<div style="display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--bdr);font-size:.73rem;">'
          +'<span style="color:var(--mut);min-width:82px;flex-shrink:0;">'+i.date+'</span>'
          +(i.botci?'<span class="bg gy">🐛 '+(i.botciN||0)+(i.botciS?' · '+i.botciS:'')+'</span>':'<span class="bg gg" style="font-size:.65rem;">✅ '+(isEN?"none":"fără")+'</span>')
          +'</div>';
      }).join("");
      return'<div style="background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:var(--rs);padding:9px;margin-bottom:6px;">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">'
        +'<strong style="font-size:.82rem;">🏠 '+x.h.name+'</strong>'
        +'<span class="bg '+tcls+'" style="font-size:.65rem;">'+ic+' '+lbl+'</span>'
        +'</div>'+dots+'</div>';
    }).join("");
    botciHTML='<div class="c" style="margin-bottom:14px;">'
      +'<div class="ct">🐛 '+(isEN?"Queen cells trend per hive":"Evoluție botci per stup")+'</div>'
      +'<div style="margin-top:8px;">'+botciCards+'</div>'
      +'</div>';
  }

  // ── Grafice miere pe tip si evolutie ─────────────────────────
  var byT={};D.honeyHarvests.forEach(function(h){var tp=h.honeyType||"?";byT[tp]=(byT[tp]||0)+(h.actualQty||h.qty||0);});
  var byTChart=Object.keys(byT).length?'<div class="c" style="margin-bottom:14px;"><div class="ct">'+t("an_by_t")+'</div><canvas id="ch1" height="90"></canvas></div>':"";
  var evolChart='<div class="c" style="margin-bottom:14px;"><div class="ct">'+t("an_evol")+'</div><canvas id="ch2" height="90"></canvas></div>';

  // ── Distributie forta colonii — mic, doar daca ≥5 stupi ──────
  var distHTML="";
  if(D.hives.length>=5){
    var tot2=sc.p+sc.m+sc.s||1;
    var bars=[
      {n:sc.p,c:"var(--ok)",l:isEN?"Strong":"Puternice"},
      {n:sc.m,c:"var(--gold)",l:isEN?"Medium":"Medii"},
      {n:sc.s,c:"var(--danger)",l:isEN?"Weak":"Slabe"}
    ].map(function(b){
      var h2=Math.max(6,Math.round((b.n/tot2)*52));
      return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">'
        +'<div style="font-size:.68rem;font-weight:800;color:'+b.c+';">'+b.n+'</div>'
        +'<div style="width:100%;height:'+h2+'px;background:'+b.c+';border-radius:4px 4px 0 0;opacity:.8;"></div>'
        +'<div style="font-size:.58rem;color:var(--mut);text-align:center;">'+b.l+'</div>'
        +'</div>';
    }).join("");
    distHTML='<div class="c" style="margin-bottom:14px;max-width:260px;">'
      +'<div class="ct" style="font-size:.8rem;">💪 '+(isEN?"Colony strength":"Forță colonii")+'</div>'
      +'<div style="display:flex;gap:6px;align-items:flex-end;height:70px;margin:10px 0 4px;">'+bars+'</div>'
      +'</div>';
  }

  // ── KPI cards ─────────────────────────────────────────────────
  var kpiHTML='<div class="g gs" style="margin-bottom:14px;">'
    +'<div class="c"><div class="cl">'+(isEN?"Total real":"Total real")+'</div><div class="cv">'+tR.toFixed(1)+' kg</div></div>'
    +'<div class="c"><div class="cl">'+(isEN?"Estimated":"Estimat")+'</div><div class="cv">'+tE.toFixed(1)+' kg</div><div class="cs">'+t("an_eff")+' '+eff+'%</div></div>'
    +'<div class="c"><div class="cl">'+(isEN?"Avg brood frames":"Rame puiet med.")+'</div><div class="cv">'+avgB+'</div></div>'
    +'<div class="c"><div class="cl">'+(isEN?"Strong colonies":"Colonii puternice")+'</div><div class="cv">'+sc.p+'</div></div>'
    +'<div class="c"><div class="cl">'+(isEN?"Inspections w/ queen cells":"Insp. cu botci")+'</div><div class="cv">'+D.inspections.filter(function(i){return i.botci;}).length+'</div></div>'
    +'<div class="c"><div class="cl">'+(isEN?"Total inspections":"Total inspecții")+'</div><div class="cv">'+D.inspections.length+'</div></div>'
    +'</div>';

  setP('<h2 style="margin-bottom:12px;font-size:1.2rem;"><i class="fas fa-chart-bar" style="color:var(--gold)"></i> '+t("an_title")+'</h2>'
    +kpiHTML
    +prodHTML
    +seasonHTML
    +inspHiveHTML
    +(botciHTML||"")
    +(byTChart||"")
    +evolChart
    +distHTML
    +'<button class="btn" onclick="exportToPDF()" style="margin-top:4px;">'+t("an_export")+'</button>');

  setTimeout(function(){
    var cO={responsive:true,plugins:{legend:{labels:{color:"#b9b5ae",font:{size:10}}}},scales:{x:{ticks:{color:"#b9b5ae",font:{size:9}},grid:{color:"rgba(255,255,255,.05)"}},y:{ticks:{color:"#b9b5ae",font:{size:9}},grid:{color:"rgba(255,255,255,.05)"}}}};
    var c1=document.getElementById("ch1");
    if(c1&&Object.keys(byT).length>0)new Chart(c1.getContext("2d"),{type:"bar",data:{labels:Object.keys(byT),datasets:[{label:"kg",data:Object.values(byT),backgroundColor:"rgba(230,180,34,.7)",borderColor:"#e6b422",borderWidth:2,borderRadius:6}]},options:{...cO,plugins:{legend:{display:false}}}});
    var sorted=[].concat(D.honeyHarvests).sort(function(a,b){return new Date(a.extractionDate||a.date)-new Date(b.extractionDate||b.date);});
    var c2=document.getElementById("ch2");
    if(c2&&sorted.length>0)new Chart(c2.getContext("2d"),{type:"line",data:{labels:sorted.map(function(h){return h.extractionDate||h.date||"";}),datasets:[{label:t("an_real_c"),data:sorted.map(function(h){return h.actualQty||h.qty||0;}),borderColor:"#e6b422",backgroundColor:"rgba(230,180,34,.15)",fill:true,tension:.4},{label:t("an_est_c"),data:sorted.map(function(h){return h.estQty||0;}),borderColor:"rgba(74,158,255,.7)",backgroundColor:"rgba(74,158,255,.05)",fill:true,tension:.4,borderDash:[5,5]}]},options:cO});
  },80);
}

// ═══════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════
function renderSettings(){
  var totH=D.honeyHarvests.reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);
  var th=parseInt(D.settings.inspAlertThreshold)||7;
  var isEN=D.settings.lang==="en";

  // ── Archive build (unchanged logic) ──────────────────────────
  var now2=new Date();
  var allSorted2=[].concat(D.inspections).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var seenHive2={};var shownIds2={};
  allSorted2.forEach(function(i){if(i.date&&!seenHive2[i.hiveId]){seenHive2[i.hiveId]=true;shownIds2[i.id]=true;}});
  var pastInsp2=allSorted2.filter(function(i){return i.date&&!shownIds2[i.id];});
  var byMonth2={};
  pastInsp2.forEach(function(i){var m=i.date.slice(0,7);if(!byMonth2[m])byMonth2[m]={};if(!byMonth2[m][i.hiveId])byMonth2[m][i.hiveId]=[];byMonth2[m][i.hiveId].push(i);});
  var monthKeys2=Object.keys(byMonth2).sort().reverse();
  var arcInnerHTML=monthKeys2.length===0?'<div class="al ali">'+t("insp_no_arc")+'</div>':monthKeys2.map(function(ym,mi){
    var arcId2="se_arc_m"+mi;var hivesInMonth2=byMonth2[ym];var hiveKeys2=Object.keys(hivesInMonth2);
    var total2=0;hiveKeys2.forEach(function(hid){total2+=hivesInMonth2[hid].length;});
    var hivesHTML2=hiveKeys2.map(function(hid,hi){
      var hv=D.hives.find(function(h){return h.id===hid;});var hivArcId2=arcId2+"_h"+hi;

// ═══════════════════════════════════════════
// CALCULATOR APICOL
// ═══════════════════════════════════════════
var CALC_WORKER_AGE={egg:2,larva:6,capped:15};
var CALC_QUEEN_AGE={cell_uncapped:0,cell_capped:8,virgin:16,mating:20,laying:26};
var CALC_WORKER_TOTAL=42;
var CALC_QUEEN_MAX=26;

function calcAddDays(date,days){var r=new Date(date);r.setDate(r.getDate()+days);return r;}
function calcFmtDate(date){
  var isEN=D.settings.lang==="en";
  try{return date.toLocaleDateString(isEN?'en-GB':'ro-RO',{day:'numeric',month:'long',year:'numeric'});}
  catch(e){return date.toISOString().slice(0,10);}
}

window.calcTypeChange=function(){
  var isEN=D.settings.lang==="en";
  var tp=($q("calcType")||{}).value||"worker";
  var sel=$q("calcStage");if(!sel)return;
  var stages=t(tp==="worker"?"calc_worker_stages":"calc_queen_stages")||[];
  sel.innerHTML=stages.map(function(s){return'<option value="'+s.v+'">'+s.l+'</option>';}).join("");
  calcRender();
};

window.calcResetDate=function(){
  var el=$q("calcDate");
  if(el){el.value=new Date().toISOString().slice(0,10);calcRender();}
};

window.calcRender=function(){
  var isEN=D.settings.lang==="en";
  var dateStr=($q("calcDate")||{}).value;
  var tp=($q("calcType")||{}).value||"worker";
  var stage=($q("calcStage")||{}).value||"egg";
  var res=document.getElementById("calcResult");
  if(!res||!dateStr)return;
  var obsDate=new Date(dateStr);
  if(isNaN(obsDate.getTime())){res.innerHTML="";return;}

  if(tp==="worker"){
    var ageNow=CALC_WORKER_AGE[stage]||2;
    var daysLeft=CALC_WORKER_TOTAL-ageNow;
    var forageDate=calcAddDays(obsDate,daysLeft);
    var pct=Math.min(100,Math.max(0,(ageNow/CALC_WORKER_TOTAL)*100));
    var stages=t("calc_worker_stages")||[];
    var stEntry=stages.find(function(s){return s.v===stage;});
    var stLbl=stEntry?stEntry.l.replace(/^[^A-Za-zÀ-ÿ]*/,"").split("(")[0].trim():stage;
    if(daysLeft<=0){
      res.innerHTML='<div class="c" style="border-color:var(--ok);margin-top:0;">'
        +'<div class="ct" style="color:var(--ok);">✅ '+(isEN?"CURRENT STATUS":"STAREA ACTUALĂ")+'</div>'
        +'<div style="font-size:1.3rem;font-weight:800;color:var(--ok);margin:8px 0;">'+t("calc_already_foraging")+'</div>'
        +'<div><span class="bg gg">'+t("calc_stage_obs")+' '+stLbl+'</span></div>'
        +'</div>';
    } else {
      res.innerHTML='<div class="c" style="margin-top:0;">'
        +'<div class="ct">'+t("calc_foraging_title")+'</div>'
        +'<div style="font-size:1.5rem;font-weight:800;color:var(--gold);margin:8px 0;">📅 '+calcFmtDate(forageDate)+'</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'
        +'<span class="bg gy">⏳ '+daysLeft+' '+t("calc_days_left")+'</span>'
        +'<span class="bg gb">🐛 '+stLbl+'</span>'
        +'</div>'
        +'<div style="background:rgba(0,0,0,.25);border-radius:20px;height:10px;overflow:hidden;margin-bottom:4px;">'
        +'<div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,var(--gold),#ffcf4a);border-radius:20px;transition:width .5s;"></div>'
        +'</div>'
        +'<div style="font-size:.74rem;color:var(--mut);">'+t("calc_progress")+' '+Math.floor(pct)+'%</div>'
        +'</div>';
    }
  } else {
    var ageQ=CALC_QUEEN_AGE[stage]||0;
    var daysToMating=Math.max(0,24-ageQ);
    var daysToLay=Math.max(0,CALC_QUEEN_MAX-ageQ);
    var matingDate=calcAddDays(obsDate,daysToMating);
    var layingDate=calcAddDays(obsDate,daysToLay);
    var pctQ=Math.min(100,Math.max(0,(ageQ/CALC_QUEEN_MAX)*100));
    var qstages=t("calc_queen_stages")||[];
    var qEntry=qstages.find(function(s){return s.v===stage;});
    var qLbl=qEntry?qEntry.l.replace(/^[^A-Za-zÀ-ÿ]*/,"").trim():stage;
    if(daysToLay<=0){
      res.innerHTML='<div class="c" style="border-color:var(--ok);margin-top:0;">'
        +'<div class="ct" style="color:var(--ok);">'+t("calc_queen_active")+'</div>'
        +'<div style="font-size:1.3rem;font-weight:800;color:var(--ok);margin:8px 0;">'+t("calc_already_laying")+'</div>'
        +'<span class="bg gg">'+qLbl+'</span>'
        +'<div style="background:rgba(111,191,76,.3);border-radius:20px;height:10px;overflow:hidden;margin-top:10px;">'
        +'<div style="width:100%;height:100%;background:linear-gradient(90deg,var(--ok),#8de860);border-radius:20px;"></div></div>'
        +'</div>';
    } else {
      res.innerHTML='<div class="c" style="margin-top:0;">'
        +'<div class="ct">'+t("calc_queen_title")+'</div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;">'
        +'<div style="background:rgba(255,255,255,.05);border-radius:var(--rs);padding:10px;text-align:center;">'
        +'<div style="font-size:.7rem;color:var(--mut);margin-bottom:4px;">'+t("calc_mating")+'</div>'
        +'<div style="font-size:.95rem;font-weight:800;color:var(--info);">'+calcFmtDate(matingDate)+'</div>'
        +'</div>'
        +'<div style="background:rgba(255,255,255,.05);border-radius:var(--rs);padding:10px;text-align:center;">'
        +'<div style="font-size:.7rem;color:var(--mut);margin-bottom:4px;">'+t("calc_laying_start")+'</div>'
        +'<div style="font-size:.95rem;font-weight:800;color:var(--gold);">'+calcFmtDate(layingDate)+'</div>'
        +'</div></div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'
        +'<span class="bg gy">⏳ '+daysToLay+' '+t("calc_days_to_lay")+'</span>'
        +'<span class="bg gb">'+qLbl+'</span>'
        +'</div>'
        +'<div style="background:rgba(0,0,0,.25);border-radius:20px;height:10px;overflow:hidden;margin-bottom:4px;">'
        +'<div style="width:'+pctQ+'%;height:100%;background:linear-gradient(90deg,var(--info),#74b3ff);border-radius:20px;transition:width .5s;"></div>'
        +'</div>'
        +'<div style="font-size:.74rem;color:var(--mut);">'+t("calc_cycle")+'</div>'
        +'</div>';
    }
  }
};

// ═══════════════════════════════════════════
// HRĂNIRE — Feeding Journal
// ═══════════════════════════════════════════

var _hrHiveFilter="all";
var _hrMonthFilter="all";

function renderHranire(){
  var isEN=D.settings.lang==="en";
  var feedings=D.feedings||[];
  if(!D.hives.length){
    setP('<h2 style="margin-bottom:12px;"><i class="fas fa-bowl-rice" style="color:var(--gold)"></i> '+t("hr_title")+'</h2><div class="al alw">'+t("hr_no_hives")+'</div>');
    return;
  }

  // Build month options from existing data
  var allMonths=[];
  feedings.forEach(function(f){var m=(f.date||"").slice(0,7);if(m&&allMonths.indexOf(m)===-1)allMonths.push(m);});
  allMonths.sort().reverse();

  // Apply filters
  var filtered=feedings;
  if(_hrHiveFilter!=="all") filtered=filtered.filter(function(f){return f.allHives||f.hiveId===_hrHiveFilter;});
  if(_hrMonthFilter!=="all") filtered=filtered.filter(function(f){return(f.date||"").startsWith(_hrMonthFilter);});
  var sorted=filtered.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  // ── Stats for current filter ──────────────────────────────────
  var totQty=filtered.reduce(function(s,f){return s+(f.qty||0);},0);
  var byType={};
  filtered.forEach(function(f){byType[f.feedType]=(byType[f.feedType]||0)+(f.qty||0);});
  var uniqueHives=new Set(filtered.map(function(f){return f.allHives?"__all__":f.hiveId;})).size;
  var avgPerHive=uniqueHives>0?(totQty/uniqueHives).toFixed(1):"—";

  var statH='<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px;">'
    +'<div class="c"><div class="cl">'+t("hr_total_qty")+'</div><div class="cv">'+totQty.toFixed(1)+'</div><div class="cs">kg + L</div></div>'
    +'<div class="c"><div class="cl">'+t("hr_total_entries")+'</div><div class="cv">'+filtered.length+'</div></div>'
    +'<div class="c"><div class="cl">'+t("hr_avg_per_hive")+'</div><div class="cv" style="font-size:1.1rem;">'+avgPerHive+'</div><div class="cs">kg+L</div></div>'
    +'</div>';

  // ── Feed-type breakdown bars ──────────────────────────────────
  var types=t("hr_types")||[];
  var typeBarH='<div class="c" style="margin-bottom:14px;padding:12px 14px;">'
    +'<div class="ct" style="margin-bottom:10px;">'+t("hr_stat_title")+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:8px;">';
  types.forEach(function(tp){
    var qty=byType[tp.v]||0;
    if(!qty&&_hrHiveFilter==="all"&&_hrMonthFilter==="all")return;
    var pct=totQty>0?Math.round((qty/totQty)*100):0;
    var emoji=tp.l.split(" ")[0];
    typeBarH+='<div>'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:3px;">'
      +'<span style="font-size:.75rem;color:var(--txt);">'+emoji+' '+tp.l.replace(/^[^ ]+ /,"")+'</span>'
      +'<span style="font-size:.75rem;font-weight:700;color:var(--gold);">'+qty.toFixed(1)+' '+(tp.u||"kg")+'</span>'
      +'</div>'
      +'<div style="height:5px;border-radius:5px;background:rgba(200,135,14,.15);">'
      +'<div style="width:'+pct+'%;height:100%;border-radius:5px;background:var(--gold);transition:width .4s;"></div>'
      +'</div></div>';
  });
  if(!Object.keys(byType).length) typeBarH+='<div style="font-size:.8rem;color:var(--mut);">'+t("hr_no_data")+'</div>';
  typeBarH+='</div></div>';

  // ── Per-hive summary cards ────────────────────────────────────
  var hvCardsH='<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:14px;">';
  D.hives.forEach(function(hv){
    var hvFeeds=feedings.filter(function(f){return f.hiveId===hv.id||f.allHives;});
    var hvTot=hvFeeds.reduce(function(s,f){return s+(f.qty||0);},0);
    var hvLast=hvFeeds.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
    var daysSince=hvLast?Math.round((Date.now()-new Date(hvLast.date))/86400000):null;
    var freshness=daysSince===null?"var(--mut)":daysSince<=14?"var(--ok)":daysSince<=30?"var(--gold)":"var(--danger)";
    hvCardsH+='<div class="c" style="cursor:pointer;border-left:3px solid '+freshness+';" onclick="_hrHiveFilter=\''+hv.id+'\';renderHranire();">'
      +'<div class="cl" style="margin-bottom:3px;">🏠 '+hv.name+'</div>'
      +'<div style="font-size:1.2rem;font-weight:700;color:var(--gold);">'+hvTot.toFixed(1)+' <span style="font-size:.7rem;font-weight:400;color:var(--mut);">kg+L</span></div>'
      +'<div style="font-size:.69rem;color:var(--mut);margin-top:2px;">'+(hvLast?'📅 '+hvLast.date+' ('+daysSince+(isEN?"d ago":"z)"):isEN?"No feedings":"Nicio hrănire")+'</div>'
      +'<div style="font-size:.68rem;color:var(--mut);">'+hvFeeds.length+(isEN?" sessions":" hrăniri")+'</div>'
      +'</div>';
  });
  hvCardsH+='</div>';

  // ── Monthly chart ─────────────────────────────────────────────
  var chartH='<div class="c" style="margin-bottom:14px;"><div class="ct">'+t("hr_chart_title")+'</div><canvas id="hrChart" height="70"></canvas></div>';

  // ── Transaction list ──────────────────────────────────────────
  var types2=t("hr_types")||[];
  var listH=sorted.length?sorted.map(function(f){
    var hv=f.allHives?{name:t("hr_all_hives")}:D.hives.find(function(h){return h.id===f.hiveId;})||{name:"—"};
    var tp=types2.find(function(x){return x.v===f.feedType;})||{l:f.feedType||"?",u:"kg"};
    var invItem=f.invItemId?D.inventory.find(function(i){return i.id===f.invItemId;}):null;
    return'<div class="c" style="padding:10px 13px;margin-bottom:7px;">'
      +'<div style="display:flex;align-items:flex-start;gap:9px;">'
      +'<div style="width:36px;height:36px;border-radius:50%;background:rgba(200,135,14,.13);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">🍬</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:4px;">'
      +'<span style="font-size:.86rem;font-weight:700;color:var(--txt);">'+tp.l.replace(/^[^ ]+ /,"")+'</span>'
      +'<span style="font-size:.78rem;font-weight:700;color:var(--gold);">'+f.qty+' '+(f.unit||tp.u||"kg")+'</span>'
      +'</div>'
      +'<div style="font-size:.74rem;color:var(--mut);margin-top:3px;">📅 '+f.date+' &nbsp;🏠 '+hv.name+(f.reason?' &nbsp;'+f.reason.split(" ")[0]+' '+f.reason.split(" ").slice(1).join(" "):"")+'</div>'
      +(invItem?'<div style="font-size:.68rem;color:var(--mut);margin-top:2px;">📦 '+invItem.name+' ('+t("hr_inv_stock")+' '+invItem.qty+' '+(isEN?"units":"buc")+')</div>':"")
      +(f.notes?'<div style="font-size:.72rem;color:var(--mut);font-style:italic;margin-top:2px;">'+f.notes+'</div>':"")
      +'</div>'
      +'<div style="display:flex;gap:4px;flex-shrink:0;">'
      +'<button class="btn sm be" onclick="hrM(\''+f.id+'\')">✏️</button>'
      +'<button class="btn sm bd" onclick="delHr(\''+f.id+'\')">🗑️</button>'
      +'</div></div></div>';
  }).join(""):'<div class="al ali">'+t("hr_no_data")+'</div>';

  // Filters row
  var hiveOpts='<option value="all">'+t("hr_all_hives")+'</option>'
    +D.hives.map(function(h){return'<option value="'+h.id+'"'+(_hrHiveFilter===h.id?" selected":"")+'>'+h.name+'</option>';}).join("");
  var monthOpts='<option value="all">'+t("hr_all_months")+'</option>'
    +allMonths.map(function(m){return'<option value="'+m+'"'+(_hrMonthFilter===m?" selected":"")+'>'+m+'</option>';}).join("");
  var selStyle='font-size:.8rem;padding:5px 8px;border-radius:var(--rs);background:var(--sur);border:1px solid var(--bdr);color:var(--txt);';

  setP('<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;">'
    +'<h2 style="margin:0;font-size:1.2rem;"><i class="fas fa-bowl-rice" style="color:var(--gold)"></i> '+t("hr_title")+'</h2>'
    +'<button class="btn sm" onclick="hrM(\'\')">'+t("hr_new")+'</button>'
    +'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">'
    +t("hr_filter_hive")+'<select style="'+selStyle+'" onchange="_hrHiveFilter=this.value;renderHranire();">'+hiveOpts+'</select>'
    +t("hr_filter_month")+'<select style="'+selStyle+'" onchange="_hrMonthFilter=this.value;renderHranire();">'+monthOpts+'</select>'
    +'<button class="btn sm gh" onclick="_hrHiveFilter=\'all\';_hrMonthFilter=\'all\';renderHranire();">↺</button>'
    +'</div>'
    +statH+hvCardsH+typeBarH+chartH+listH);

  // Monthly chart
  setTimeout(function(){
    var canv=document.getElementById("hrChart");if(!canv)return;
    var mLabels=t("hr_month_labels");
    var curYr=new Date().getFullYear();
    // Two year bars: current and previous
    var yrs=[curYr,curYr-1];
    var datasets=yrs.map(function(yr,yi){
      var data=Array.from({length:12},function(_,m){
        return feedings.filter(function(f){
          var d=f.date||"";
          return d.startsWith(yr+"-")&&parseInt(d.slice(5,7))-1===m
            &&(_hrHiveFilter==="all"||f.allHives||f.hiveId===_hrHiveFilter);
        }).reduce(function(s,f){return s+(f.qty||0);},0);
      });
      return{
        label:String(yr),data:data,
        backgroundColor:yi===0?"rgba(200,135,14,.7)":"rgba(200,135,14,.25)",
        borderColor:yi===0?"#c8870e":"rgba(200,135,14,.5)",
        borderWidth:1.5,borderRadius:4
      };
    });
    new Chart(canv.getContext("2d"),{
      type:"bar",
      data:{labels:mLabels,datasets:datasets},
      options:{responsive:true,
        plugins:{legend:{labels:{color:"#b9b5ae",font:{size:10},boxWidth:14}}},
        scales:{
          x:{ticks:{color:"#b9b5ae",font:{size:9}},grid:{color:"rgba(255,255,255,.04)"}},
          y:{ticks:{color:"#b9b5ae",font:{size:9}},grid:{color:"rgba(255,255,255,.05)"},beginAtZero:true}
        }}
    });
  },80);
}

window.delHr=function(id){
  showConfirm(t("hr_del_c"),function(){
    D.feedings=D.feedings.filter(function(f){return f.id!==id;});
    save();renderHranire();
  });
};

function hrM(id){
  var ex=id?((D.feedings||[]).find(function(f){return f.id===id;})):null;
  var isEN=D.settings.lang==="en";
  var types=t("hr_types")||[];
  var reasons=t("hr_reasons")||[];
  var curType=xv(ex,"feedType","sirop_1_1");
  var curUnit=xv(ex,"unit",(types.find(function(x){return x.v===curType;})||{u:"L"}).u);
  var isAllHives=xv(ex,"allHives",false);

  var typeOpts=types.map(function(tp){return'<option value="'+tp.v+'"'+(curType===tp.v?" selected":"")+'>'+tp.l+'</option>';}).join("");
  var reasonOpts='<option value="">—</option>'+reasons.map(function(r){return'<option'+(xv(ex,"reason","")=== r?" selected":"")+'>'+r+'</option>';}).join("");

  // Inventory items — pick feeding-related ones preferentially
  var feedInvItems=D.inventory.filter(function(i){
    var n=(i.name||"").toLowerCase();
    return n.indexOf("sirop")>=0||n.indexOf("zahar")>=0||n.indexOf("zahăr")>=0||n.indexOf("candy")>=0||n.indexOf("apifond")>=0||n.indexOf("hrăn")>=0||n.indexOf("Polen")>=0||n.indexOf("pollen")>=0||i.cat==="Hrănire";
  });
  var allInvItems=D.inventory;
  var invOptItems=feedInvItems.length?feedInvItems:allInvItems;
  var invOpts='<option value="">—</option>'+invOptItems.map(function(i){return'<option value="'+i.id+'"'+(xv(ex,"invItemId","")=== i.id?" selected":"")+'>'+i.name+' ('+i.qty+' '+(isEN?"units":"buc")+')</option>';}).join("");

  openM('<div class="mt">'+(id?t("hr_edit_t"):t("hr_new_t"))+'</div>'
    +'<div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:.83rem;cursor:pointer;">'
    +'<input type="radio" name="hrHiveMode" value="single" onchange="hrToggleHiveMode(false)"'+(isAllHives?"":" checked")+'>🏠 '+t("hr_hive")+'</label>'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:.83rem;cursor:pointer;">'
    +'<input type="radio" name="hrHiveMode" value="all" onchange="hrToggleHiveMode(true)"'+(isAllHives?" checked":"")+'>'+t("hr_all_hives")+'</label>'
    +'</div>'
    +'<div id="hrHiveRow"'+(isAllHives?' style="display:none;"':"")+'>'+L(t("hr_hive"))
    +'<select id="hrHv"><option value="">—</option>'
    +D.hives.map(function(h){return'<option value="'+h.id+'"'+(xv(ex,"hiveId","")=== h.id?" selected":"")+'>'+h.name+'</option>';}).join("")
    +'</select></div>'
    +'<div class="r2">'
    +'<div>'+L(t("hr_date"))+'<input type="date" id="hrDt" value="'+xv(ex,"date",new Date().toISOString().slice(0,10))+'"></div>'
    +'<div>'+L(t("hr_type"))+'<select id="hrTp" onchange="hrTypeChanged(this.value)">'+typeOpts+'</select></div>'
    +'</div>'
    +'<div class="r2">'
    +'<div>'+L(t("hr_qty"))+'<input type="number" id="hrQt" inputmode="decimal" step="0.1" value="'+xv(ex,"qty","")+'"></div>'
    +'<div>'+L(t("hr_unit"))+'<select id="hrUn"><option'+(curUnit==="L"?" selected":"")+'>L</option><option'+(curUnit==="kg"?" selected":"")+'>kg</option><option'+(curUnit==="g"?" selected":"")+'>g</option></select></div>'
    +'</div>'
    +L(t("hr_reason"))+'<select id="hrRs">'+reasonOpts+'</select>'
    +L(t("hr_inv_link"))+'<select id="hrInv" onchange="hrInvChanged(this.value)">'+invOpts+'</select>'
    +'<div id="hrInvInfo" style="font-size:.78rem;color:var(--mut);margin:4px 0 8px;min-height:16px;"></div>'
    +L(t("hr_notes"))+'<textarea id="hrNt" rows="2">'+xv(ex,"notes","")+'</textarea>'
    +'<div class="br" style="margin-top:14px;"><button class="btn" onclick="saveHr(\''+( id||"")+'\')">'+btnS()+'</button><button class="btn gh" onclick="closeM()">'+btnC()+'</button></div>');

  setTimeout(function(){hrInvChanged(xv(ex,"invItemId",""));},60);
}

window.hrToggleHiveMode=function(allHives){
  var row=document.getElementById("hrHiveRow");
  if(row)row.style.display=allHives?"none":"";
};

window.hrTypeChanged=function(v){
  var types=t("hr_types")||[];
  var tp=types.find(function(x){return x.v===v;});
  var unSel=document.getElementById("hrUn");
  if(tp&&unSel){
    for(var i=0;i<unSel.options.length;i++){
      if(unSel.options[i].value===tp.u){unSel.selectedIndex=i;break;}
    }
  }
};

window.hrInvChanged=function(invId){
  var el=document.getElementById("hrInvInfo");
  if(!el)return;
  if(!invId){el.innerHTML="";return;}
  var item=D.inventory.find(function(i){return i.id===invId;});
  if(!item){el.innerHTML="";return;}
  var isEN=D.settings.lang==="en";
  var col=item.qty<=item.min?"var(--danger)":item.qty<=item.min*2?"var(--gold)":"var(--ok)";
  el.innerHTML='📦 '+item.name+' — <span style="color:'+col+';font-weight:700;">'+item.qty+' '+(isEN?"units available":"buc disponibile")+'</span>'+(item.qty<=item.min?' ⚠️ '+t("hr_inv_warn"):"");
};

window.saveHr=function(id){
  var allHives=document.querySelector("input[name='hrHiveMode']:checked");
  allHives=allHives&&allHives.value==="all";
  var hiveId=($q("hrHv")||{}).value||null;
  if(!allHives&&!hiveId){toast("⚠️ "+(D.settings.lang==="en"?"Select a hive!":"Selectați un stup!"));return;}
  var qty=parseFloat(($q("hrQt")||{}).value)||0;
  if(!qty){toast("⚠️ "+(D.settings.lang==="en"?"Enter a quantity!":"Introduceți cantitatea!"));return;}
  var invId=($q("hrInv")||{}).value||null;

  // Inventory deduction
  if(invId&&qty>0){
    var item=D.inventory.find(function(i){return i.id===invId;});
    if(item){
      // If editing, restore old qty first
      if(id){
        var old=(D.feedings||[]).find(function(f){return f.id===id;});
        if(old&&old.invItemId===invId)item.qty+=old.qty||0;
      }
      if(qty>item.qty){
        toast("⚠️ "+t("hr_inv_warn"),"⚠️");
        // allow save but cap deduction at current stock
        item.qty=0;
      }else{
        item.qty=parseFloat((item.qty-qty).toFixed(2));
      }
    }
  }

  var o={
    id:id||uid(),
    allHives:allHives,
    hiveId:allHives?null:hiveId,
    date:($q("hrDt")||{}).value||new Date().toISOString().slice(0,10),
    feedType:($q("hrTp")||{}).value||"altul",
    qty:qty,
    unit:($q("hrUn")||{}).value||"kg",
    reason:($q("hrRs")||{}).value||"",
    invItemId:invId||null,
    notes:($q("hrNt")||{}).value||""
  };
  if(!D.feedings)D.feedings=[];
  if(id){var ex=D.feedings.find(function(f){return f.id===id;});if(ex)Object.assign(ex,o);}
  else{D.feedings.push(o);}
  save();closeM();renderHranire();toast(t("hr_saved"),"🍬");
};

var _tkTab="pending";

function renderSarcini(){
  var isEN=D.settings.lang==="en";
  var tasks=D.tasks||[];
  var todayStr=new Date().toISOString().slice(0,10);

  // Filter tasks per active tab
  var tabTasks;
  if(_tkTab==="pending") tabTasks=tasks.filter(function(tk){return !tk.done;});
  else if(_tkTab==="today") tabTasks=tasks.filter(function(tk){return !tk.done&&tk.dueDate===todayStr;});
  else if(_tkTab==="overdue") tabTasks=tasks.filter(function(tk){return !tk.done&&tk.dueDate&&tk.dueDate<todayStr;});
  else tabTasks=tasks.filter(function(tk){return tk.done;});

  // Sort: overdue first, then by date, then by priority weight
  var prioW={high:0,medium:1,low:2};
  tabTasks=tabTasks.slice().sort(function(a,b){
    var aOvd=a.dueDate&&a.dueDate<todayStr?0:1;

    return (prioW[a.priority]||1)-(prioW[b.priority]||1);

  // Stats
  var nPending=tasks.filter(function(tk){return !tk.done;}).length;

    var dueLbl=tk.done?(tk.doneDate?'✅ '+tk.doneDate:"✅")

      :isTdy?('<span style="color:var(--gold);font-weight:700;">📅 '+t("tk_today")+'</span>')
      :isTmr?('<span style="color:var(--gold);">🌅 '+t("tk_tomorrow")+'</span>')
      :(tk.dueDate?'📅 '+tk.dueDate:"");
    var col=tk.done?"var(--mut)":(prioCols[tk.priority]||"var(--mut)");
    return'<div class="c" style="padding:11px 14px;margin-bottom:8px;border-left:3px solid '+col+(tk.done?';opacity:.65':"")+';">'
      +'<div style="display:flex;align-items:flex-start;gap:10px;">'
      +'<div style="flex:1;min-width:0;">'
      +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;">'
      +'<span style="font-size:.9rem;font-weight:600;color:var(--txt);">'+tk.title+'</span>'
      +(tk.category?'<span style="font-size:.65rem;background:var(--bg2);padding:2px 7px;border-radius:20px;color:var(--mut);white-space:nowrap;">'+tk.category+'</span>':"")
      +'</div>'
      +'<div style="font-size:.74rem;color:var(--mut);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;">'
      +dueLbl
      +(hv?'<span>🏠 '+hv.name+'</span>':"")
      +'<span style="color:'+col+';">'+prioLabels[tk.priority||"medium"]+'</span>'
      +(tk.recurring&&tk.recurDays?'<span>🔄 /'+tk.recurDays+(isEN?"d":"z")+'</span>':"")
      +'</div>'

      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">'
      +(!tk.done?'<button class="btn sm" style="background:var(--ok);border-color:var(--ok);font-size:.72rem;padding:4px 8px;" onclick="tkDone(\''+tk.id+'\')">✓</button>':"")

      +'<button class="btn sm bd" onclick="delTk(\''+tk.id+'\')" style="font-size:.72rem;padding:4px 8px;">🗑️</button>'
      +'</div>'
      +'</div></div>';
  }).join("")
  :'<div class="al ali">'+(_tkTab==="pending"?t("tk_no_pending"):t("tk_no_data"))+'</div>';

  setP('<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;">'
    +'<h2 style="margin:0;font-size:1.2rem;"><i class="fas fa-list-check" style="color:var(--gold)"></i> '+t("tk_title")+'</h2>'
    +'<button class="btn sm" onclick="tkM(\'\')">'+t("tk_new")+'</button>'
    +'</div>'
    +tabs+listH);
}

// Shared helper: classify a varroa test entry into ok / watch / treat
function vrLevel(v){
  if(!v)return"ok";
  var m=v.method||"natural";
  if(m==="natural"||m==="sticky"){
    var mpt=v.miteCount||0;
    // Normalise to per-24h
    var h=v.hours||24;
    var rate=mpt/(h/24);
    if(rate<3)return"ok";
    if(rate<10)return"watch";
    return"treat";
  }else{
    var pct=v.infestationPct||0;
    if(pct<1)return"ok";
    if(pct<2)return"watch";
    return"treat";
  }
}

// Compute infestationPct for wash/roll methods and store on object
function vrCalcPct(v){
  if(v.method==="natural"||v.method==="sticky")return null;
  var bees=v.beeCount||300;
  var mites=v.miteCount||0;
  return parseFloat(((mites/bees)*100).toFixed(2));
}

    +'<div style="display:flex;flex-direction:column;gap:3px;">'

    +'<label style="display:flex;align-items:center;gap:5px;font-size:.82rem;cursor:pointer;"><input type="radio" name="vrBrood" value="0"'+(!xv(ex,"hasBrood",true)?" checked":"")+'>'+t("vr_no")+'</label>'

window.vrToggleFields=function(meth){
  var isEN=D.settings.lang==="en";
  var isWash=meth==="alcohol"||meth==="sugar";
  var cont=document.getElementById("vrFields");
  if(!cont)return;
  cont.innerHTML=isWash
    ?'<div class="r2"><div>'+L(t("vr_bees"))+'<input type="number" id="vrBees" inputmode="numeric" value="300" oninput="vrLiveCalc()"></div>'
     +'<div>'+L(t("vr_mites"))+'<input type="number" id="vrMites" inputmode="numeric" value="0" oninput="vrLiveCalc()"></div></div>'
    :'<div class="r2"><div>'+L(t("vr_hours"))
     +'<select id="vrHrs"><option value="24">24h</option><option value="48">48h</option><option value="72">72h</option></select></div>'
     +'<div>'+L(t("vr_mites"))+'<input type="number" id="vrMites" inputmode="numeric" value="0" oninput="vrLiveCalc()"></div></div>';

};

window.vrLiveCalc=function(){
  var res=document.getElementById("vrResult");if(!res)return;
  var isEN=D.settings.lang==="en";
  var meth=($q("vrMeth")||{}).value||"natural";
  var mites=parseInt(($q("vrMites")||{}).value)||0;
  var isWash=meth==="alcohol"||meth==="sugar";
  var lvl,txt;
  if(isWash){
    var bees=parseInt(($q("vrBees")||{}).value)||300;
    var pct=(mites/bees)*100;
    lvl=pct<1?"ok":pct<2?"watch":"treat";
    txt=(isEN?"Infestation: ":"Infestare: ")+"<strong>"+pct.toFixed(2)+"%</strong> ("+mites+(isEN?" mites / ":" acarieni / ")+bees+(isEN?" bees)":" albine)");
  }else{
    var hrs=parseInt(($q("vrHrs")||{}).value)||24;
    var rate=mites/(hrs/24);
    lvl=rate<3?"ok":rate<10?"watch":"treat";
    txt=(isEN?"Drop rate: ":"Rată cădere: ")+"<strong>"+rate.toFixed(1)+" "+(isEN?"mites/24h":"acarieni/24h")+"</strong>";
  }
  var col=lvl==="ok"?"var(--ok)":lvl==="watch"?"var(--gold)":"var(--danger)";
  var badge=lvl==="ok"?t("vr_result_ok"):lvl==="watch"?t("vr_result_watch"):t("vr_result_treat");
  res.style.background=col.replace(')',',0.08)').replace('var(','rgba(')+'08)';
  res.style.borderColor=col.replace(')',',0.4)').replace('var(','rgba(')+'4)';
  res.innerHTML='<span style="color:'+col+';">'+txt+'</span><br><span style="color:'+col+';font-weight:700;font-size:.85rem;">'+badge+'</span>';
};

window.saveVr=function(id){
  var meth=($q("vrMeth")||{}).value||"natural";
  var mites=parseInt(($q("vrMites")||{}).value)||0;
  var bees=parseInt(($q("vrBees")||{}).value)||300;
  var hrs=parseInt(($q("vrHrs")||{}).value)||24;
  var hasBrood=document.querySelector("input[name='vrBrood']:checked");
  var isWash=meth==="alcohol"||meth==="sugar";
  var infPct=isWash?parseFloat(((mites/bees)*100).toFixed(2)):null;
  var o={
    id:id||uid(),
    hiveId:($q("vrHv")||{}).value||"",
    date:($q("vrDt")||{}).value||new Date().toISOString().slice(0,10),
    method:meth,
    miteCount:mites,
    beeCount:isWash?bees:null,
    hours:isWash?null:hrs,
    infestationPct:infPct,
    hasBrood:hasBrood?hasBrood.value==="1":true,
    notes:($q("vrNotes")||{}).value||""
  };
  if(!D.varroa)D.varroa=[];
  if(id){var ex=D.varroa.find(function(v){return v.id===id;});if(ex)Object.assign(ex,o);}
  else{D.varroa.push(o);}
  save();closeM();renderVarroa();toast(t("vr_saved"),"🕷️");
};

  allYears.sort(function(a,b){return b-a;});
  if(allYears.indexOf(_finYear)===-1)_finYear=allYears[0];

  var yearFins=fins.filter(function(f){return(f.date||"").startsWith(String(_finYear));});
  var tabFins=_finTab==="income"?yearFins.filter(function(f){return f.type==="income";}):_finTab==="expense"?yearFins.filter(function(f){return f.type==="expense";}):yearFins;
  tabFins=[].concat(tabFins).sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  var totInc=yearFins.filter(function(f){return f.type==="income";}).reduce(function(s,f){return s+f.amount;},0);
  var totExp=yearFins.filter(function(f){return f.type==="expense";}).reduce(function(s,f){return s+f.amount;},0);
  var netPL=totInc-totExp;
  var totHoney=fins.filter(function(f){return(f.date||"").startsWith(String(_finYear))&&f.type==="expense";}).reduce(function(s,f){return s+f.amount;},0);
  var totKg=D.honeyHarvests.filter(function(h){return(h.extractionDate||h.date||"").startsWith(String(_finYear));}).reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);

    +'<div class="c"><div class="cl">'+t("fin_total_expense")+'</div><div class="cv" style="color:var(--danger)">'+totExp.toFixed(0)+'</div><div class="cs">RON</div></div>'

  kpiH+=(netPL>=0?"+":"")+netPL.toFixed(0)+'</div><div class="cs">RON</div></div>'

  var tabs='<div style="display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap;">'
    +[["all",t("fin_tab_all")],["income",t("fin_tab_income")],["expense",t("fin_tab_expense")]].map(function(tb){
      return'<button class="btn sm'+(tb[0]===_finTab?"":" gh")+'" onclick="_finTab=\''+tb[0]+'\';renderFinanciar();">'+tb[1]+'</button>';
    }).join("")+'</div>';

    var isInc=f.type==="income";
    return'<div class="c" style="padding:10px 13px;margin-bottom:7px;">'
      +'<div style="display:flex;align-items:flex-start;gap:9px;">'

  if(hasMonthlyData){

window.delFin=function(id){
  showConfirm(t("fin_del_c"),function(){
    var fin=D.finances.find(function(f){return f.id===id;});
    // Restaurează inventarul dacă e o vânzare de miere cu saleLines
    if(fin&&fin.saleLines&&fin.saleLines.length){
      fin.saleLines.forEach(function(ln){
        var pkg=D.inventory.find(function(p){return p.id===ln.invId;});
        if(pkg)pkg.qty=(pkg.qty||0)+(parseInt(ln.pcs)||0);
      });
    }
    D.finances=D.finances.filter(function(f){return f.id!==id;});
    save();renderFinanciar();
  });
};

// ── Honey Sale Modal ──────────────────────────────────────────
var _hSaleLines=[];

// Recalculează totalurile din DOM fără a re-randa modalul
function _hsUpdateTotals(){
  var pkgItems=D.inventory.filter(function(i){return i.cat==="Ambalaje"||i.cat==="Packaging";});
  var grandTotal=0,grandHoney=0;
  _hSaleLines.forEach(function(ln,idx){
    var pkg=pkgItems.find(function(i){return i.id===ln.invId;})||pkgItems[0];
    var hkg=pkg?pkg.honeyKg||0:0;
    var pcs=parseInt(ln.pcs)||0;
    var price=parseFloat(ln.price)||0;
    var lineTotal=price*pcs;
    grandTotal+=lineTotal;
    grandHoney+=hkg*pcs;
    var lineTotEl=document.getElementById("hsLT_"+idx);
    if(lineTotEl)lineTotEl.textContent=lineTotal.toFixed(2)+" RON";
    var honeyEl=document.getElementById("hsLH_"+idx);
    if(honeyEl)honeyEl.textContent="\ud83c\udf6f "+(hkg*pcs>0?(hkg*pcs).toFixed(3)+" kg miere":(hkg?hkg+" kg/buc":"\u2014 kg nedefinit"));
  });
  var gtEl=document.getElementById("hsGrandTotal");
  if(gtEl)gtEl.textContent=grandTotal.toFixed(2)+" RON";
  var ghEl=document.getElementById("hsGrandHoney");
  if(ghEl)ghEl.textContent=grandHoney>0?grandHoney.toFixed(3)+" kg":"\u2014";
}

window.saveHoneySale=function(){
  var pkgItems=D.inventory.filter(function(i){return i.cat==="Ambalaje"||i.cat==="Packaging";});
  var isEN=D.settings.lang==="en";
  for(var i=0;i<_hSaleLines.length;i++){
    var ln=_hSaleLines[i];
    var pkg=pkgItems.find(function(p){return p.id===ln.invId;});
    if(!pkg)continue;
    if((parseInt(ln.pcs)||0)<1){toast("\u26a0\ufe0f "+(isEN?"Quantity must be at least 1":"Cantitatea trebuie s\u0103 fie cel pu\u021bin 1"));return;}
    if(ln.price===undefined||ln.price===null||ln.price===""||parseFloat(ln.price)<0){toast("\u26a0\ufe0f "+(isEN?"Enter price (0 for gift/donation)":"Introduce\u021bi pre\u021bul (0 pentru cadou)"));return;}
    if((parseInt(ln.pcs)||0)>pkg.qty){toast("\u26a0\ufe0f "+pkg.name+": "+t("inv_sell_stock_warn")+" (stoc: "+pkg.qty+")");return;}
  }
  var grandTotal=_hSaleLines.reduce(function(s,ln){return s+(parseFloat(ln.price)||0)*(parseInt(ln.pcs)||0);},0);
  var grandHoney=_hSaleLines.reduce(function(s,ln){
    var pkg=pkgItems.find(function(p){return p.id===ln.invId;})||pkgItems[0];
    return s+(pkg?pkg.honeyKg||0:0)*(parseInt(ln.pcs)||0);
  },0);
  var isGift=grandTotal===0;
  var saleDate=($q("hsSaleDate")||{}).value||new Date().toISOString().slice(0,10);
  var notes=($q("hsNotes")||{}).value||"";
  var desc=_hSaleLines.map(function(ln){
    var pkg=pkgItems.find(function(p){return p.id===ln.invId;})||pkgItems[0];
    var priceStr=parseFloat(ln.price)===0?(isEN?"gift":"cadou"):(parseFloat(ln.price)||0).toFixed(2)+" RON";
    return(parseInt(ln.pcs)||0)+"\u00d7 "+pkg.name+" @ "+priceStr;
  }).join(", ");
  _hSaleLines.forEach(function(ln){
    var pkg=D.inventory.find(function(p){return p.id===ln.invId;});
    if(pkg)pkg.qty=Math.max(0,pkg.qty-(parseInt(ln.pcs)||0));
  });
  D.finances.push({
    id:uid(),type:"income",
    date:saleDate,
    amount:grandTotal,
    category:isGift?(isEN?"Honey gift":"Cadou miere"):(isEN?"Honey sale":"V\u00e2nzare miere"),
    qty:grandHoney>0?parseFloat(grandHoney.toFixed(3)):null,
    notes:(notes?(notes+"\n"):"")+desc,
    saleLines:JSON.parse(JSON.stringify(_hSaleLines))
  });
  save();closeM();renderFinanciar();
  toast(isGift?"\ud83c\udf81 "+(isEN?"Gift saved! Stock updated.":"Cadou salvat! Stoc actualizat."):"\ud83c\udf6f "+t("inv_sell_saved"));
};

function finM(id,preset){

  var ex=id?D.finances.find(function(f){return f.id===id;}):null;
  var isInc=ex?ex.type==="income":preset!==-2;
  var isEN=D.settings.lang==="en";
  var incCats=t("fin_income_cats"),expCats=t("fin_expense_cats");

  var typeRow=(ex||preset===-1||preset===-2)?""
    :'<div style="display:flex;gap:8px;margin-bottom:10px;">'
    +'<button id="finTpInc" class="btn sm'+(isInc?"":" gh")+'" type="button" onclick="finToggleType(true)">💰 '+(isEN?"Income":"Venit")+'</button>'

  };

  // Build multi-checkbox category selector for expenses
  var buildExpCatCheckboxes=function(selectedRaw){

        +'<input type="checkbox" id="finExpCat_'+i+'" name="finExpCats" value="'+c+'"'+chk+' style="width:16px;height:16px;accent-color:var(--danger);cursor:pointer;">'

  var catHTML=isInc
    ? L(t("fin_category"))+'<select id="finCat">'+catOpts("income")+'</select>'

      +'<div id="finExpCatBox" style="background:var(--sur2,var(--sur));border:1px solid var(--bdr);border-radius:var(--rs);padding:8px 10px;max-height:200px;overflow-y:auto;">'
      +buildExpCatCheckboxes(xv(ex,"category",""))
      +'</div>'
      +'<input type="hidden" id="finCat" value="'+xv(ex,"category","")+'">';

  openM('<div class="mt">'+iTitle+'</div>'
    +'<input type="hidden" id="finType" value="'+(isInc?"income":"expense")+'">'
    +typeRow
    +'<div class="r2">'
    +'<div>'+L(t("fin_date"))+'<input type="date" id="finDt" value="'+(xv(ex,"date",new Date().toISOString().slice(0,10)))+'"></div>'
    +'<div>'+L(t("fin_amount"))+'<input type="number" inputmode="decimal" step="0.01" id="finAmt" value="'+(xv(ex,"amount",""))+'" placeholder="0.00" oninput="finCalcAmt()"></div>'
    +'</div>'
    +catHTML
    +'<div id="finHoneyExtra">'+(isInc?'<div class="r2" style="margin-top:6px;"><div>'+L(t("fin_qty"))+'<input type="number" inputmode="decimal" step="0.1" id="finQty" value="'+(xv(ex,"qty",""))+'" placeholder="0.0" oninput="finCalcAmt()"></div><div>'+L(t("fin_price_kg"))+'<input type="number" inputmode="decimal" step="0.01" id="finPpk" value="'+(xv(ex,"pricePerUnit",""))+'" placeholder="0.00" oninput="finCalcAmt()"></div></div>':"")+'</div>'
    +L(t("fin_hive"))+'<select id="finHv"><option value="">—</option>'+D.hives.map(function(h){return'<option value="'+h.id+'"'+(xv(ex,"hiveId","")=== h.id?" selected":"")+'>'+h.name+'</option>';}).join("")+'</select>'
    +L(t("fin_notes"))+'<textarea id="finNt" rows="2">'+(xv(ex,"notes",""))+'</textarea>'
    +'<div class="br" style="margin-top:14px;"><button class="btn" onclick="saveFin(\''+(id||"")+'\')" >'+btnS()+'</button><button class="btn gh" onclick="closeM()">'+btnC()+'</button></div>');

window.finToggleType=function(isInc){
  var incCats=t("fin_income_cats"),expCats=t("fin_expense_cats");
  document.getElementById("finType").value=isInc?"income":"expense";
  var incBtn=document.getElementById("finTpInc"),expBtn=document.getElementById("finTpExp");
  if(incBtn){incBtn.className="btn sm"+(isInc?"":" gh");}
  if(expBtn){expBtn.className="btn sm"+(isInc?" gh":"");}
  // Replace category selector depending on type
  var catContainer=document.getElementById("finCat")?document.getElementById("finCat").parentNode:null;
  // Find label before finCat and the finCat element
  if(isInc){
    // Restore select for income
    var expBox=document.getElementById("finExpCatBox");
    var hiddenCat=document.getElementById("finCat");
    var container=expBox?expBox.parentNode:(hiddenCat?hiddenCat.parentNode:null);
    if(expBox&&hiddenCat&&container){
      var sel=document.createElement("select");sel.id="finCat";
      sel.innerHTML=incCats.map(function(c){return'<option>'+c+'</option>';}).join("");
      container.replaceChild(sel,expBox);
      hiddenCat.parentNode&&hiddenCat.parentNode.removeChild(hiddenCat);
    }
  } else {
    // Replace select with checkboxes for expense
    var selEl=document.getElementById("finCat");
    if(selEl&&selEl.tagName==="SELECT"){
      var par=selEl.parentNode;
      var boxDiv=document.createElement("div");
      boxDiv.id="finExpCatBox";
      boxDiv.style.cssText="background:var(--sur2,var(--sur));border:1px solid var(--bdr);border-radius:var(--rs);padding:8px 10px;max-height:200px;overflow-y:auto;";
      boxDiv.innerHTML=expCats.map(function(c,i){
        return'<label style="display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.03);margin-bottom:3px;">'
          +'<input type="checkbox" id="finExpCat_'+i+'" name="finExpCats" value="'+c+'" style="width:16px;height:16px;accent-color:var(--danger);cursor:pointer;">'
          +'<span style="font-size:.83rem;color:var(--txt);">'+c+'</span>'
          +'</label>';
      }).join("");
      var hidInp=document.createElement("input");hidInp.type="hidden";hidInp.id="finCat";hidInp.value="";
      par.replaceChild(boxDiv,selEl);
      par.insertBefore(hidInp,boxDiv.nextSibling);
    }
  }
  var extra=document.getElementById("finHoneyExtra");
  if(extra){extra.innerHTML=isInc?('<div class="r2" style="margin-top:6px;"><div>'+L(t("fin_qty"))+'<input type="number" inputmode="decimal" step="0.1" id="finQty" placeholder="0.0" oninput="finCalcAmt()"></div><div>'+L(t("fin_price_kg"))+'<input type="number" inputmode="decimal" step="0.01" id="finPpk" placeholder="0.00" oninput="finCalcAmt()"></div></div>'):"";} 
};

window.finCalcAmt=function(){
  var qty=parseFloat(($q("finQty")||{}).value)||0;
  var ppk=parseFloat(($q("finPpk")||{}).value)||0;
  var amtEl=$q("finAmt");
  if(qty>0&&ppk>0&&amtEl&&!amtEl._userEdited){amtEl.value=(qty*ppk).toFixed(2);}
};

window.saveFin=function(id){
  var type=($q("finType")||{}).value||"expense";
  var amt=parseFloat(($q("finAmt")||{}).value)||0;
  if(!amt){toast("⚠️ "+(D.settings.lang==="en"?"Enter an amount!":"Introduceți suma!"));return;}
  var qty=parseFloat(($q("finQty")||{}).value)||null;
  var ppk=parseFloat(($q("finPpk")||{}).value)||null;
  // Read category: for expense use checkboxes, for income use select
  var category="";
  if(type==="expense"){
    var checked=document.querySelectorAll('input[name="finExpCats"]:checked');
    var cats=[];
    checked.forEach(function(cb){cats.push(cb.value);});
    category=cats.join(" + ");
    if(!category){toast("⚠️ "+(D.settings.lang==="en"?"Select at least one category!":"Selectați cel puțin o categorie!"));return;}
  } else {
    category=($q("finCat")||{}).value||"";
  }
  var o={id:id||uid(),type:type,
    date:($q("finDt")||{}).value||new Date().toISOString().slice(0,10),
    amount:amt,
    category:category,
    hiveId:($q("finHv")||{}).value||null,
    qty:qty,pricePerUnit:ppk,
    notes:($q("finNt")||{}).value||""};
  if(id){var ex=D.finances.find(function(f){return f.id===id;});if(ex)Object.assign(ex,o);}
  else{D.finances.push(o);}
  save();closeM();renderFinanciar();toast(t("fin_saved"),"💰");
};

// Auto-import honey harvest as income entries
window.finAutoHoney=function(){
  var isEN=D.settings.lang==="en";
  var ppkStr=prompt(isEN?"Enter honey price per kg (RON):":"Introduceți prețul pe kg de miere (RON):");
  if(!ppkStr)return;
  var ppk=parseFloat(ppkStr.replace(",","."));
  if(!ppk||ppk<=0){toast("⚠️ "+(isEN?"Invalid price!":"Preț invalid!"));return;}
  var added=0;
  D.honeyHarvests.forEach(function(h){
    var qty=h.actualQty||h.qty||0;
    if(!qty)return;
    // Check not already imported (by source ref)
    if(D.finances.some(function(f){return f._srcHarvestId===h.id;}))return;
    var cat=isEN?"Honey sales":"Vânzare miere";
    D.finances.push({id:uid(),type:"income",date:h.extractionDate||h.date||new Date().toISOString().slice(0,10),amount:parseFloat((qty*ppk).toFixed(2)),category:cat,hiveId:h.hiveId||null,qty:qty,pricePerUnit:ppk,notes:(h.honeyType||h.type||""),_srcHarvestId:h.id});
    added++;
  });
  if(added){save();renderFinanciar();toast(added+(isEN?" harvest entries imported as income!":" intrări importate ca venituri!"),"💰");}
  else toast(isEN?"All harvests already imported!":"Toate recoltele sunt deja importate!","ℹ️");
};

    D.finances.forEach(function(f){
      var hv=D.hives.find(function(h){return h.id===f.hiveId;});
      rowsF.push([isEN?(f.type==="income"?"Income":"Expense"):(f.type==="income"?"Venit":"Cheltuiala"),f.date||"",f.category||"",f.amount||0,hv?hv.name:"",f.qty||"",f.pricePerUnit||"",f.notes||""]);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rowsF),isEN?"Financials":"Financiar");
  }

  // Sheet: Varroa
  if(D.varroa&&D.varroa.length){
    var hdrV=isEN
      ?["Hive","Date","Method","Mites","Bees","Hours","Infestation %","Level","Brood","Notes"]
      :["Stup","Data","Metoda","Acarieni","Albine","Ore","Infestare %","Nivel","Puiet","Note"];
    var rowsV=[hdrV];
    D.varroa.forEach(function(v){
      var hv=D.hives.find(function(h){return h.id===v.hiveId;});
      var lvl=vrLevel(v);
      var lvlLabel=isEN?(lvl==="ok"?"OK":lvl==="watch"?"Monitor":"TREAT!"):(lvl==="ok"?"OK":lvl==="watch"?"Monitorizare":"TRATAMENT!");
      var mthLabel={natural:isEN?"Natural drop":"Cadere naturala",alcohol:isEN?"Alcohol wash":"Spalare alcool",sugar:isEN?"Sugar roll":"Zahar pudra",sticky:isEN?"Sticky board":"Placa adeziva"}[v.method]||v.method;
      rowsV.push([hv?hv.name:"",v.date||"",mthLabel,v.miteCount||0,v.beeCount||"",v.hours||"",v.infestationPct!=null?v.infestationPct:"",lvlLabel,v.hasBrood?(isEN?"Yes":"Da"):(isEN?"No":"Nu"),v.notes||""]);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rowsV),t("vr_export_sheet"));
  }

  // Sheet: Tasks
  if(D.tasks&&D.tasks.length){
    var hdrT=isEN
      ?["Title","Due Date","Priority","Category","Hive","Recurring","Every (days)","Done","Done Date","Notes"]
      :["Titlu","Termen","Prioritate","Categorie","Stup","Recurenta","La (zile)","Efectuata","Data efectuarii","Note"];
    var rowsT=[hdrT];
    D.tasks.forEach(function(tk){
      var hv=D.hives.find(function(h){return h.id===tk.hiveId;});
      var prioMap={high:isEN?"Urgent":"Urgenta",medium:isEN?"Medium":"Medie",low:isEN?"Low":"Scazuta"};
      rowsT.push([tk.title||"",tk.dueDate||"",prioMap[tk.priority]||tk.priority||"",tk.category||"",hv?hv.name:"",tk.recurring?(isEN?"Yes":"Da"):(isEN?"No":"Nu"),tk.recurDays||"",tk.done?(isEN?"Yes":"Da"):(isEN?"No":"Nu"),tk.doneDate||"",tk.notes||""]);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rowsT),t("tk_export_sheet"));
  }

  // Sheet: Feedings
  if(D.feedings&&D.feedings.length){
    var hdrHr=isEN
      ?["Date","Hive","All Hives","Feed Type","Quantity","Unit","Reason","Inv. Item","Notes"]
      :["Data","Stup","Toti stupii","Tip hrana","Cantitate","Unitate","Motiv","Articol inventar","Note"];
    var rowsHr=[hdrHr];
    var hrTypes=t("hr_types")||[];
    D.feedings.forEach(function(f){
      var hv=f.allHives?{name:isEN?"All":"Toti"}:D.hives.find(function(h){return h.id===f.hiveId;})||{name:"—"};
      var tp=hrTypes.find(function(x){return x.v===f.feedType;})||{l:f.feedType||""};
      var invItem=f.invItemId?D.inventory.find(function(i){return i.id===f.invItemId;}):null;
      rowsHr.push([f.date||"",hv.name,f.allHives?(isEN?"Yes":"Da"):(isEN?"No":"Nu"),tp.l.replace(/^[^ ]+ /,""),f.qty||0,f.unit||"kg",f.reason||"",invItem?invItem.name:"",f.notes||""]);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rowsHr),t("hr_export_sheet"));
  }

  var fname="BeeManager_"+new Date().toISOString().slice(0,10)+".xlsx";
  XLSX.writeFile(wb,fname);
  toast(isEN?"Excel exported! 📊":"Excel exportat! 📊","📊");
}
