// GOOGLE DRIVE SYNC MODULE
// ═══════════════════════════════════════════
var GDR={
  _token:null,
  _expiry:0,
  _fileId:null,
  _syncing:false,
  _tokenClient:null,

  isConnected:function(){return!!(D.settings.gConnected&&this._token&&Date.now()<this._expiry);},
  clientId:function(){return(D.settings.gClientId||"").trim();},

  // Initialize GIS token client (called lazily)
  _initClient:function(){
    if(this._tokenClient)return true;
    if(typeof google==="undefined"||!google.accounts||!google.accounts.oauth2){return false;}
    var self=this;
    this._tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:self.clientId(),
      scope:"https://www.googleapis.com/auth/drive.appdata",
      callback:function(resp){
        if(resp.error){toast("Google Drive: "+resp.error,"❌");return;}
        self._token=resp.access_token;
        self._expiry=Date.now()+(resp.expires_in||3600)*1000;
        D.settings.gConnected=true;
        D.settings.gLastSync=0;
        save(false);
        toast("✅ Google Drive conectat!","☁️");
        if(curP==="settings")renderSettings();
        self.sync();
      }
    });
    return true;
  },

  connect:function(){
    if(!this.clientId()){toast("Introduceți Client ID Google mai întâi","❌");return;}
    if(!this._initClient()){toast("Google API nu s-a încărcat (verificați conexiunea)","❌");return;}
    this._tokenClient.requestAccessToken({prompt:"consent"});
  },

  disconnect:function(){
    if(this._token&&typeof google!=="undefined"&&google.accounts)google.accounts.oauth2.revoke(this._token,function(){});
    this._token=null;this._fileId=null;this._tokenClient=null;
    D.settings.gConnected=false;D.settings.gLastSync=0;
    save(false);
    if(curP==="settings")renderSettings();
    toast("Deconectat de la Google Drive","📴");
  },

  // Refresh token silently (no prompt)
  _refresh:function(cb){
    var self=this;
    if(!this._initClient()){if(cb)cb(false);return;}
    this._tokenClient.callback=function(resp){
      if(resp.error){if(cb)cb(false);return;}
      self._token=resp.access_token;
      self._expiry=Date.now()+(resp.expires_in||3600)*1000;
      if(cb)cb(true);
    };
    this._tokenClient.requestAccessToken({prompt:""});
  },

  // Find or create the app data file on Drive
  _findFile:async function(){
    var r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27beemanager_data.json%27&fields=files(id)",
      {headers:{Authorization:"Bearer "+this._token}});
    var d=await r.json();
    return(d.files&&d.files.length)?d.files[0].id:null;
  },

  _doSync:async function(){
    var content=JSON.stringify(D);
    var fid=this._fileId||await this._findFile();
    if(fid){
      await fetch("https://www.googleapis.com/upload/drive/v3/files/"+fid+"?uploadType=media",
        {method:"PATCH",headers:{Authorization:"Bearer "+this._token,"Content-Type":"application/json"},body:content});
      this._fileId=fid;
    }else{
      var boundary="bmp_bnd_"+Date.now();
      var body="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"
        +JSON.stringify({name:"beemanager_data.json",parents:["appDataFolder"]})
        +"\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"
        +content+"\r\n--"+boundary+"--";
      var r2=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
        {method:"POST",headers:{Authorization:"Bearer "+this._token,"Content-Type":"multipart/related; boundary="+boundary},body:body});
      var d2=await r2.json();this._fileId=d2.id;
    }
    D.settings.gLastSync=Date.now();localStorage.setItem("bmp5",JSON.stringify(D));
    var el=document.getElementById("driveLastSync");
    if(el)el.textContent="Sincronizat: acum câteva secunde";
  },

  sync:async function(){
    if(this._syncing)return;
    if(!navigator.onLine){return;}
    // Refresh token if expired
    if(!this._token||Date.now()>=this._expiry-60000){
      var self=this;
      if(D.settings.gConnected){this._refresh(function(ok){if(ok)self.sync();});} 
      return;
    }
    this._syncing=true;
    try{await this._doSync();}catch(e){console.warn("Drive sync error:",e);}
    this._syncing=false;
  },

  loadFromDrive:async function(){
    if(!this._token)return null;
    try{
      var fid=this._fileId||await this._findFile();
      if(!fid)return null;this._fileId=fid;
      var r=await fetch("https://www.googleapis.com/drive/v3/files/"+fid+"?alt=media",
        {headers:{Authorization:"Bearer "+this._token}});
      return await r.json();
    }catch(e){return null;}
  },

  // Restore from Drive (merge with local, Drive wins)
  restore:async function(){
    if(!this.isConnected()){toast("Conectați mai întâi Drive-ul","❌");return;}
    toast("Se încarcă din Drive…","☁️");
    var remote=await this.loadFromDrive();
    if(!remote){toast("Nu s-au găsit date pe Drive","❌");return;}
    Object.assign(D,remote);
    save(false);
    location.reload();
  }
};

  document.getElementById("ov").addEventListener("click",closeSB);
  // Swipe down on more drawer handle to close
  var _ty0=0;
  var drw=document.getElementById("moreDrw");
  if(drw){
    drw.addEventListener("touchstart",function(e){_ty0=e.touches[0].clientY;},{passive:true});
    drw.addEventListener("touchend",function(e){
      if(e.changedTouches[0].clientY-_ty0>50)closeMoreDrw();
    },{passive:true});
  }
}
