<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f0e0e;--sur:#1a1919;--card:#222121;--bdr:#2c2b2b;--txt:#f5f3ef;--mut:#b9b5ae;--gold:#e6b422;--gold2:#f5c542;--danger:#e07c4c;--ok:#6fbf4c;--info:#4a9eff;--sh:0 8px 24px rgba(0,0,0,.45);--rl:20px;--rm:14px;--rs:10px;--sw:256px;}
body{background:var(--bg);color:var(--txt);overflow-x:hidden;}
body.light{--bg:#fefaf0;--sur:#fff7e8;--card:#ffffff;--bdr:#f0e3c9;--txt:#1f1b13;--mut:#5c564b;}
.app{display:flex;min-height:100vh;}
.sb{width:var(--sw);background:var(--sur);border-right:1px solid var(--bdr);position:fixed;height:100vh;z-index:200;overflow-y:auto;transition:transform .3s ease;display:flex;flex-direction:column;}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;}
.sb-logo .nm{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--gold),#ffcf4a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ni{display:flex;align-items:center;gap:11px;padding:11px 16px;margin:2px 7px;border-radius:var(--rs);color:var(--mut);cursor:pointer;transition:all .18s;font-size:.88rem;min-height:44px;}
.ni i{width:17px;text-align:center;font-size:.95rem;}
.ni.on{background:rgba(230,180,34,.15);color:var(--gold);border-left:3px solid var(--gold);padding-left:13px;}
.ni:hover:not(.on){background:rgba(230,180,34,.07);color:var(--txt);}
.main{flex:1;margin-left:var(--sw);padding:20px 24px;transition:margin .3s;}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;}
.ov.show{display:block;}
.tb{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:var(--sur);border-bottom:1px solid var(--bdr);z-index:150;align-items:center;padding:0 12px;gap:10px;}
.tb-t{font-weight:700;font-size:.95rem;color:var(--gold);flex:1;}
.bgr{background:none;border:none;color:var(--gold);font-size:1.25rem;cursor:pointer;padding:8px;box-shadow:none;min-height:auto;}
.bgr:hover{transform:none;filter:none;}
.g{display:grid;gap:14px;margin-bottom:18px;}
.gs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.gc{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
.c{background:var(--card);border-radius:var(--rm);padding:15px;box-shadow:var(--sh);border:1px solid rgba(230,180,34,.18);transition:transform .2s,box-shadow .2s;}
.c:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.55);}
.cl{font-size:.73rem;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);margin-bottom:3px;}
.cv{font-size:1.9rem;font-weight:800;margin:5px 0;}
.cs{font-size:.75rem;color:var(--mut);}
.ct{font-size:.92rem;font-weight:700;margin-bottom:9px;color:var(--gold2);}
.btn{background:linear-gradient(145deg,var(--gold),#c8911a);border:none;padding:10px 18px;border-radius:40px;font-weight:700;color:#121212;cursor:pointer;transition:all .18s;font-size:.86rem;min-height:40px;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{filter:brightness(1.08);}
.sm{padding:7px 12px;font-size:.76rem;min-height:32px;}
.gh{background:rgba(255,255,255,.09);color:var(--txt);}
.bd{background:linear-gradient(145deg,#e07c4c,#c05a30);color:#fff;}
.be{background:rgba(74,158,255,.14);color:var(--info);border:1px solid rgba(74,158,255,.28);}
.be:hover{background:rgba(74,158,255,.24);}
.br{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.bg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap;}
.gg{background:rgba(111,191,76,.2);color:#6fbf4c;}
.gy{background:rgba(230,180,34,.2);color:#e6b422;}
.gr{background:rgba(224,124,76,.2);color:#e07c4c;}
.gb{background:rgba(74,158,255,.2);color:#4a9eff;}
.al{padding:9px 13px;border-radius:var(--rs);margin:7px 0;font-size:.83rem;}
.alw{background:rgba(230,180,34,.12);border-left:4px solid var(--gold);}
.ald{background:rgba(224,124,76,.12);border-left:4px solid var(--danger);}
.alo{background:rgba(111,191,76,.12);border-left:4px solid var(--ok);}
.ali{background:rgba(74,158,255,.12);border-left:4px solid var(--info);}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;}
.mb-b{background:var(--card);border-radius:var(--rl);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:20px;border-top:3px solid var(--gold);}
.mt{font-size:1.1rem;font-weight:800;color:var(--gold);margin-bottom:13px;}
label.L{font-size:.78rem;font-weight:700;color:var(--gold);display:block;margin-top:9px;margin-bottom:3px;}
input,select,textarea{background:var(--sur);border:1px solid var(--bdr);padding:9px 12px;border-radius:var(--rs);color:var(--txt);width:100%;font-size:.88rem;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
input[type=checkbox],input[type=radio]{width:auto;margin-right:5px;}
.hint{font-size:.66rem;color:var(--mut);margin-top:2px;display:block;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.dv{border-top:1px solid var(--bdr);margin:12px 0;padding-top:11px;}
.stt{font-size:.88rem;font-weight:700;color:var(--gold2);margin-bottom:7px;}
.ck{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:.85rem;}
.ck label{color:var(--txt);margin:0;}
.wp{display:flex;align-items:center;gap:11px;padding:12px;background:rgba(255,255,255,.04);border-radius:var(--rm);margin-top:9px;}
.wi{font-size:2rem;}
.gauge{background:rgba(0,0,0,.25);border-radius:20px;height:6px;margin:8px 0;overflow:hidden;}
.gf{height:100%;background:linear-gradient(90deg,var(--gold),#ffcf4a);border-radius:20px;}
.gl{display:flex;justify-content:space-between;font-size:.63rem;color:var(--mut);}
.bb{display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--rs);margin-top:8px;}
.sb2{display:flex;gap:9px;align-items:center;margin:10px 0;}
.sb2 input{margin:0;flex:1;}
.est{background:rgba(230,180,34,.06);border:1px solid rgba(230,180,34,.15);border-radius:var(--rm);padding:12px;margin:7px 0;}
.er{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.er input[type=number]{width:70px;flex-shrink:0;margin:0;}
.er select{flex:1;margin:0;}
.esb{font-size:.76rem;color:var(--mut);min-width:52px;}
.etot{font-size:1.05rem;font-weight:800;color:var(--gold);margin-top:6px;}
.rt{width:100%;border-collapse:collapse;margin-top:7px;font-size:.8rem;}
.rt th{padding:6px 9px;text-align:left;color:var(--gold);background:rgba(230,180,34,.1);}
.rt td{padding:6px 9px;border-bottom:1px solid var(--bdr);}
.sa{background:rgba(224,124,76,.12);border:1px solid var(--danger);border-radius:var(--rm);padding:12px;margin-bottom:13px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border-left:5px solid var(--gold);padding:10px 18px;border-radius:40px;z-index:2000;box-shadow:var(--sh);font-size:.86rem;animation:ti .3s;}
@keyframes ti{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:900px){:root{--sw:215px;}.main{padding:14px;}.gs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}}
/* TOP NAV (mobile) */
.tnav{display:none;}
@media(max-width:650px){
  .sb{display:none;}
  .tb{display:none;}
  .main{margin-left:0;padding:12px;padding-top:68px;padding-bottom:12px;}
  .gs{grid-template-columns:1fr 1fr;}
  .gc{grid-template-columns:1fr;}
  .r2,.r3{grid-template-columns:1fr;}
  .mb{padding:0;align-items:flex-end;}
  .mb-b{max-height:92vh;border-radius:var(--rl) var(--rl) 0 0;}
  .toast{left:12px;right:12px;bottom:16px;text-align:center;}
  .tnav{display:flex;position:fixed;top:0;left:0;right:0;height:56px;background:var(--sur);border-bottom:2px solid var(--bdr);z-index:200;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:stretch;}
  .tnav::-webkit-scrollbar{display:none;}
  .tnav-logo{display:flex;align-items:center;padding:0 10px 0 12px;gap:5px;flex-shrink:0;border-right:1px solid var(--bdr);}
  .tnav-logo span{font-size:1.15rem;}
  .tni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 13px;min-width:58px;flex-shrink:0;color:var(--mut);cursor:pointer;transition:color .15s;border-bottom:3px solid transparent;-webkit-tap-highlight-color:transparent;}
  .tni i{font-size:.88rem;}
  .tni span{font-size:.56rem;font-weight:600;white-space:nowrap;}
  .tni.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(230,180,34,.07);}
  .tni:active{opacity:.7;}
}
@media(max-width:380px){.gs{grid-template-columns:1fr;}}
@media(min-width:1350px){.main{padding:24px 36px;}.gs{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));}.gc{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}}
/* FIX: Touch targets - minimum 44x44px for all interactive elements */
.btn{min-height:44px;min-width:44px;padding:10px 18px;}
.btn.sm{min-height:40px;min-width:36px;padding:8px 12px;}
.ni,.tni{min-height:44px;}
input,select,textarea{min-height:44px;font-size:16px !important;-webkit-appearance:none;}
input[type=checkbox],input[type=radio]{min-height:auto;min-width:auto;width:20px;height:20px;cursor:pointer;}
/* FIX: Active/pressed effect on all interactive elements */
.btn:active{transform:scale(0.97);transition:transform 0.05s;}
.tni:active,.ni:active{opacity:0.7;}
/* FIX: Table horizontal scroll on mobile */
.rt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative;}
.rt{display:table;white-space:nowrap;min-width:100%;}
/* FIX: Card buttons - don't break awkwardly */
.br .btn.sm{flex-shrink:0;}
/* FIX: confirmModal styling */
.confirm-msg{font-size:.95rem;line-height:1.5;margin:10px 0 16px 0;color:var(--txt);}
/* FIX: Required field indicator */
.L.required::after{content:" *";color:var(--danger);font-size:.7rem;}
/* FIX: Error state for inputs */
input.err,select.err{border-color:var(--danger);background:rgba(224,124,76,.07);}
.field-err{font-size:.72rem;color:var(--danger);margin-top:3px;display:block;}
</style>

  };

function initLoc(){
  if(D.userLoc){var age=D.weather?(Date.now()-(D.weather.ts||0)):Infinity;if(age>15*60*1000)fetchW(D.userLoc.lat,D.userLoc.lon);}
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){D.userLoc={lat:p.coords.latitude,lon:p.coords.longitude};save(false);fetchW(p.coords.latitude,p.coords.longitude);},
      function(){if(!D.weather)toast("📍 "+(D.settings.lang==="en"?"Enable location for real weather":"Activați locația pentru vreme reală"));},
      {timeout:8000}
    );
  }
}

async function fetchW(lat,lon){
  try{
    var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,precipitation,weathercode,windspeed_10m,relativehumidity_2m&timezone=auto&forecast_days=1");
    if(!r.ok)throw 0;
    var d=await r.json(),c=d.current,wi=wmoI(c.weathercode);
    D.weather={temp:Math.round(c.temperature_2m*10)/10,prec:c.precipitation,wc:c.weathercode,wind:Math.round(c.windspeed_10m),hum:c.relativehumidity_2m,ic:wi.i,rain:wi.r||c.precipitation>0,ts:Date.now()};
    save(false);
    if(curP==="dashboard")renderDashboard();
  }catch(e){console.warn("Weather failed",e);}
}

function beeAct(w){
  if(!w)return{ic:"❓",ttl:t("bee_unknown_t"),det:t("bee_unknown_d"),bg:"rgba(255,255,255,.04)"};
  var temp=w.temp,rain=w.rain||(w.prec>0),wind=w.wind;
  if(rain)return{ic:"🌧️",ttl:t("bee_rain_t"),det:t("bee_rain_d"),bg:"rgba(74,158,255,.12)"};
  if(temp<=8)return{ic:"❄️",ttl:t("bee_freeze_t"),det:t("bee_freeze_d"),bg:"rgba(74,158,255,.1)"};
  if(temp<=12)return{ic:"🥶",ttl:t("bee_cold_t"),det:t("bee_cold_d"),bg:"rgba(74,158,255,.08)"};
  if(temp<=15)return{ic:"🐝",ttl:t("bee_clean_t"),det:t("bee_clean_d"),bg:"rgba(230,180,34,.08)"};
  if(wind>30)return{ic:"💨",ttl:t("bee_wind_t"),det:t("bee_wind_d"),bg:"rgba(224,124,76,.1)"};
  if(temp>38)return{ic:"🌡️",ttl:t("bee_heat_ext_t"),det:t("bee_heat_ext_d"),bg:"rgba(224,124,76,.2)"};
  if(temp>33)return{ic:"🌡️",ttl:t("bee_heat_t"),det:t("bee_heat_d"),bg:"rgba(224,124,76,.1)"};
  if(temp>=20)return{ic:"🐝🐝🐝",ttl:t("bee_active_t"),det:t("bee_active_d"),bg:"rgba(111,191,76,.1)"};
  return{ic:"🐝🐝",ttl:t("bee_good_t"),det:t("bee_good_d"),bg:"rgba(230,180,34,.06)"};
}

// HELPERS
// ═══════════════════════════════════════════
function doy(y,m,d){return Math.floor((new Date(y,m-1,d)-new Date(y,0,0))/86400000);}
function cdoy(){var n=new Date();return doy(n.getFullYear(),n.getMonth()+1,n.getDate());}
function getLatOffset(){
  // Adjust bloom dates by latitude vs 45.5°N (Central Romania/Europe reference)
  // ~4 days later per degree north, ~4 days earlier per degree south
  if(!D.userLoc)return 0;
  return Math.round((D.userLoc.lat-45.5)*4);
}
function getFlow(){
  var cd=cdoy(),yr=new Date().getFullYear(),off=getLatOffset();
  return PLANTS.find(function(p){return cd>=doy(yr,p.sm,p.sd)+off&&cd<=doy(yr,p.em,p.ed)+off;})||null;
}
function sBadge(s){

  return'<span class="bg gr">'+t("str_weak")+'</span>';
}

function strCalc(b){var n=parseInt(b)||0;if(n>=6)return"puternic";if(n>=3)return"mediu";return"slab";}
function xv(ex,f,d){return(ex&&ex[f]!==undefined&&ex[f]!==null)?ex[f]:d;}

function toF(c){return Math.round((c*9/5+32)*10)/10;}
function toC(f){return Math.round(((f-32)*5/9)*10)/10;}
function showTemp(c){
  if(c===null||c===undefined||c==="")return"—";

  if(c===null||c===undefined||c==="")return"";

function parseTempInput(val){
  // Convert form input value back to Celsius for storage
  if(val===null||val===undefined||val==="")return null;

function mapWeatherLabel(){
  if(!D.weather||D.weather.wc===undefined)return"";
  var wc=D.weather.wc;var wo=t("wo");
  if(wc===0||wc===1)return wo[0];
  if(wc===2)return wo[1];

  if((wc>=51&&wc<=65)||(wc>=80&&wc<=82)||(wc===61||wc===63||wc===65))return wo[3]; // FIX: explicit rain codes
  if(wc>=95)return wo[5];
  return wo[1];
}

function openM(html){
  var bg=document.createElement("div");bg.className="mb";bg.id="MB";
  bg.innerHTML='<div class="mb-b">'+html+'</div>';
  document.body.appendChild(bg);
  bg.addEventListener("click",function(e){if(e.target===bg)closeM();});
  // FIX: Auto-focus first input in modal for better UX
  setTimeout(function(){
    var first=bg.querySelector('input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="date"]),select');
    if(first){try{first.focus();}catch(e){}}
  },120);
  // FIX: Enter key submits form in modal (except textarea)
  bg.addEventListener("keydown",function(e){
    if(e.key!=="Enter"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
    var saveBtn=bg.querySelector(".btn.sm.gh")?null:bg.querySelector('.mb-b .btn:not(.gh):not(.bd)');
    if(saveBtn){e.preventDefault();saveBtn.click();}
  });
}
function closeM(){var el=document.getElementById("MB");if(el)el.remove();}

function renderDashboard(){
  var w=D.weather,act=beeAct(w),fl=getFlow();
  var low=D.inventory.filter(function(i){return i.qty<=i.min;});
  var totH=D.honeyHarvests.reduce(function(s,h){return s+(h.actualQty||h.qty||0);},0);
  var pend=D.treatments.filter(function(t2){return new Date(t2.date)>new Date();}).length;
  var lastArr=[].concat(D.inspections).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var last=lastArr[0];
  var tmpPct=w?Math.min(100,Math.max(0,(w.temp/40)*100)):0;
  var ago=w?Math.round((Date.now()-w.ts)/60000):null;
  var agoL=ago!==null?(ago<2?"acum/now":"acum "+ago+" min"):"";
  var strong=D.hives.filter(function(h){return h.str==="puternic";}).length;
  var med=D.hives.filter(function(h){return h.str==="mediu";}).length;
  var slb=D.hives.filter(function(h){return h.str==="slab";}).length;

  // Flow card
  var culesH="";
  if(w&&(w.rain||(w.prec>0))){
    culesH='<div class="bb" style="background:rgba(74,158,255,.12)"><span style="font-size:1.6rem">🌧️</span><div><strong>'+t("fl_rain")+'</strong><br><small style="color:var(--mut)">'+t("fl_rain_d")+'</small></div></div>';
  } else if(fl){
    var tmpOk=w&&w.temp>=fl.nt[0]&&w.temp<=fl.nt[1];
    culesH='<div class="bb" style="background:rgba(111,191,76,.1)"><span style="font-size:1.6rem">'+plantIC(fl)+'</span><div><strong>'+t("fl_active")+' '+plantN(fl)+'</strong>'+(w?' — '+showTemp(w.temp)+' <span class="bg '+(tmpOk?'gg':'gy')+'">'+(tmpOk?t("fl_opt_t"):t("fl_sub_t"))+'</span>':'')+'<br><small style="color:var(--mut)">'+plantDC(fl)+' '+t("fl_opt_range")+' '+showTempRange(fl.nt[0],fl.nt[1])+'</small></div></div>';
  } else {
    culesH='<div class="bb" style="background:rgba(224,124,76,.12)"><span style="font-size:1.6rem">⏸️</span><div><strong>'+t("fl_between")+'</strong><br><small style="color:var(--mut)">'+t("fl_between_d")+'</small></div></div>';
  }

  // Weather card
  var wCard="";
  if(w){
    var wLbl=w.wc!==undefined?wmoLabel(w.wc):(w.lbl||"");
    wCard='<div class="c"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;"><div class="cl">🌦️ '+(agoL?'— '+agoL:'')+'</div><button class="btn sm gh" onclick="if(D.userLoc)fetchW(D.userLoc.lat,D.userLoc.lon)">'+t("w_refresh")+'</button></div>'
      +'<div class="wp" style="background:'+act.bg+'"><span class="wi">'+w.ic+'</span><div>'
      +'<div style="font-size:1.4rem;font-weight:800">'+showTemp(w.temp)+' <small style="font-size:.9rem;font-weight:400">'+wLbl+'</small></div>'
      +'<div style="font-size:.76rem;color:var(--mut)">💨 '+w.wind+' km/h · 💧 '+w.hum+'% · 🌧️ '+w.prec+' mm</div>'
      +'<div style="color:var(--gold);font-weight:700;margin-top:3px;">'+act.ic+' '+act.ttl+'</div>'
      +'<div style="font-size:.74rem;color:var(--mut)">'+act.det+'</div>'
      +'</div></div>'
      +'<div class="gauge"><div class="gf" style="width:'+tmpPct+'%"></div></div>'
      +(function(){var gl=tempGaugeLabels();return'<div class="gl">'+gl.map(function(l){return'<span>'+l+'</span>';}).join('')+'</div>';})()
      +culesH+'</div>';
  } else {
    wCard='<div class="c"><div class="cl">🌦️</div><div class="al alw" style="margin-top:7px;">'+t("w_no_loc")+'</div>'+culesH+'</div>';
  }

  // Low stock alert
  var stockA=low.length?'<div class="sa"><strong>'+t("dash_low_stock_alert")+' — '+low.length+'</strong>'+low.map(function(i){return'<div style="margin-top:3px;font-size:.8rem;">📦 <strong>'+i.name+'</strong>: '+i.qty+' '+t("inv_units")+' ('+t("inv_min_d")+' '+i.min+')</div>';}).join("")+'<button class="btn sm" style="margin-top:8px" onclick="go(\'inventory\')">'+t("dash_manage_inv")+'</button></div>':"";

  // Pastorare active widget
  var pastActive=D.pastorage.filter(function(p){return !p.endDate||new Date(p.endDate)>=new Date();});
  var pastHTML="";
  if(pastActive.length){
    pastHTML='<div class="c" style="margin-top:14px;"><div class="ct">'+t("dash_past_label")+'</div>'
      +pastActive.map(function(p){
        var hv=D.hives.find(function(h){return h.id===p.hiveId;});
        var days=Math.round((Date.now()-new Date(p.startDate))/86400000);
        return'<div class="bb" style="background:rgba(230,180,34,.06);margin-top:7px;">'
          +'<span style="font-size:1.4rem">🚚</span>'
          +'<div><strong>'+(hv?hv.name:"—")+'</strong> → '+p.location
          +'<br><small style="color:var(--mut)">'+t("past_target_d")+' '+p.target+' · '+days+' '+t("past_days")+'</small></div>'
          +'<button class="btn sm be" onclick="go(\'pastorare\')" style="margin-left:auto;flex-shrink:0;">→</button>'
          +'</div>';
      }).join("")
      +'</div>';
  }

  var lastHiveName=last?D.hives.find(function(h){return h.id===last.hiveId;})?.name||"":"";

  setP('<h1 style="margin-bottom:16px;font-size:1.35rem;"><i class="fas fa-tachometer-alt" style="color:var(--gold)"></i> '+t("dash_title")+'</h1>'
    +stockA
    +'<div class="g gs">'
    +'<div class="c"><div class="cl">'+t("dash_colonies")+'</div><div class="cv">'+D.hives.length+'</div><div class="cs">'+strong+' '+t("dash_s")+' · '+med+' '+t("dash_m")+' · '+slb+' '+t("dash_w")+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_queens_active")+'</div><div class="cv">'+D.queens.filter(function(q){return q.status==="activă";}).length+'</div><div class="cs">'+D.queens.filter(function(q){return q.status==="în imperechere";}).length+' '+t("dash_mating")+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_honey_kg")+'</div><div class="cv">'+totH.toFixed(1)+'</div><div class="cs">'+D.honeyHarvests.length+' '+t("dash_sessions")+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_treatments")+'</div><div class="cv">'+pend+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_last_insp")+'</div><div class="cv" style="font-size:1rem">'+(last?last.date:"—")+'</div><div class="cs">'+lastHiveName+'</div></div>'
    +'<div class="c"><div class="cl">'+t("dash_low_stock")+'</div><div class="cv" style="color:'+(low.length?"var(--danger)":"var(--ok)")+'">'+low.length+'</div></div>'
    +'</div>'+wCard+pastHTML);
}

function renderHives(q){
  q=q||"";
  var list=q?D.hives.filter(function(h){return(h.name+h.loc+String(h.num||"")).toLowerCase().includes(q.toLowerCase());}):D.hives;
  var cards=list.map(function(h){
    var qn=D.queens.find(function(queen){return queen.hive===h.id;});
    var li=[].concat(D.inspections).filter(function(i){return i.hiveId===h.id;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);})[0];
    var dot=h.sc==="green"?"🟢":h.sc==="yellow"?"🟡":"🔴";
    var qStatCls=qn?(t("qs_cls")||{})[qn.status]||"gy":"gr";
    var qStatLbl=qn?(t("q_statuses")||[]).find(function(s){return s[0]===qn.status;})?.[1]||qn.status:"";
    var qBadge=qn?qn.race+' — <span class="bg '+qStatCls+'">'+qStatLbl+'</span>':'<span style="color:var(--danger)">'+t("h_no_q")+'</span>';
    return'<div class="c">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:7px;"><h3 style="font-size:.92rem;">'+dot+' '+h.name+'</h3>'+sBadge(h.str)+'</div>'
      +'<div style="font-size:.76rem;color:var(--mut);margin-bottom:9px;">'+matIc(h.mat)+' '+(h.mat||"Lemn")+' · '+(h.mod||"Dadant")+' · 📍 '+h.loc+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:9px;">'
      +'<div style="text-align:center;background:rgba(255,255,255,.04);border-radius:8px;padding:6px;"><div style="font-size:1.15rem;font-weight:800">'+h.fT+'</div><div style="font-size:.62rem;color:var(--mut)">'+t("h_tot2")+'</div></div>'
      +'<div style="text-align:center;background:rgba(230,180,34,.1);border-radius:8px;padding:6px;"><div style="font-size:1.15rem;font-weight:800;color:var(--gold)">'+h.fB+'</div><div style="font-size:.62rem;color:var(--mut)">'+t("h_br2")+'</div></div>'
      +'<div style="text-align:center;background:rgba(111,191,76,.1);border-radius:8px;padding:6px;"><div style="font-size:1.15rem;font-weight:800;color:var(--ok)">'+h.fH+'</div><div style="font-size:.62rem;color:var(--mut)">'+t("h_hn2")+'</div></div>'
      +'</div>'
      +(h.hasMag?'<div style="font-size:.78rem;margin-bottom:4px;">📦 '+t("h_mag_l")+' '+h.magF+' '+t("inv_units")+'</div>':"")
      +'<div style="font-size:.78rem;margin-bottom:4px;">👑 '+qBadge+'</div>'
      +'<div style="font-size:.73rem;color:var(--mut)">📅 '+t("h_last_i")+' '+(li?li.date:"—")+'</div>'
      +(h.notes?'<div style="font-size:.7rem;color:var(--mut);margin-top:3px;font-style:italic">'+h.notes+'</div>':"")
      +'<div class="br"><button class="btn sm" onclick="hiveM(\''+h.id+'\')">✏️</button><button class="btn sm be" onclick="inspM(\''+h.id+'\')">'+t("insp_by_h")+'</button><button class="btn sm bd" onclick="delH(\''+h.id+'\')">🗑️</button></div>'
      +'</div>';
  }).join("");
  setP('<h2 style="margin-bottom:12px;font-size:1.2rem;"><i class="fas fa-home" style="color:var(--gold)"></i> '+t("h_title")+' <span class="cs">('+D.hives.length+')</span></h2>'
    +'<div class="sb2"><button class="btn" onclick="hiveM()">'+t("h_new")+'</button><input placeholder="'+t("h_search")+'" value="'+q+'" oninput="debouncedHiveSearch(this.value)"></div>'
    +(list.length===0?'<div class="al ali">'+t("h_not_found")+' "'+q+'".</div>':'<div class="g gc">'+cards+'</div>'));
}

    save();renderHives();
  });
};

window.aStr=function(showT){
  var b=parseInt(($q("hFB")||{}).value)||0;var s=strCalc(b);
  var el=$q("hSt");if(el)el.value=s;
  if(showT)toast(t("str_auto_t")+" "+t("str_"+s.replace("puternic","strong").replace("mediu","medium").replace("slab","weak")),"🤖");
};

window.saveH=function(id){
  var nm=(($q("hNm")||{}).value||"").trim();
  if(!nm){
    var el=$q("hNm");
    if(el){el.classList.add("err");el.focus();setTimeout(function(){el.classList.remove("err");},2500);}
    toast("⚠️ "+(t("h_name_l")));return;
  }
  var o={id:id||uid(),num:parseInt(($q("hNum")||{}).value)||null,name:nm,loc:($q("hLc")||{}).value||"",mat:($q("hMt")||{}).value||"Lemn",mod:($q("hMd")||{}).value||"Dadant 10 rame",fT:parseInt(($q("hFT")||{}).value)||0,fB:parseInt(($q("hFB")||{}).value)||0,fH:parseInt(($q("hFH")||{}).value)||0,str:($q("hSt")||{}).value||"mediu",hasMag:($q("hMg")||{}).value==="da",magF:parseInt(($q("hMgF")||{}).value)||0,sc:($q("hSc")||{}).value||"green",notes:($q("hNt")||{}).value||""};
  if(id){var ex=D.hives.find(function(h){return h.id===id;});if(ex)Object.assign(ex,o);}else{D.hives.push(o);}
  save();closeM();renderHives();
};

function renderInspections(){
  var sorted=[].concat(D.inspections).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var cards=sorted.map(function(i){
    var hv=D.hives.find(function(h){return h.id===i.hiveId;});
    var bp=t("bp")||[];var bpEntry=bp.find(function(x){return x[0]===i.bp;});
    var bpCls=i.bp==="compact"?"gg":i.bp==="necompact"?"gy":"gr";
    var bpLbl=bpEntry?bpEntry[1]:(i.bp||"—");
    return'<div class="c">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:5px;margin-bottom:6px;"><h3 style="font-size:.88rem;">'+(hv?hv.name:t("insp_hive"))+'</h3><span class="bg '+bpCls+'">'+bpLbl+'</span></div>'
      +'<div style="font-size:.75rem;color:var(--mut);margin-bottom:6px;">📅 '+i.date+' · '+(i.weather||"")+'  · 🌡️ '+showTemp(i.temp)+'</div>'
      +(i.structC&&i.structC!=="ok"?'<div class="al alw" style="padding:4px 8px;margin:3px 0;font-size:.75rem;">🔩 '+i.structC+(i.structN?" — "+i.structN:"")+'</div>':"")
      +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin:5px 0;">'
      +'<span class="bg '+(i.qSeen?"gg":"gy")+'">'+(i.qSeen?"👑 "+t("insp_q_seen"):"👑 ?")+'</span>'
      +'<span class="bg '+(i.eggs?"gg":"gy")+'">'+(i.eggs?"🥚 "+t("insp_eggs"):"❌")+'</span>'
      +'<span class="bg gb">🐝 '+(i.popPct||"?")+'%</span></div>'
      +'<div style="font-size:.78rem;">'+t("insp_brood")+': <b>'+(i.fB||0)+'</b> · '+t("insp_honey")+': <b>'+(i.fH||0)+'</b></div>'
      +(i.botci?'<div class="al alw" style="padding:4px 8px;margin:4px 0;font-size:.75rem;">🐛 '+i.botciN+' · '+(i.botciS||"")+(i.botciF?" — "+i.botciF:"")+'</div>':"")
      +'<div style="font-size:.78rem;">🦠 '+((i.diseases||[]).join(", ")||"—")+'</div>'
      +(i.notes?'<div style="font-size:.72rem;color:var(--mut);margin-top:3px;font-style:italic">'+i.notes+'</div>':"")
      +'<div class="br"><button class="btn sm be" onclick="inspM(\''+i.hiveId+'\',\''+i.id+'\')">✏️ '+t("insp_edit_t").replace("✏️ ","")+'</button><button class="btn sm bd" onclick="delInsp(\''+i.id+'\')">🗑️</button></div>'
      +'</div>';
  }).join("");
  setP('<h2 style="margin-bottom:12px;font-size:1.2rem;"><i class="fas fa-book" style="color:var(--gold)"></i> '+t("insp_title")+' <span class="cs">('+sorted.length+')</span></h2>'
    +'<button class="btn" style="margin-bottom:14px;" onclick="inspM(null)">'+t("insp_new")+'</button>'
    +(sorted.length===0?'<div class="al ali">'+t("insp_no")+'</div>':'<div class="g gc">'+cards+'</div>'));
}

function inspM(hiveId,editId){
  hiveId=hiveId||null;editId=editId||null;
  var ex=editId?D.inspections.find(function(i){return i.id===editId;}):null;
  var effHid=ex?ex.hiveId:hiveId;
  var hive=effHid?D.hives.find(function(h){return h.id===effHid;}):null;
  var disArr=ex?ex.diseases||[]:[];
  var mag=hive?hive.hasMag:(ex?ex.hasMag:false);
  var autoW=!ex&&D.weather?mapWeatherLabel():"";
  var autoT=(!ex&&D.weather)?fmtTempInput(D.weather.temp):"";
  var wtDefault=xv(ex,"weather",autoW);
  var tempDefault=xv(ex,"temp",autoT);
  var wo=t("wo"),sm=t("sm"),stc=t("stc"),bh=t("bh"),qq=t("qq"),bt=t("bt"),bp=t("bp"),sp=t("sp"),dis=t("dis");

    nFrames:parseInt(($q("iNF")||{}).value)||0,nFramesB:parseInt(($q("iNFB")||{}).value)||0,

    diseases:dis,diseaseN:($q("iDN")||{}).value||"",notes:($q("iNt")||{}).value||""
  };

function renderHoney(){

  D.honeyHarvests.forEach(function(h){var tp=h.honeyType||h.type||"?";if(!byT[tp])byT[tp]={e:0,a:0};byT[tp].e+=(h.estQty||0);byT[tp].a+=(h.actualQty||h.qty||0);});
  var reconRows=Object.keys(byT).map(function(tp){var d=byT[tp],df=d.a-d.e,ef=d.e>0?((d.a/d.e)*100).toFixed(0):"—";return'<tr><td><strong>'+tp+'</strong></td><td>'+d.e.toFixed(1)+' kg</td><td><strong>'+d.a.toFixed(1)+' kg</strong></td><td style="color:'+(df>=0?"var(--ok)":"var(--danger)")+'">'+(df>=0?"+":"")+df.toFixed(1)+' kg</td><td><span class="bg '+(parseInt(ef)>=85?"gg":parseInt(ef)>=65?"gy":"gr")+'">'+ef+'%</span></td></tr>';}).join("");
  var recon=Object.keys(byT).length?'<div class="c" style="margin-bottom:16px;"><div class="ct">'+t("hn_recon")+'</div><div style="overflow-x:auto;"><table class="rt"><thead><tr><th>'+t("hn_rc_t")+'</th><th>'+t("hn_rc_e")+'</th><th>'+t("hn_rc_r")+'</th><th>'+t("hn_rc_d")+'</th><th>'+t("hn_rc_ef")+'</th></tr></thead><tbody>'+reconRows+'</tbody></table></div><div style="font-size:.68rem;color:var(--mut);margin-top:5px;">'+t("hn_rc_note")+'</div></div>':"";
  var cards=D.honeyHarvests.map(function(h){

    var df=h.actualQty&&h.estQty?h.actualQty-h.estQty:null;

      +(h.notes?'<div style="font-size:.72rem;color:var(--mut);margin-top:3px;font-style:italic">'+h.notes+'</div>':"")

      +'</div>';

    +'<button class="btn" style="margin-bottom:14px;" onclick="honeyM()">'+t("hn_new")+'</button>'
    +recon
    +(D.honeyHarvests.length===0?'<div class="al ali">'+t("hn_no")+'</div>':'<div class="g gc">'+cards+'</div>'));

// ═══════════════════════════════════════════
// CALENDAR — weather & location aware
// ═══════════════════════════════════════════
function renderCalendar(){
  var isEN=D.settings.lang==="en";
  var yr=new Date().getFullYear(),cd=cdoy(),fl=getFlow(),w=D.weather,off=getLatOffset();

  function foragQuality(plant,wx){
    if(!wx||wx.temp===null||wx.temp===undefined)return{cls:"gy",ic:"❓",lbl:isEN?"No weather data":"Fără date meteo",score:0,pct:0}; // FIX: null safety
    var rain=wx.rain||wx.prec>0,temp=wx.temp,wind=wx.wind||0;
    if(rain)return{cls:"gb",ic:"🌧️",lbl:t("fl_rain"),score:0,pct:0};
    if(temp<plant.nt[0]-4)return{cls:"gr",ic:"❄️",lbl:isEN?"Too cold — no foraging":"Prea rece — fără cules",score:0,pct:5};
    if(temp<plant.nt[0])return{cls:"gy",ic:"🥶",lbl:t("fl_sub_t"),score:1,pct:30};
    if(wind>35)return{cls:"gy",ic:"💨",lbl:t("bee_wind_t"),score:1,pct:25};
    if(temp>plant.nt[1]+4)return{cls:"gy",ic:"🌡️",lbl:isEN?"Too hot — reduced secretion":"Prea cald — secreție redusă",score:1,pct:35};
    if(temp>plant.nt[1])return{cls:"gy",ic:"🌡️",lbl:t("bee_heat_t"),score:2,pct:60};
    if(wind>20)return{cls:"gy",ic:"💨",lbl:isEN?"Windy — moderate foraging":"Vântos — cules moderat",score:2,pct:60};
    var center=(plant.nt[0]+plant.nt[1])/2;
    var dist=Math.abs(temp-center)/((plant.nt[1]-plant.nt[0])/2);
    var pct=Math.min(100,Math.round((1-dist*0.3)*100));
    return{cls:"gg",ic:"🐝🐝🐝",lbl:t("bee_active_t"),score:3,pct:pct};
  }

  function daysLeft(plant){return Math.max(0,doy(yr,plant.em,plant.ed)+off-cd);}
  function doyToStr(dn){var d=new Date(yr,0,dn);return d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0");}

  var next=PLANTS.filter(function(p){return doy(yr,p.sm,p.sd)+off>cd;})
    .sort(function(a,b){return(doy(yr,a.sm,a.sd)+off)-(doy(yr,b.sm,b.sd)+off);}).slice(0,3);

  // Between-flow tips
  var bet="";
  if(!fl&&next.length>0){
    var dlB=(doy(yr,next[0].sm,next[0].sd)+off)-cd;
    bet='<div class="c" style="margin-top:13px;"><div class="ct">'+t("cal_between")+' — '+dlB+' '+t("cal_days_until")+' '+plantIC(next[0])+' '+plantN(next[0])+'</div>'
      +'<ul style="margin-left:16px;line-height:1.85;font-size:.84rem;">'
      +(t("cal_tasks")||[]).map(function(tk){return'<li>'+tk+'</li>';}).join("")+'</ul></div>';
  }

  if(fl){
    var q=foragQuality(fl,w);
    var dl2=daysLeft(fl);

    var tempGauge="";

      var tempPos=Math.min(98,Math.max(2,((w.temp-fl.nt[0]+rangeW*0.15)/(rangeW*1.3))*100));
      var barCol=q.score===3?"#6fbf4c":q.score===2?"#e6b422":"#4a9eff";
      tempGauge='<div style="margin-top:10px;">'
        +'<div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--mut);margin-bottom:4px;">'
        +'<span>❄️ '+showTemp(fl.nt[0])+'</span><span style="font-weight:700;color:var(--txt)">🌡️ '+showTemp(w.temp)+'</span><span>🔥 '+showTemp(fl.nt[1])+'</span></div>'
        +'<div style="position:relative;background:rgba(0,0,0,.3);border-radius:20px;height:10px;">'
        +'<div style="position:absolute;left:12%;right:12%;top:0;bottom:0;background:rgba(111,191,76,.2);border-radius:20px;"></div>'
        +'<div style="position:absolute;top:1px;bottom:1px;left:'+Math.max(1,tempPos-1.5)+'%;width:8px;background:'+barCol+';border-radius:20px;box-shadow:0 0 6px '+barCol+'88;"></div>'
        +'</div>'
        +'<div style="text-align:center;font-size:.64rem;color:var(--ok);margin-top:2px;">✅ '+(isEN?"optimal zone":"zonă optimă")+'</div></div>';

      +'<div style="background:rgba(0,0,0,.25);border-radius:20px;height:7px;overflow:hidden;">'
      +'<div style="width:'+q.pct+'%;height:100%;background:'+(q.score===3?"linear-gradient(90deg,var(--ok),#8de860)":q.score===2?"linear-gradient(90deg,var(--gold),#ffcf4a)":"linear-gradient(90deg,var(--info),#74b3ff)")+';border-radius:20px;transition:width .5s;"></div>'

    var wxStrip=w?'<div style="display:flex;gap:10px;font-size:.74rem;color:var(--mut);margin-top:6px;flex-wrap:wrap;">'
      +'<span>🌡️ '+showTemp(w.temp)+'</span><span>💨 '+w.wind+'km/h</span><span>💧 '+w.hum+'%</span>'

  setP('<h2 style="margin-bottom:12px;font-size:1.2rem;"><i class="fas fa-calendar-alt" style="color:var(--gold)"></i> '+t("cal_title")+'</h2>'

// ═══════════════════════════════════════════
// CALCULATOR APICOL
// ═══════════════════════════════════════════
var CALC_WORKER_AGE={egg:2,larva:6,capped:15};
var CALC_QUEEN_AGE={cell_uncapped:0,cell_capped:8,virgin:16,mating:20,laying:26};
var CALC_WORKER_TOTAL=42;
var CALC_QUEEN_MAX=26;

function calcAddDays(date,days){var r=new Date(date);r.setDate(r.getDate()+days);return r;}
function calcFmtDate(date){
  var isEN=D.settings.lang==="en";
  try{return date.toLocaleDateString(isEN?'en-GB':'ro-RO',{day:'numeric',month:'long',year:'numeric'});}
  catch(e){return date.toISOString().slice(0,10);}
}

window.calcTypeChange=function(){
  var isEN=D.settings.lang==="en";
  var tp=($q("calcType")||{}).value||"worker";
  var sel=$q("calcStage");if(!sel)return;
  var stages=t(tp==="worker"?"calc_worker_stages":"calc_queen_stages")||[];
  sel.innerHTML=stages.map(function(s){return'<option value="'+s.v+'">'+s.l+'</option>';}).join("");
  calcRender();
};

window.calcResetDate=function(){
  var el=$q("calcDate");
  if(el){el.value=new Date().toISOString().slice(0,10);calcRender();}
};

window.calcRender=function(){
  var isEN=D.settings.lang==="en";
  var dateStr=($q("calcDate")||{}).value;
  var tp=($q("calcType")||{}).value||"worker";
  var stage=($q("calcStage")||{}).value||"egg";
  var res=document.getElementById("calcResult");
  if(!res||!dateStr)return;
  var obsDate=new Date(dateStr);
  if(isNaN(obsDate.getTime())){res.innerHTML="";return;}

  if(tp==="worker"){
    var ageNow=CALC_WORKER_AGE[stage]||2;
    var daysLeft=CALC_WORKER_TOTAL-ageNow;
    var forageDate=calcAddDays(obsDate,daysLeft);
    var pct=Math.min(100,Math.max(0,(ageNow/CALC_WORKER_TOTAL)*100));
    var stages=t("calc_worker_stages")||[];
    var stEntry=stages.find(function(s){return s.v===stage;});
    var stLbl=stEntry?stEntry.l.replace(/^[^A-Za-zÀ-ÿ]*/,"").split("(")[0].trim():stage;
    if(daysLeft<=0){
      res.innerHTML='<div class="c" style="border-color:var(--ok);margin-top:0;">'
        +'<div class="ct" style="color:var(--ok);">✅ '+(isEN?"CURRENT STATUS":"STAREA ACTUALĂ")+'</div>'
        +'<div style="font-size:1.3rem;font-weight:800;color:var(--ok);margin:8px 0;">'+t("calc_already_foraging")+'</div>'
        +'<div><span class="bg gg">'+t("calc_stage_obs")+' '+stLbl+'</span></div>'
        +'</div>';
    } else {
      res.innerHTML='<div class="c" style="margin-top:0;">'
        +'<div class="ct">'+t("calc_foraging_title")+'</div>'
        +'<div style="font-size:1.5rem;font-weight:800;color:var(--gold);margin:8px 0;">📅 '+calcFmtDate(forageDate)+'</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'
        +'<span class="bg gy">⏳ '+daysLeft+' '+t("calc_days_left")+'</span>'
        +'<span class="bg gb">🐛 '+stLbl+'</span>'
        +'</div>'
        +'<div style="background:rgba(0,0,0,.25);border-radius:20px;height:10px;overflow:hidden;margin-bottom:4px;">'
        +'<div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,var(--gold),#ffcf4a);border-radius:20px;transition:width .5s;"></div>'
        +'</div>'
        +'<div style="font-size:.74rem;color:var(--mut);">'+t("calc_progress")+' '+Math.floor(pct)+'%</div>'
        +'</div>';
    }
  } else {
    var ageQ=CALC_QUEEN_AGE[stage]||0;
    var daysToMating=Math.max(0,24-ageQ);
    var daysToLay=Math.max(0,CALC_QUEEN_MAX-ageQ);
    var matingDate=calcAddDays(obsDate,daysToMating);
    var layingDate=calcAddDays(obsDate,daysToLay);
    var pctQ=Math.min(100,Math.max(0,(ageQ/CALC_QUEEN_MAX)*100));
    var qstages=t("calc_queen_stages")||[];
    var qEntry=qstages.find(function(s){return s.v===stage;});
    var qLbl=qEntry?qEntry.l.replace(/^[^A-Za-zÀ-ÿ]*/,"").trim():stage;
    if(daysToLay<=0){
      res.innerHTML='<div class="c" style="border-color:var(--ok);margin-top:0;">'
        +'<div class="ct" style="color:var(--ok);">'+t("calc_queen_active")+'</div>'
        +'<div style="font-size:1.3rem;font-weight:800;color:var(--ok);margin:8px 0;">'+t("calc_already_laying")+'</div>'
        +'<span class="bg gg">'+qLbl+'</span>'

        +'</div>'
        +'<div style="background:rgba(255,255,255,.05);border-radius:var(--rs);padding:10px;text-align:center;">'

        +'<div style="font-size:.95rem;font-weight:800;color:var(--gold);">'+calcFmtDate(layingDate)+'</div>'
        +'</div></div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'
        +'<span class="bg gy">⏳ '+daysToLay+' '+t("calc_days_to_lay")+'</span>'
        +'<span class="bg gb">'+qLbl+'</span>'

  }

// FIX: Excel Export using SheetJS
function exportToExcel(){
  if(typeof XLSX==="undefined"){toast(D.settings.lang==="en"?"SheetJS not loaded":"SheetJS indisponibil","❌");return;}
  var isEN=D.settings.lang==="en";
  var wb=XLSX.utils.book_new();

  // Sheet: Stupi / Hives
  var hdr=isEN?["Hive","Location","Material","Model","Total Frames","Brood Frames","Honey Frames","Strength"]:["Stup","Locatie","Material","Model","Rame Total","Rame Puiet","Rame Miere","Forta"];
  var rows=[hdr];
  D.hives.forEach(function(h){rows.push([h.name,h.loc,h.mat,h.mod,h.fT,h.fB,h.fH,h.str]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),isEN?"Hives":"Stupi");

  // Sheet: Inspections
  var hdr2=isEN?["Hive","Date","Weather","Temp","Brood","Honey","Strength","Notes"]:["Stup","Data","Vreme","Temp","Puiet","Miere","Forta","Note"];
  var rows2=[hdr2];
  D.inspections.forEach(function(i){
    var hv=D.hives.find(function(h){return h.id===i.hiveId;});
    rows2.push([hv?hv.name:"?",i.date,i.weather,i.temp,i.fB,i.fH,i.str||"",i.notes||""]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows2),isEN?"Inspections":"Inspectii");

  // Sheet: Honey
  var hdr3=isEN?["Hive","Type","Date","Estimated(kg)","Actual(kg)","Moisture%","Quality"]:["Stup","Tip","Data","Estimat(kg)","Real(kg)","Umiditate%","Calitate"];
  var rows3=[hdr3];
  D.honeyHarvests.forEach(function(h){
    var hv=D.hives.find(function(hive){return hive.id===h.hiveId;});
    rows3.push([hv?hv.name:"General",h.honeyType||h.type,h.extractionDate||h.date,h.estQty||0,h.actualQty||h.qty||0,h.humidity||"",h.quality||""]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows3),isEN?"Honey":"Miere");

  // Sheet: Treatments
  var hdr4=isEN?["Hive","Product","Date","Dose","Efficacy","Notes"]:["Stup","Produs","Data","Doza","Eficacitate","Note"];
  var rows4=[hdr4];
  D.treatments.forEach(function(tr){
    var hv=D.hives.find(function(h){return h.id===tr.hiveId;});
    rows4.push([hv?hv.name:(isEN?"All hives":"Toti stupii"),tr.product,tr.date,tr.dosage||"",tr.efficacy||"",tr.notes||""]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows4),isEN?"Treatments":"Tratamente");

  // Sheet: Inventory
  var hdr5=isEN?["Name","Category","Quantity","Min Stock"]:["Denumire","Categorie","Cantitate","Stoc minim"];
  var rows5=[hdr5];
  D.inventory.forEach(function(i){rows5.push([i.name,i.cat,i.qty,i.min]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows5),isEN?"Inventory":"Inventar");

  // Sheet: Pastorage
  if(D.pastorage&&D.pastorage.length){
    var hdr6=isEN?["Hive","Location","Target","Start","End","Notes"]:["Stup","Locatie","Cules","Plecare","Intoarcere","Note"];
    var rows6=[hdr6];
    D.pastorage.forEach(function(p){
      var hv=D.hives.find(function(h){return h.id===p.hiveId;});
      rows6.push([hv?hv.name:"?",p.location||"",p.target||"",p.startDate||"",p.endDate||"",p.notes||""]);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows6),isEN?"Migratory":"Pastorare");
  }

  var fname="BeeManager_"+new Date().toISOString().slice(0,10)+".xlsx";
  XLSX.writeFile(wb,fname);
  toast(isEN?"Excel exported! 📊":"Excel exportat! 📊","📊");
}

// FIX: PDF export using existing html2pdf.js
function exportToPDF(){
  var isEN=D.settings.lang==="en";
  var pg=document.getElementById("pg");
  if(!pg){toast("❌");return;}
  var opt={margin:10,filename:"BeeManager_"+new Date().toISOString().slice(0,10)+".pdf",image:{type:"jpeg",quality:0.92},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}};
  toast(isEN?"Generating PDF...":"Generez PDF...","📄");
  html2pdf().set(opt).from(pg).save().then(function(){toast(isEN?"PDF exported!":"PDF exportat!","📄");});
}
